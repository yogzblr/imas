certhosts:
  - 127.0.0.1
certificatevalidtime: 8760h0m0s
configroot: /etc/imas/
farmerapiport: 5405
farmerbusport: 5406
farmerinterface: <DOMAIN OR IP HERE>
keyfile: /etc/imas/pki/farmer/tls-key.pem
nkeyfarmerprivfile: /etc/imas/pki/farmer/farmer.nkey
nkeyfarmerpubfile: /etc/imas/pki/farmer/farmer.nkey.pub
farmerorganization: <REPLACEME>
rootca: /etc/imas/pki/farmer/tls-rootca.pem
rootcapriv: /etc/imas/pki/farmer/tls-rootca-key.pem
pubkeys:
    admin:
        - <YOUR PUBKEY HERE>
# Sprout registration. With enrollment true (the default), sprouts enrol
# with a join token through POST /v1/enroll and the legacy PUT
# /pki/putnkey is not served. false serves only the legacy path, which
# needs the NKey's signature over a server nonce (GET /pki/nkeynonce) and
# an operator's accept.
# enrollment: true
# Interactive shell (imas ssh) sessions farmer relays. A session with no
# input for shellidletimeout ends (default 15m, at most 60m; a CLI may only
# ask for less), and any session ends after shellmaxduration (default and
# at most 8h).
# shellidletimeout: 15m
# shellmaxduration: 8h
