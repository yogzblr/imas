farmerinterface: <DOMAIN OR IP HERE>
farmerbusport: 5406
farmerapiport: 5405
# Outbound proxy for the bus connection only: an http:// (HTTP CONNECT) or
# socks5:// URL with an explicit port, optionally with the proxy's own
# user:password@. TLS to the bus stays end to end through it. The sprout's
# HTTP requests (enroll, refresh, recipes) follow HTTP_PROXY/HTTPS_PROXY/
# NO_PROXY from the environment instead. Empty (the default): dial directly.
# busproxyurl: http://proxy.example.com:3128
