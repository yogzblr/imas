farmerinterface: <DOMAIN OR IP HERE>
farmerbusport: 5406
farmerapiport: 5405
# The join token (jointoken, IMAS_JOIN_TOKEN or --join-token) is the
# registration_key from POST /v1/tenants/{tenant_id}/enrollment-keys:
# {key_id}.{secret}.{tenant_key_fingerprint}. The sprout checks the tenant
# key farmer's enrollment response names against the fingerprint before
# pinning it, and refuses a mismatch, so a proxy on the path to farmer that
# substitutes its own key is caught. enrollpinrequired: true (the default)
# also refuses a token without a fingerprint ({key_id}.{secret}); false
# enrolls with one, trusting the first tenant key farmer names, and logs a
# warning at every enrollment.
enrollpinrequired: true
# Outbound proxy for the bus connection only: an http:// (HTTP CONNECT) or
# socks5:// URL with an explicit port, optionally with the proxy's own
# user:password@. TLS to the bus stays end to end through it. The sprout's
# HTTP requests (enroll, refresh, recipes) follow HTTP_PROXY/HTTPS_PROXY/
# NO_PROXY from the environment instead. Empty (the default): dial directly.
# busproxyurl: http://proxy.example.com:3128
# How long to wait before each attempt to reach the bus after losing it, or
# while the first connect keeps failing: a random wait between 0 and a
# ceiling that starts at busreconnectbase and doubles with every failed
# attempt up to busreconnectcap, back to busreconnectbase once connected.
# The randomness keeps a fleet from reconnecting in step after a bus
# restart. Empty (the default): 2s and 5m. The sprout writes the defaults
# back into this file.
# busreconnectbase: 2s
# busreconnectcap: 5m
# How much older than the newest job this sprout already ran a missed
# dispatch it catches up on (from farmer's staged copy) may be stamped and
# still run. Farmer replicas stamp jobs on their own clocks, so a newer
# job can look slightly older. A job ID already handled is refused
# whatever this says. 0s: no tolerance. Empty (the default): 1m. At most
# 5m; anything else is logged and the default used.
# stagedrecipeclockskew: 1m
# How long this sprout keeps the private key a farmer-triggered
# payload-encryption key rotation replaced, so a payload farmer sealed to
# it just before the switch still opens. Also the shortest interval
# between two rotations. Empty (the default): 15m. Values below the
# sprout's enforced floor (twice its clock-skew tolerance) are raised to
# it, with a warning in the sprout's own log.
# sproutboxkeyprevgrace: 30m
# How long this sprout keeps a job's local log (<joblogdir>/<jid>.jsonl)
# after it was last written; the sprout's hourly reaper deletes older ones
# (docs/retention.md). Empty (the default): 720h (30 days). 0s keeps them
# for ever.
# joblogttl: 720h
# Repository this sprout installs its own updates from (self_update): the
# same repository it was installed from. The sprout reads the repository's
# own index (apt Packages, rpm repodata, or the NuGet flat container),
# takes the entry whose SHA-256 the signed update manifest names, and
# downloads it over HTTPS verified against the OS trust store, through
# HTTPS_PROXY/NO_PROXY from the environment. Empty (the default): the
# sprout refuses every self_update.
#   Debian family:  https://packages.buildkite.com/yogzblr/imasdeb/any/
#   RHEL and SUSE:  https://packages.buildkite.com/yogzblr/imasrpm/rpm_any/rpm_any/$basearch
#   Windows:        https://packages.buildkite.com/yogzblr/imasnget/nuget/index.json
# sproutupdaterepourl: https://packages.buildkite.com/yogzblr/imasdeb/any/
# How to read it: apt, rpm, nuget, or flat (a directory serving each package
# file under its own name). Empty (the default): this sprout's own package
# format.
# sproutupdaterepoformat: flat
# apt suite and component. Empty (the default): "any main".
# sproutupdaterepodist: any main
# NuGet package holding the MSI. Empty (the default): imas.sprout.windows.msi.
# sproutupdaterepopackageid: imas.sprout.windows.msi
# Read token for a private update repository, sent as HTTP basic auth
# (user "buildkite") to that repository's host only. Keep this file mode 0600.
# sproutupdaterepotoken: <token>
# Bounds on a self_update's reads from that repository, which the sprout
# doesn't trust until a download's SHA-256 matches the signed checksum. Each
# index (apt Packages, rpm repodata, NuGet service index) at most
# sproutupdatemaxindexbytes, downloaded and decompressed (default 16777216,
# 16 MiB; 65536 to 268435456). The package at most
# sproutupdatemaxpackagebytes (default and ceiling 536870912, 512 MiB; at
# least 1048576), and never above the size the repository's index declares
# for it. Each request at most sproutupdaterequesttimeout, body included
# (default 2m; 10s to 1h). The whole update, up to the installer, at most
# sproutupdatebudget (default 10m; 1m to 2h): when it runs out the update
# fails and the next one may start. Empty (the default): those defaults;
# an invalid value is logged and the default used.
# sproutupdatemaxindexbytes: 16777216
# sproutupdatemaxpackagebytes: 536870912
# sproutupdaterequesttimeout: 2m
# sproutupdatebudget: 10m
# Release GPG public keys a release's checksums.txt signature is verified
# against. The package installs and replaces this file (built from the
# repo's gpg-public-key.asc), mode 0600 and root's: the sprout refuses a
# keyring that is looser, not its own, or a symlink (unsafe_path); see
# packaging/etc/fleet-signing-keys.md.
# sproutfleetsigningkeyring: /etc/imas/fleet-signing-keys.asc
# Interactive shell (imas ssh). Sessions are sealed end to end and relayed
# by farmer; this sprout refuses any start that isn't. disableshell: true
# refuses every session on this host, whatever farmer allows. Default false.
# disableshell: false
# Shells a session may run. Empty (the default): the paths in /etc/shells.
# A session that names no shell gets /bin/sh if it is listed here, else the
# first entry.
# shellallowlist:
#   - /bin/sh
#   - /bin/bash
# Most sessions open at once on this sprout. Empty or 0 (the default): 8.
# shellmaxsessions: 8
