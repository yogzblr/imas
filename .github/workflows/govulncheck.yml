name: "govulncheck"
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/briefs/**"
      - "docs/status/**"
      - "docs/design/**"
      - "docs/security-review*.md"
  schedule:
    - cron: '23 13 * * 1'

jobs:
  govulncheck_job:
    runs-on: ubuntu-latest
    name: Run govulncheck
    steps:
      - uses: actions/checkout@v7
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: '1.26.x'
           go-package: ./...
