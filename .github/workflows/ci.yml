name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/briefs/**"
      - "docs/status/**"
      - "docs/design/**"
      - "docs/security-review*.md"

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]

    # A single-node PXC, the image and tag deploy/helm/farmer runs, for the
    # tests gated on IMAS_TEST_MYSQL_ROOT_DSN (the migration sets,
    # cmd/migrate, the lease and sweeper SQL; internal/migrations/mysqltest).
    # The health check pings over TCP, which PXC's init-time server does not
    # listen on, so the job starts only once the real server is up. The root
    # password is a throwaway for this job's container.
    services:
      pxc:
        image: percona/percona-xtradb-cluster:8.4.8-8.1
        env:
          MYSQL_ROOT_PASSWORD: imas-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pimas-ci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
      # Valkey, the image version the farmer chart's valkey subchart
      # (0.12.0) runs, for TestValkeyLimiterRealServer (internal/saasapi),
      # TestCheckEvictionRealServer (internal/valkeyconn) and the heartbeat
      # presence tests (internal/heartbeat), all through
      # SAASAPI_TEST_VALKEY_ADDR.
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Three Valkey nodes in cluster mode (the image's entrypoint appends
      # VALKEY_EXTRA_FLAGS), joined into a 3-shard Valkey Cluster by the
      # "Create the Valkey Cluster" step, for internal/heartbeat's cluster
      # tests (IMAS_TEST_VALKEY_CLUSTER_ADDR). The runner reaches the nodes
      # at the addresses they announce, their container addresses.
      valkey-c1:
        image: valkey/valkey:9.1.2
        env:
          VALKEY_EXTRA_FLAGS: "--cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      valkey-c2:
        image: valkey/valkey:9.1.2
        env:
          VALKEY_EXTRA_FLAGS: "--cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      valkey-c3:
        image: valkey/valkey:9.1.2
        env:
          VALKEY_EXTRA_FLAGS: "--cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      # The chart tests (deploy/helm/*/chart_test.go) render the charts with
      # the helm CLI and skip without it. Pinned to the version
      # publish-packages.yml lints and packages the charts with.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # Fetch the farmer chart's subcharts (pinned by Chart.lock) so
      # TestSubchartsRender runs. `helm dependency build` needs each
      # Chart.lock repository added first. The nats chart has no
      # dependencies; building it checks that stays so.
      - name: Build Helm chart dependencies
        run: |
          set -euo pipefail
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo add percona https://percona.github.io/percona-helm-charts
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build deploy/helm/farmer
          helm dependency build deploy/helm/nats

      # The real-Envoy tests (internal/envoytest, and the *ThroughRealEnvoy
      # tests of internal/api and internal/pki) run the shipped envoy.yaml in
      # the Envoy the nats chart pins (envoy.image.tag in
      # deploy/helm/nats/values.yaml); without IMAS_TEST_ENVOY_BIN they skip.
      - name: Extract the chart's Envoy binary
        run: |
          set -euo pipefail
          tag=$(sed -n '/repository: envoyproxy\/envoy/{n;s/^ *tag: *//p}' deploy/helm/nats/values.yaml)
          test -n "$tag"
          id=$(docker create "envoyproxy/envoy:$tag")
          mkdir -p "$RUNNER_TEMP/envoy"
          docker cp "$id:/usr/local/bin/envoy" "$RUNNER_TEMP/envoy/envoy"
          docker rm "$id"
          "$RUNNER_TEMP/envoy/envoy" --version
          echo "IMAS_TEST_ENVOY_BIN=$RUNNER_TEMP/envoy/envoy" >> "$GITHUB_ENV"

      # The real-OpenBao tests (internal/certs, internal/gatewayjwt,
      # internal/pki, internal/pki/natskeys, the farmer chart's Transit
      # policy tests and its Valkey password step,
      # internal/ingredients/sdb/openbao) against OpenBao
      # 2.7.1 dev servers, the version the charts pin: one on plain HTTP and
      # one on TLS for sdb. Without their addresses they skip. The tokens are
      # throwaways for this job's servers.
      - name: Start OpenBao dev servers
        env:
          OPENBAO_VERSION: "2.7.1"
          OPENBAO_SHA256: "0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243"
        run: |
          set -euo pipefail
          tarball="openbao_${OPENBAO_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}/${tarball}"
          echo "${OPENBAO_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir -p bin bao-tls bao-home bao-tls-home
          tar -xzf "$tarball" -C bin bao
          # The bao CLI on PATH too: the farmer chart's
          # TestOpenBaoValkeyPassword runs the bootstrap Job's script with it.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          token="$(openssl rand -hex 24)"
          sdb_token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "::add-mask::$sdb_token"
          # Each dev server writes its root token to $HOME/.vault-token
          # through the same $HOME/.vault-token.tmp, so two started together
          # under one HOME can race on the rename and one exits ("rename
          # .../.vault-token.tmp ...: no such file or directory"). A HOME
          # each; the tests take the tokens from the env set below. Ports:
          # a dev server also listens for its cluster on its port + 1, so
          # the TLS server's 8210 stays clear of 8200's cluster port, 8201.
          HOME="$RUNNER_TEMP/bao-home" nohup bin/bao server -dev -dev-root-token-id="$token" \
            -dev-listen-address=127.0.0.1:8200 > bao.log 2>&1 &
          HOME="$RUNNER_TEMP/bao-tls-home" nohup bin/bao server -dev -dev-tls -dev-root-token-id="$sdb_token" \
            -dev-tls-cert-dir="$RUNNER_TEMP/bao-tls" \
            -dev-listen-address=127.0.0.1:8210 > bao-tls.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8200/v1/sys/health > /dev/null &&
              [ -f bao-tls/vault-ca.pem ] &&
              curl -fsS --cacert bao-tls/vault-ca.pem https://127.0.0.1:8210/v1/sys/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8200/v1/sys/health > /dev/null ||
            ! curl -fsS --cacert bao-tls/vault-ca.pem https://127.0.0.1:8210/v1/sys/health > /dev/null; then
            # The servers' logs, without the dev root token and unseal key.
            for f in bao.log bao-tls.log; do
              echo "::group::$f"
              grep -v -e 'Root Token' -e 'Unseal Key' "$f" || true
              echo "::endgroup::"
            done
            exit 1
          fi
          {
            echo "IMAS_TEST_OPENBAO_ADDR=http://127.0.0.1:8200"
            echo "IMAS_TEST_OPENBAO_TOKEN=$token"
            echo "IMAS_CERTS_TEST_OPENBAO_ADDR=http://127.0.0.1:8200"
            echo "IMAS_CERTS_TEST_OPENBAO_TOKEN=$token"
            echo "IMAS_TEST_SDB_OPENBAO_ADDR=https://127.0.0.1:8210"
            echo "IMAS_TEST_SDB_OPENBAO_TOKEN=$sdb_token"
            echo "IMAS_TEST_SDB_OPENBAO_CACERT=$RUNNER_TEMP/bao-tls/vault-ca.pem"
          } >> "$GITHUB_ENV"

      # Join the three cluster-mode nodes into one Valkey Cluster of three
      # shards (no replicas), wait until it reports ok, and hand its first
      # node's address to the tests.
      - name: Create the Valkey Cluster
        env:
          C1: ${{ job.services.valkey-c1.id }}
          C2: ${{ job.services.valkey-c2.id }}
          C3: ${{ job.services.valkey-c3.id }}
        run: |
          set -euo pipefail
          addrs=()
          for c in "$C1" "$C2" "$C3"; do
            ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$c")
            test -n "$ip"
            addrs+=("$ip:6379")
          done
          docker exec "$C1" valkey-cli --cluster create "${addrs[@]}" --cluster-replicas 0 --cluster-yes
          for _ in $(seq 1 30); do
            if docker exec "$C1" valkey-cli cluster info | grep -q '^cluster_state:ok'; then
              break
            fi
            sleep 1
          done
          docker exec "$C1" valkey-cli cluster info | grep '^cluster_state:ok'
          docker exec "$C1" valkey-cli cluster info | grep '^cluster_size:3'
          echo "IMAS_TEST_VALKEY_CLUSTER_ADDR=${addrs[0]}" >> "$GITHUB_ENV"

      # IMAS_REQUIRE_HELM=1 turns every chart-test skip (no helm, charts/
      # not populated, a missing tool) into a failure, so this job can't
      # pass without having rendered the charts. IMAS_TEST_MYSQL_ROOT_DSN
      # runs the MySQL tests against the pxc service; set, they fail rather
      # than skip if it does not answer. SAASAPI_TEST_VALKEY_ADDR runs the
      # Valkey rate limiter test, the INFO memory check and the heartbeat
      # presence tests against the valkey service, and
      # IMAS_TEST_VALKEY_CLUSTER_ADDR (set by the step above) the heartbeat
      # tests against the cluster; IMAS_REQUIRE_VALKEY=1 makes those tests
      # fail, not skip, when either address is missing.
      - name: Test with race detection and coverage
        env:
          IMAS_REQUIRE_HELM: "1"
          IMAS_TEST_MYSQL_ROOT_DSN: "root:imas-ci@tcp(127.0.0.1:3306)/"
          SAASAPI_TEST_VALKEY_ADDR: "127.0.0.1:6379"
          IMAS_REQUIRE_VALKEY: "1"
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.26.x'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

      - name: Check formatting
        # dependencies/ is third-party source saved by go-licenses
        # (.github/workflows/go-licenses.yml), not ours to format.
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          files=$(git ls-files -- '*.go' ':!:dependencies/')
          test -z "$(goimports -l $files)" || (goimports -d $files && exit 1)

      - name: Vet
        run: go vet ./...

      # The release's before hook (.goreleaser.yaml) runs the same check, so
      # an untidy go.mod would otherwise first fail at release time.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
