name: Release

# Manual-only for now. It needs GPG_PRIVATE_KEY/GPG_PASSPHRASE (repo or
# "goreleaser" environment secrets; the "Check release secrets" step fails
# fast, naming whatever is missing). They were set on 2026-10-03, but the tags
# trigger below stays off until the first release has been run by hand and
# checked (docs/RELEASING.md, "First release checklist"); re-enable it then.
# It runs GoReleaser OSS (MIT): no licence key is needed; the Windows MSI
# comes from a build hook (packaging/windows/build-msi.sh), not
# goreleaser-pro's msi pipe.
#
# Run it on a tag ref (Use workflow from: tag vX.Y.Z), not a branch: the
# keyless cosign signatures are bound to this workflow *and* its ref, and
# publish-packages.yml only accepts refs/tags/v*. "Check the ref" refuses
# anything else before anything is built.
#
# This creates a draft GitHub release (archives, rpm/deb/apk, the MSI,
# checksums.txt with its GPG .sig and cosign .sigstore.json) and pushes the
# signed multi-arch images to GHCR
# (ghcr.io/yogzblr/imas-{farmer,sprout,saasapi,farmerbus,fleetreleaser,migrate}).
# Publishing that release (a maintainer's review step) is what uploads the OS
# packages and then the Helm charts to Buildkite: see publish-packages.yml.
on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Keyless cosign: the run's OIDC token is exchanged with Sigstore for a
  # short-lived signing certificate.
  id-token: write

jobs:
  goreleaser:
    # Only run on the canonical repo — this publishes a real GitHub Release,
    # Docker images, and package artifacts under imas's accounts/infra.
    # A fork pushing a v* tag should not trigger any of that.
    if: github.repository == 'yogzblr/imas'
    environment: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # A branch run would sign under refs/heads/..., which
      # publish-packages.yml rejects, after the images were already pushed.
      - name: Check the ref
        run: |
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*) ;;
            *) echo "::error::run Release on a vX.Y.Z tag (Use workflow from: tag), not $GITHUB_REF"; exit 1 ;;
          esac

      # Every secret this workflow uses, checked up front so a missing one
      # fails here with its name instead of halfway through a publish.
      - name: Check release secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=()
          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing repo/environment secrets: ${missing[*]}"
            exit 1
          fi

      # The sprout-windows-pkg build hook (packaging/windows/build-msi.sh)
      # builds the imas-sprout MSI with msitools' wixl, and
      # packaging/windows/msi-postprocess.sh uses msibuild/msiinfo.
      - name: Install msitools
        run: sudo apt-get update -q && sudo apt-get install -y -q wixl msitools

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # Build the version of the tag this run is on (the ref the cosign
          # identity names). Without it GoReleaser takes the first tag at HEAD
          # in git's version sort, which puts v0.1.0-rc.1 before v0.1.0: a
          # final tagged on the rc's commit would be built as the rc.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
