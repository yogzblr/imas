name: Snapshot Build

# Manual-only for now: this needs GPG_PRIVATE_KEY/GPG_PASSPHRASE/GORELEASER_KEY
# (goreleaser-pro) configured as repo secrets, which don't exist yet on the
# new imas repo (they lived on the original project's infra, not this fork's).
# Re-enable the push/pull_request triggers below once those secrets are set
# on yogzblr/imas.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  snapshot:
    # Only run on the canonical repo — this job publishes to imas's own
    # infra (S3 bucket, GHCR, Docker Hub) and needs secrets a fork won't
    # (and shouldn't) have. Forks get a plain `go build`/`go test` via ci.yml
    # instead.
    if: github.repository == 'yogzblr/imas'
    environment: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}    

      # The msi pipe (imas-sprout Windows installer) needs msitools' wixl,
      # and its after-hook msibuild/msiinfo.
      - name: Install msitools
        run: sudo apt-get update -q && sudo apt-get install -y -q wixl msitools
      
      - name: Test GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
