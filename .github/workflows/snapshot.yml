name: Snapshot Build

# Manual-only. It runs GoReleaser OSS (MIT), so no licence key is needed, and
# it needs no secrets: it neither signs nor publishes. The check of the
# release config, MSI and checksums that runs on pull requests is
# goreleaser-check.yml; this workflow adds the images.
#
# What a snapshot run does: builds everything release.yml builds (binaries,
# archives, rpm/deb/apk, the imas-sprout MSI, checksums.txt and the
# linux/amd64 + linux/arm64 images, loaded into the runner's Docker only).
# --skip=publish skips GoReleaser's whole publish stage: no GitHub release, no
# image or manifest push, and so no docker_signs either (they are part of
# that stage, and there is nothing pushed for them to sign).
#
# --skip=sign: snapshots don't sign checksums.txt (decided 2026-10-03, PR
# #75). Keyless cosign would write a public Sigstore Rekor entry for every
# run, and GPG would need the release key here. Signing is exercised by
# release.yml itself; the first tag is a pre-release so that a signing
# failure costs only a deleted draft (docs/RELEASING.md, "First release
# checklist").
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # The sprout-windows-pkg build hook (packaging/windows/build-msi.sh)
      # builds the imas-sprout MSI with msitools' wixl, and its
      # post-process step uses msibuild/msiinfo.
      - name: Install msitools
        run: sudo apt-get update -q && sudo apt-get install -y -q wixl msitools

      # The dockers entries build with buildx, half of them for linux/arm64.
      # Set up the same builder as release.yml so the snapshot builds the
      # images the way the release does.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
