name: Publish packages

# Uploads a release's OS packages to the Buildkite Package Registries:
#   .rpm (imas, imas-farmer, imas-sprout)  -> imasrpm   (RHEL and SUSE)
#   .deb (imas, imas-farmer, imas-sprout)  -> imasdeb
#   imas-sprout for winget                  -> imasnget  (public NuGet feed)
#     imas.sprout.windows.msi   the MSI, which winget downloads anonymously
#     imas.sprout.windows       the winget manifests pointing at it
#
# After the packages are up (so the sprout repos already hold the release),
# it also packages the Helm charts and pushes them to GitHub Container
# Registry as OCI charts (UAT.10; the Buildkite Helm registry imashelm is
# superseded for charts and is left alone):
#   farmer  deploy/helm/farmer   with files/sprout-release.json (the sprout
#                                release the chart registers, API design §2.5)
#                                -> oci://ghcr.io/yogzblr/charts/farmer
#   nats    deploy/helm/nats     -> oci://ghcr.io/yogzblr/charts/nats
# Chart version and appVersion are the release version, which is also the
# tag of the GHCR images the charts default to (0.1.0-rc.5 for v0.1.0-rc.5).
# Each pushed chart is signed by digest with keyless cosign; its signer
# identity is this workflow at the release's tag ref, exactly
# (packaging/release/cosign-identity.sh publish-packages.yml vX.Y.Z), so this
# workflow runs only on refs/tags/<tag>. A chart version GHCR already holds
# is never pushed again (GHCR would move the tag): if it is there and signed
# by this tag's run, the push is skipped. After the push every chart is
# checked as a consumer gets it (packaging/helm/ghcr-chart.sh check):
# pulled anonymously, the digest that was signed, its package linked to
# this repository. A chart package is private after its first push and the
# run's GITHUB_TOKEN cannot change that, so the check fails until the owner
# sets the package public and links it, once (docs/RELEASING.md, "Helm
# charts on GHCR"); then run this workflow again from the tag with
# only_helm. Before anything is published the keyless cosign signatures are
# verified: the checksums bundle and each imas-* image on GHCR must have
# been signed by release.yml on this tag
# (packaging/release/cosign-identity.sh release.yml vX.Y.Z), exactly.
#
# Runs when a maintainer publishes the draft release that release.yml
# (goreleaser) creates, so nothing reaches the registries before that
# review. Prereleases are skipped (their MSI version equals the final
# release's, and winget would offer them as the newest version); publish one
# deliberately with workflow_dispatch, run from the tag (Use workflow from:
# tag vX.Y.Z), with the same tag as input. workflow_dispatch also re-runs a
# failed publish for a tag. Packages are taken from the release's assets and
# checked against its checksums.txt.
#
# Needs (repo, or the "goreleaser" environment), unless only_helm is set
# (the charts go to GHCR with the run's GITHUB_TOKEN, nothing else):
#   secret   BUILDKITE_PACKAGES_TOKEN     Buildkite API access token with the
#                                         Read Packages and Write Packages scopes
#   variable BUILDKITE_ORGANIZATION_SLUG  org owning imasrpm/imasdeb/imasnget
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.2.3; run the workflow from that same tag (Use workflow from: tag)"
        required: true
        type: string
      only_helm:
        description: "Re-run after a partial publish: skip the rpm, deb, NuGet and winget uploads (already in Buildkite) and publish only the Helm charts (to GHCR)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'yogzblr/imas' &&
      (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    environment: goreleaser
    runs-on: ubuntu-latest
    # Only this job writes packages (the Helm charts, to GHCR) and signs
    # (keyless cosign needs the OIDC token); the workflow default stays read.
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check publish secrets
        env:
          BUILDKITE_PACKAGES_TOKEN: ${{ secrets.BUILDKITE_PACKAGES_TOKEN }}
          BUILDKITE_ORGANIZATION_SLUG: ${{ vars.BUILDKITE_ORGANIZATION_SLUG }}
          ONLY_HELM: ${{ inputs.only_helm }}
        run: |
          missing=()
          # The charts go to GHCR, so only_helm needs no Buildkite setting.
          if [ "$ONLY_HELM" != "true" ]; then
            [ -n "$BUILDKITE_PACKAGES_TOKEN" ] || missing+=("secret BUILDKITE_PACKAGES_TOKEN")
            [ -n "$BUILDKITE_ORGANIZATION_SLUG" ] || missing+=("variable BUILDKITE_ORGANIZATION_SLUG")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing: ${missing[*]}"
            exit 1
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' is not a release tag (want vX.Y.Z)"; exit 1 ;;
          esac
          # The charts' signer identity is this workflow at refs/tags/<tag>
          # (packaging/release/cosign-identity.sh). A release event runs on
          # the tag's ref; a run by hand must be started from the tag.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::run Publish packages from the tag it publishes (Use workflow from: tag $TAG), not $GITHUB_REF: the charts are signed with the identity of this workflow at refs/tags/$TAG"
            exit 1
          fi

      # The packaging scripts as of the release being published.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # checksums.txt.sig and checksums.txt.sigstore.json are release
      # assets only because .goreleaser.yaml's release.ids lists the signs
      # IDs (gpg, cosign); without them GoReleaser leaves the signatures off
      # the release. checksums.txt.sig is verified against the repo's
      # gpg-public-key.asc alone, in a throwaway GNUPGHOME: it is what every
      # sprout verifies before it installs an update (P22), and
      # stamp-sprout-release.sh checks it again. Public key only, no secret.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.rpm' --pattern '*.deb' --pattern '*.msi' --pattern checksums.txt \
            --pattern checksums.txt.sig --pattern 'checksums.txt.sigstore.json'
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --quiet --import gpg-public-key.asc
          gpg --batch --verify dist/checksums.txt.sig dist/checksums.txt
          rm -rf "$GNUPGHOME"
          unset GNUPGHOME
          (cd dist && sha256sum --check --ignore-missing --strict checksums.txt)
          # --ignore-missing passes on an empty directory: make sure every
          # downloaded package was actually listed. (A missing package type
          # is caught by publish-packages.sh.)
          shopt -s nullglob
          for f in dist/*.rpm dist/*.deb dist/*.msi; do
            grep -q "  $(basename "$f")\$" dist/checksums.txt || { echo "::error::$f is not in checksums.txt"; exit 1; }
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: the signer must be release.yml in this repo, run on this
      # very tag, via GitHub's OIDC issuer: an exact identity, no pattern.
      # Nothing is published if any check fails.
      - name: Verify cosign signatures (checksums and images)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDENTITY="$(packaging/release/cosign-identity.sh release.yml "$TAG")"
          ISSUER="$(packaging/release/cosign-identity.sh --issuer)"
          echo "signer: $IDENTITY"
          cosign verify-blob --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            dist/checksums.txt
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for img in farmer sprout saasapi farmerbus migrate; do
            cosign verify "ghcr.io/yogzblr/imas-${img}:${TAG#v}" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
            echo "verified imas-${img}:${TAG#v}"
          done

      - name: Install msitools
        run: sudo apt-get update -q && sudo apt-get install -y -q msitools zip

      - name: Set up .NET (dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build winget NuGet packages
        if: ${{ !inputs.only_helm }}
        env:
          BUILDKITE_ORGANIZATION_SLUG: ${{ vars.BUILDKITE_ORGANIZATION_SLUG }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          msis=(dist/*.msi)
          [ "${#msis[@]}" -eq 1 ] || { echo "::error::expected one MSI in the release, found ${#msis[@]}"; exit 1; }
          # The public feed's NuGet v3 PackageBaseAddress (flat container),
          # where winget will download the installer package from.
          index="https://packages.buildkite.com/${BUILDKITE_ORGANIZATION_SLUG}/imasnget/nuget/index.json"
          base="$(curl -sSfL "$index" | jq -r '[.resources[] | select((."@type" | tostring) | startswith("PackageBaseAddress")) | ."@id"][0] // empty')"
          [ -n "$base" ] || { echo "::error::no PackageBaseAddress in $index (is imasnget public?)"; exit 1; }
          ./packaging/windows/winget/build-winget-nupkg.sh \
            --msi "${msis[0]}" --version "$TAG" --package-base-address "$base" --out dist/winget

      - name: Publish to Buildkite Packages
        if: ${{ !inputs.only_helm }}
        env:
          BUILDKITE_PACKAGES_TOKEN: ${{ secrets.BUILDKITE_PACKAGES_TOKEN }}
          BUILDKITE_ORGANIZATION_SLUG: ${{ vars.BUILDKITE_ORGANIZATION_SLUG }}
        run: ./packaging/buildkite/publish-packages.sh dist dist/winget

      # Last, so every sprout package is already in the sprout repos by the
      # time a farmer chart carrying this release can register it.
      # Pinned to the version ci.yml runs the chart tests with.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # Lint and render each chart with the values file CI renders it with
      # (ci/default-values.yaml): the farmer chart refuses to render without
      # its required values (bus.serviceName, bus.sproutBusURLs, saasapi.jwt.*,
      # farmer.bootstrapAdmin), and helm lint reports a template's `fail` only
      # as [INFO], so the helm template run is what fails the step on a chart
      # that doesn't render. `helm dependency build` needs each Chart.lock
      # repository added first.
      - name: Package Helm charts
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ./packaging/helm/stamp-sprout-release.sh dist "$TAG" deploy/helm/farmer/files/sprout-release.json
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo add percona https://percona.github.io/percona-helm-charts
          helm repo add valkey https://valkey.io/valkey-helm/
          mkdir -p dist/charts
          for chart in deploy/helm/farmer deploy/helm/nats; do
            if [ -f "$chart/Chart.lock" ]; then helm dependency build "$chart"; fi
            helm lint "$chart" -f "$chart/ci/default-values.yaml"
            helm template lint "$chart" -f "$chart/ci/default-values.yaml" >/dev/null
            helm package "$chart" --version "$version" --app-version "$version" --destination dist/charts
          done

      # OCI charts on GHCR: oci://ghcr.io/yogzblr/charts/<chart>:<version>.
      # helm push takes the chart name and version from the package, so a
      # pre-release such as 0.1.0-rc.5 becomes the tag 0.1.0-rc.5 (only "+"
      # is rewritten, to "_"; the release versions have none). The login
      # password goes through stdin, never argv. docker login gives cosign
      # (which reads the Docker config, not Helm's) the same credential, as
      # in the verify step above. GHCR does not reject a version it already
      # holds: pushing again would move the tag. So a version that is
      # already there is not pushed: if this tag's run signed it (an
      # only_helm run after the check below failed), it is kept; anything
      # else fails and the release is fixed forward with the next tag
      # (docs/RELEASING.md).
      - name: Publish Helm charts to GHCR (OCI) and sign them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          OCI_BASE: oci://ghcr.io/yogzblr/charts
        run: |
          set -euo pipefail
          version="${TAG#v}"
          IDENTITY="$(packaging/release/cosign-identity.sh publish-packages.yml "$TAG")"
          ISSUER="$(packaging/release/cosign-identity.sh --issuer)"
          echo "signer: $IDENTITY"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          shopt -s nullglob
          charts=(dist/charts/*.tgz)
          [ "${#charts[@]}" -eq 2 ] || { echo "::error::expected 2 packaged charts, found ${#charts[@]}"; exit 1; }
          : > dist/charts/pushed.txt
          for pkg in "${charts[@]}"; do
            name="$(basename "$pkg" ".tgz")"
            name="${name%-"$version"}"
            case "$name" in farmer|nats) ;; *) echo "::error::unexpected chart package $pkg"; exit 1 ;; esac
            ref="${OCI_BASE#oci://}/${name}"
            rc=0
            existing="$(GHCR_USER="$GH_ACTOR" GHCR_TOKEN="$GH_TOKEN" packaging/helm/ghcr-chart.sh digest "$name" "$version")" || rc=$?
            case "$rc" in
              0)
                if ! cosign verify "${ref}@${existing}" \
                    --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null; then
                  echo "::error::oci://${ref}:${version} is already on GHCR (${existing}) and not signed by this tag's run: it is not pushed again (that would move the tag). Release the fix as the next tag (docs/RELEASING.md, \"A tag never moves\")"
                  exit 1
                fi
                digest="$existing"
                echo "oci://${ref}:${version} is already on GHCR, signed by this tag's run (${digest}): not pushed again"
                ;;
              3)
                helm push "$pkg" "$OCI_BASE" 2>&1 | tee "push-$name.log"
                digest="$(sed -n 's/^Digest: *//p' "push-$name.log" | tail -n 1)"
                [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest in the helm push output for $name"; exit 1; }
                # Keyless, by digest, as release.yml signs the images.
                cosign sign --yes "${ref}@${digest}"
                cosign verify "${ref}@${digest}" \
                  --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
                echo "pushed and signed oci://${ref}:${version} (${digest})"
                ;;
              *) echo "::error::could not tell whether oci://${ref}:${version} is on GHCR"; exit 1 ;;
            esac
            echo "$name $digest" >> dist/charts/pushed.txt
          done

      # As a consumer gets them: no credential at all. Fails, saying what the
      # owner must do, while a package is private or not linked to this
      # repository; the workflow's token cannot change either (owner
      # decision V2). After the owner step, run this workflow again from the
      # tag with only_helm: the push above is then skipped, and this passes.
      - name: Check the charts are public and linked to the repository
        run: |
          set -euo pipefail
          version="${TAG#v}"
          failed=0
          while read -r name digest; do
            packaging/helm/ghcr-chart.sh check "$name" "$version" "$digest" || failed=1
          done < dist/charts/pushed.txt
          [ "$(wc -l < dist/charts/pushed.txt)" -eq 2 ] || { echo "::error::expected 2 pushed charts"; exit 1; }
          exit "$failed"
