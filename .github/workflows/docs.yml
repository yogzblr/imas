name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "internal/ingredients/**"
      - "tools/gendocs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "internal/ingredients/**"
      - "tools/gendocs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # tools/gendocs is its own Go module (see tools/gendocs/go.mod) so it
      # never needs this repo's go.mod toolchain version, and never needs to
      # build for the windows/linux-only platforms most ingredients target --
      # it only reads their source as text via go/ast.
      - name: Regenerate ingredient reference from source
        working-directory: tools/gendocs
        run: go run . -src ../../internal/ingredients -out ../../docs-site/src/ingredients

      - name: Install mdBook
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build book
        run: mdbook build docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
