name: UAT gate

# The Azure UAT gate (docs/claude-code-parallel-build-plan.md, section 4h;
# uat/README.md). FLAG FOR SECURITY REVIEW: this workflow holds Azure
# credentials (GitHub OIDC, Contributor on the UAT subscription).
#
# One run builds one environment from the published release named by
# release_tag, tests it and tears it down:
#   tofu apply (uat/tofu) -> Bastion tunnels (uat/access) -> k0s on both hubs
#   (uat/k0s) -> core hub (uat/hub/core) -> DMZ hub (uat/hub/dmz) -> tenants
#   and sprouts (uat/enroll) -> tests (uat/tests/run.sh) -> start any stopped
#   HA hub VM (the ha tier stops them) -> close tunnels ->
#   upload the report -> destroy (uat/tofu/destroy.sh) -> verify teardown.
# The az session comes from a GitHub OIDC login, which stops renewing about
# an hour after it is made; tunnels opened on it are suspected to hang then
# (W6: UAT Run 2 hung 55 to 60 minutes after its login; inferred from that
# timing, not proven). So every phase starts with uat/access/session.sh
# phase: it logs in again and reopens the tunnels when either is
# UAT_SESSION_REFRESH_AFTER_MIN (15) minutes old, then refuses to start if
# either is still older than UAT_SESSION_MAX_AGE_MIN (40, so only when no
# refresh happened), and prints "azure login age Xm, tunnels age Ym". Enrolment and the tests always refresh first and probe
# every tunnel, and refresh again between their own steps (enroll.sh between
# Ansible runs, run.sh between top-level tests), never during one.
# Core is installed before the DMZ: the bus needs core's public NATS trust
# (with the loader's JWT), the loader's seed and the accounts bucket's
# read-only credential when it starts, all made by the core install (owner
# decision, 2026-10-06; P21).
#
# By hand only (workflow_dispatch). There is deliberately no trigger on a
# published release or on a schedule: the owner adds one once the gate is
# green. The hourly janitor (uat-janitor.yml) deletes any run whose destroy
# did not happen, after its expires_at tag.
#
# Needs, in the GitHub environment "uat" (required reviewer, deployment
# branch main):
#   variable AZURE_CLIENT_ID        the imas-uat-github application (no secret:
#   variable AZURE_TENANT_ID        login is by OIDC with a federated credential
#   variable AZURE_SUBSCRIPTION_ID  for repo:yogzblr@16265408/imas@1388858987:environment:uat)
#   variable UAT_TFSTATE_STORAGE_ACCOUNT  optional: the state account the
#                                   uat/tofu/bootstrap stack made; looked up by
#                                   its tag in imas-uat-state when unset
# The "Check inputs and variables" step fails first, naming whatever is
# missing. Nothing that holds a credential is uploaded: the SSH key, the WinRM
# password, the kubeconfigs, OpenBao's unseal keys and root token, the seeds
# and the enrolment keys stay on the runner, which is discarded with the job.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to test: vX.Y.Z or vX.Y.Z-rc.N, an existing tag with a published release"
        required: true
        type: string
      region:
        description: "Azure region (sizes and quota confirmed there)"
        required: false
        default: centralindia
        type: string
      keep_hours:
        description: "Keep the environment this many hours after the run (0 destroys it at the end; at most 168)"
        required: false
        default: 0
        type: number
      tier:
        description: "Test tier (ha: the HA tests HA1 to HA6, needs hub_nodes 3)"
        required: false
        default: all
        type: choice
        options: [all, smoke, core, resilience, ingredients, lifecycle, ha]
      upgrade_from_tag:
        description: "Earlier release for scenario L4 (package upgrade); empty skips L4"
        required: false
        default: ""
        type: string
      scenarios:
        description: "Optional scenario ids of the tier, separated by spaces or commas (e.g. C1 X4)"
        required: false
        default: ""
        type: string
      hub_nodes:
        description: "k0s nodes per hub: 1 is the single-node run, 3 the HA run (3 core D4s_v5 and 3 DMZ D2s_v5 nodes: 18 Dsv5 vCPU)"
        required: false
        default: "1"
        type: choice
        options: ["1", "3"]
      dispatch_flags:
        description: "Turn the fleet update dispatch flags on in the core hub (UAT only) and run L5, the self update"
        required: false
        default: false
        type: boolean
      ingress_cidrs:
        description: "Public IPv4 ranges allowed to Bastion 443, core 443 and Envoy (hardened); empty opens them to the Internet"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # GitHub OIDC for azure/login and OpenTofu's azurerm provider and backend.
  id-token: write

# dispatch_flags turns the fleet update flags on: check-inputs.sh maps it to
# IMAS_UAT_DISPATCH_FLAGS (on or off), which the core hub install reads
# (uat/hub/core/gen-values.sh sets saasapi.fleetUpdateDispatch.enabled, i.e.
# SAASAPI_FLEET_UPDATE_DISPATCH_ENABLED, and farmer.selfUpdate.enabled, i.e.
# IMAS_SELF_UPDATE_ENABLED, both from it; off leaves both off) and the tests
# read (L5 runs when it is on). The release itself is always registered
# (finish.sh), so the catalog lists it either way. UAT only: the flags stay
# off outside UAT until the security review.
#
# One UAT run at a time, whatever the release: a run needs most of the
# subscription's quota (the single-node run 10 Dsv5 and 12 B2ls_v2 vCPU, the
# HA run, hub_nodes 3, 18 Dsv5 and 12 B2ls_v2), so two cannot fit. A second
# dispatch waits for the first to end. The apply step checks the quota first
# (uat/tofu/quota-check.sh) and fails with the numbers when it is short.
concurrency:
  group: uat
  cancel-in-progress: false

jobs:
  uat:
    if: github.repository == 'yogzblr/imas'
    environment: uat
    runs-on: ubuntu-latest
    # GitHub hosted jobs stop at 6 hours. The run's expires_at is set past
    # that (check-inputs.sh, run_budget_hours), so the janitor never deletes a
    # live run.
    timeout-minutes: 350
    env:
      # OpenTofu (azurerm provider and backend) logs in by OIDC on its own,
      # with the job's ID token; nothing here is a secret.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: imas-uat-state
      # The az logins after the first (uat/access/az-relogin.sh, through
      # session.sh and vmctl.sh) exchange the job's OIDC token for these.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # Every input and variable, checked before anything is created. Inputs
      # reach scripts through env only, never through ${{ }} in a script.
      - name: Check inputs and variables
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REGION: ${{ inputs.region }}
          KEEP_HOURS: ${{ inputs.keep_hours }}
          TIER: ${{ inputs.tier }}
          UPGRADE_FROM_TAG: ${{ inputs.upgrade_from_tag }}
          SCENARIOS: ${{ inputs.scenarios }}
          HUB_NODES: ${{ inputs.hub_nodes }}
          DISPATCH_FLAGS: ${{ inputs.dispatch_flags }}
          INGRESS_CIDRS: ${{ inputs.ingress_cidrs }}
        run: uat/scripts/check-inputs.sh

      # The run's working directories. STATE holds the run's files, several of
      # them credentials (see collect-artifacts.sh); SECRETS holds the tofu
      # credentials. Both are 0700 and never uploaded.
      - name: Prepare directories
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/uat-state/session" "$RUNNER_TEMP/uat-secrets" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/uat-artifacts"
          {
            echo "STATE=$RUNNER_TEMP/uat-state"
            echo "SECRETS=$RUNNER_TEMP/uat-secrets"
            echo "ARTIFACTS=$RUNNER_TEMP/uat-artifacts"
            # uat/access/session.sh (W6): the login time (az-relogin.sh's
            # stamp, also for vmctl.sh's logins), the tunnels it reopens
            # and the kubeconfigs that point at them.
            echo "AZ_RELOGIN_DIR=$RUNNER_TEMP/uat-state/session"
            echo "UAT_SESSION_UAT=$RUNNER_TEMP/uat-state/uat.json"
            echo "UAT_SESSION_ACCESS=$RUNNER_TEMP/uat-state/access"
            echo "UAT_SESSION_KUBECONFIGS=$RUNNER_TEMP/uat-state/k0s/core.kubeconfig:$RUNNER_TEMP/uat-state/k0s/dmz.kubeconfig"
          } >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # The version uat/tofu was validated with. No wrapper: tofu output -raw
      # must print the bare value.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v4.3.0

      # k0sctl and kubectl at the versions and checksums uat/k0s pins;
      # Ansible for uat/enroll (pywinrm for the Windows sprouts).
      - name: Install k0sctl, kubectl and Ansible
        run: |
          set -euo pipefail
          uat/k0s/install-tools.sh "$RUNNER_TEMP/bin"
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.15' pywinrm
          ansible-galaxy collection install -r uat/enroll/requirements.yml
          tofu version
          helm version
          ansible --version

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The login's time, for the age every phase prints and guards (W6).
      - name: Record the Azure login time
        run: uat/access/session.sh mark-login

      - name: Generate run_id
        id: runid
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          REGION: ${{ steps.inputs.outputs.region }}
          TIER: ${{ steps.inputs.outputs.tier }}
          KEEP_HOURS: ${{ steps.inputs.outputs.keep_hours }}
          RUN_BUDGET_HOURS: ${{ steps.inputs.outputs.run_budget_hours }}
          UPGRADE_FROM_TAG: ${{ steps.inputs.outputs.upgrade_from_tag }}
          SCENARIOS: ${{ steps.inputs.outputs.scenarios }}
          HUB_NODES: ${{ steps.inputs.outputs.hub_nodes }}
          DISPATCH_FLAGS: ${{ steps.inputs.outputs.dispatch_flags }}
          PUBLIC_INGRESS: ${{ steps.inputs.outputs.public_ingress }}
          PUBLIC_INGRESS_CIDRS: ${{ steps.inputs.outputs.public_ingress_cidrs }}
        run: |
          set -euo pipefail
          id=$(uat/scripts/run-id.sh)
          echo "run_id=$id" >>"$GITHUB_OUTPUT"
          echo "RUN_ID=$id" >>"$GITHUB_ENV"
          jq -n --arg run_id "$id" --arg release_tag "$RELEASE_TAG" --arg region "$REGION" \
            --arg tier "$TIER" --argjson keep_hours "$KEEP_HOURS" --argjson run_budget_hours "$RUN_BUDGET_HOURS" \
            --arg upgrade_from_tag "$UPGRADE_FROM_TAG" \
            --arg scenarios "$SCENARIOS" --argjson hub_nodes "$HUB_NODES" --arg dispatch_flags "$DISPATCH_FLAGS" \
            --arg public_ingress "$PUBLIC_INGRESS" --argjson public_ingress_cidrs "$PUBLIC_INGRESS_CIDRS" \
            --arg github_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '$ARGS.named' >"$STATE/run.json"
          echo "run_id $id: resource group imas-uat-$id"

      # State goes to the bootstrap storage account, one blob per run, so a
      # kept run can be destroyed later by hand or by the janitor. The quota
      # check plans first and stops before anything is created when the
      # subscription cannot hold the run's VMs.
      - name: tofu apply (uat/tofu)
        id: apply
        env:
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.UAT_TFSTATE_STORAGE_ACCOUNT }}
          TF_VAR_release_tag: ${{ steps.inputs.outputs.release_tag }}
          TF_VAR_region: ${{ steps.inputs.outputs.region }}
          TF_VAR_keep_hours: ${{ steps.inputs.outputs.keep_hours }}
          TF_VAR_run_budget_hours: ${{ steps.inputs.outputs.run_budget_hours }}
          # Who may reach Bastion 443, core 443 and Envoy: the Internet unless
          # ingress_cidrs names ranges (uat/tofu variables.tf, W5).
          TF_VAR_public_ingress: ${{ steps.inputs.outputs.public_ingress }}
          TF_VAR_public_ingress_cidrs: ${{ steps.inputs.outputs.public_ingress_cidrs }}
          TF_VAR_core_node_count: ${{ steps.inputs.outputs.core_node_count }}
          TF_VAR_dmz_node_count: ${{ steps.inputs.outputs.dmz_node_count }}
          CORE_NODE_SIZE: ${{ steps.inputs.outputs.core_node_size }}
        run: |
          set -euo pipefail
          account=${TFSTATE_STORAGE_ACCOUNT:-}
          if [ -z "$account" ]; then
            account=$(az storage account list --resource-group "$TFSTATE_RESOURCE_GROUP" \
              --query "[?tags.purpose=='imas-uat-state'].name | [0]" -o tsv)
          fi
          if [ -z "$account" ]; then
            echo "::error::no tofu state storage account in $TFSTATE_RESOURCE_GROUP: apply uat/tofu/bootstrap once (uat/README.md)"
            exit 1
          fi
          echo "TFSTATE_STORAGE_ACCOUNT=$account" >>"$GITHUB_ENV"
          export TF_VAR_run_id="$RUN_ID"
          # Empty for one node: uat/tofu's default size stays.
          if [ -n "$CORE_NODE_SIZE" ]; then export TF_VAR_core_node_size="$CORE_NODE_SIZE"; fi
          tofu -chdir=uat/tofu init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$account" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=imas-uat/$RUN_ID.tfstate"
          # Quota first: the VMs this plan creates against the region's vCPU
          # quota per family and in all. The apply applies exactly this plan.
          plan_and_check_quota() {
            tofu -chdir=uat/tofu plan -input=false -no-color -out="$STATE/run.tfplan" >"$STATE/plan.log" 2>&1 \
              || { tail -n 50 "$STATE/plan.log"; return 1; }
            tofu -chdir=uat/tofu show -json "$STATE/run.tfplan" >"$STATE/plan.json"
            local rc=0
            uat/tofu/quota-check.sh "$STATE/plan.json" "$TF_VAR_region" || rc=$?
            rm -f "$STATE/plan.json"
            return "$rc"
          }
          # The plan file holds state values; it never outlives this step.
          trap 'rm -f "$STATE/run.tfplan" "$STATE/plan.json"' EXIT
          plan_and_check_quota
          # Azure sometimes refuses a change to the virtual network while the
          # Bastion host (about 13 minutes) is still being created:
          # "409 AnotherOperationInProgress". The apply is idempotent, so plan
          # again (checking the quota on the new plan) and apply that, but
          # only for that error, and at most three times.
          for attempt in 1 2 3; do
            if tofu -chdir=uat/tofu apply -input=false -no-color "$STATE/run.tfplan" 2>&1 | tee "$STATE/apply.log"; then
              break
            fi
            if [ "$attempt" -lt 3 ] && grep -q 'AnotherOperationInProgress' "$STATE/apply.log"; then
              echo "::warning::Azure reported AnotherOperationInProgress; planning and applying again (attempt $((attempt + 1)) of 3)"
              rm -f "$STATE/run.tfplan"
              sleep 60
              plan_and_check_quota
              continue
            fi
            exit 1
          done
          # uat.json, ha_node_names.json (the VMs the HA tests stop) and
          # object_store.json (the HA run's Azure Blob account; null in the
          # single-node run, whose null output tofu does not store).
          uat/scripts/tofu-outputs.sh outputs "$STATE"
          jq -e --arg rg "imas-uat-$RUN_ID" '.resource_group == $rg' "$STATE/uat.json" >/dev/null

      # The per-run credentials, into 0600 files that are never uploaded. The
      # password is masked before it is used anywhere.
      - name: Fetch the run's credentials
        run: uat/scripts/tofu-outputs.sh credentials "$STATE" "$SECRETS"

      - name: Azure CLI extensions (bastion, ssh)
        run: |
          set -euo pipefail
          az extension add --name bastion --upgrade --yes
          az extension add --name ssh --upgrade --yes
          az extension list --query "[].{name:name, version:version}" -o table

      # tofu apply takes about 20 minutes: the tunnels are opened on a login
      # made just before them, not on the job's first one (W6).
      - name: Open the Bastion tunnels (uat/access)
        id: tunnels
        run: |
          uat/access/session.sh phase "Bastion tunnels" --no-tunnels --force
          uat/access/tunnels.sh open "$STATE/uat.json" "$STATE/access"

      # One node per hub: a single-node cluster each (kine). hub_nodes 3: three
      # controller+worker nodes per hub on etcd, kubectl through the tunnel
      # to each hub's API address (uat/k0s README.md, "HA hubs"). --nodes
      # refuses a uat.json whose hubs have another node count.
      - name: k0s on both hubs (uat/k0s)
        env:
          HUB_NODES: ${{ steps.inputs.outputs.hub_nodes }}
        run: |
          uat/access/session.sh phase "k0s on both hubs"
          uat/k0s/bootstrap.sh --uat "$STATE/uat.json" --access "$STATE/access/access.json" \
            --ssh-key "$SECRETS/ssh_key" --out "$STATE/k0s" --nodes "$HUB_NODES"

      # release_tag is the chart reference as well: install.sh pulls the
      # farmer chart published with that tag (it carries the stamped sprout
      # release finish.sh registers). IMAS_UAT_DISPATCH_FLAGS sets the fleet
      # update flags in the chart values (gen-values.sh). hub_nodes 3: the
      # endpoints file lists three core nodes, so install.sh adds the HA
      # overlay (values/values-ha.yaml) and runs Versity Gateway over the
      # Azure Blob account whose name and key the credentials step wrote
      # (uat/README.md, "HA run").
      - name: Core hub (uat/hub/core)
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          IMAS_UAT_DISPATCH_FLAGS: ${{ steps.inputs.outputs.dispatch_flags }}
        run: |
          uat/access/session.sh phase "core hub"
          uat/hub/core/install.sh "$STATE/k0s/core.kubeconfig" "$STATE/k0s/endpoints.json" \
            "$STATE/hub" "$RELEASE_TAG"

      # The bus gets core's public trust straight from core's ConfigMap (no
      # seed crosses). Its account loader gets the two credentials core's
      # install left for it: the loader's SYS user seed (seeds.sh; its public
      # key is core's natsTrust.busLoaderUserPub) and the read-only accounts
      # bucket credential (rustfs-setup.sh, or install.sh for Versity
      # Gateway on the HA run), which it uses on core's object store. A
      # clustered bus (hub_nodes 3) also gets its fence user's seed
      # (seeds.sh; core's natsTrust.busFenceUserPub); install.sh ignores the
      # file for a single-node bus.
      - name: DMZ hub (uat/hub/dmz)
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
        run: |
          uat/access/session.sh phase "DMZ hub"
          uat/hub/dmz/install.sh --kubeconfig "$STATE/k0s/dmz.kubeconfig" \
            --endpoints "$STATE/k0s/endpoints.json" --release-tag "$RELEASE_TAG" \
            --seeds-from-kubeconfig "$STATE/k0s/core.kubeconfig" \
            --loader-seed "${UAT_SEEDS_DIR:-$STATE/hub/core/sensitive/seeds}/bus-loader-user.nk" \
            --accounts-reader-dir "$STATE/hub/core/sensitive/s3/accounts-reader" \
            --fence-seed "${UAT_SEEDS_DIR:-$STATE/hub/core/sensitive/seeds}/bus-fence-user.nk" \
            --workdir "$STATE/dmz"

      # farmer and saasapi need the DMZ bus, so core's install.sh does not wait
      # for them: this does, registers the sprout release (and fails unless
      # saasapi's operator API then holds it with its GPG-signed checksums.txt
      # and signature) and runs core's check. A clean first start of farmer
      # takes about ten minutes (W7): each rollout gets 1200 s, and a timeout
      # prints the core pods, describe with events, farmer's last log lines
      # and the DMZ bus and loader tails (from DMZ_KUBECONFIG) first.
      - name: Core hub, second half (uat/hub/core/finish.sh)
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
        run: |
          uat/access/session.sh phase "core hub, second half"
          DMZ_KUBECONFIG="$STATE/k0s/dmz.kubeconfig" \
            uat/hub/core/finish.sh "$STATE/k0s/core.kubeconfig" "$STATE/k0s/endpoints.json" \
            "$STATE/hub" "$RELEASE_TAG"

      # Before enrolment: its rate limit check empties /v1/enroll's bucket and
      # waits for the refill.
      - name: DMZ check
        run: |
          uat/access/session.sh phase "DMZ check"
          uat/hub/dmz/check.sh --endpoints "$STATE/k0s/endpoints.json" \
            --ca-file "$STATE/k0s/uat-ca.crt" --kubeconfig "$STATE/k0s/dmz.kubeconfig"

      # A fresh login and fresh tunnels, every tunnel probed (W6): UAT Run 2
      # started enrolment on a 50-minute-old login and hung at about 55.
      - name: Azure login again (before enrolment)
        run: uat/access/session.sh phase "enrolment" --force --probe

      # UAT_SESSION_HOOK: enroll.sh refreshes again between its Ansible runs
      # when the login or the tunnels are 15 minutes old (W6).
      - name: Tenants and enrolment (uat/enroll)
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          UAT_SESSION_HOOK: ${{ github.workspace }}/uat/access/session.sh
        run: |
          uat/enroll/enroll.sh --uat "$STATE/uat.json" --access "$STATE/access/access.json" \
            --state "$STATE/enroll" --release-tag "$RELEASE_TAG" \
            --ssh-key "$SECRETS/ssh_key" --winrm-password-file "$SECRETS/winrm_password" \
            --core-state "$STATE/hub" --core-kubeconfig "$STATE/k0s/core.kubeconfig" \
            --endpoints "$STATE/k0s/endpoints.json"

      - name: Test material
        run: |
          uat/scripts/material.sh "$STATE/uat.json" "$STATE/k0s/endpoints.json" \
            "$STATE/enroll" "$STATE/hub"

      # vmctl.sh (reboots, run-command) calls Azure during the tests, possibly
      # hours after the first login, and the tests reach both hubs' APIs
      # through the tunnels: log in again, reopen the tunnels and probe them
      # (W6; the same OIDC exchange as azure/login, by az-relogin.sh).
      - name: Azure login again (before the tests)
        run: uat/access/session.sh phase "tests" --force --probe

      # go test's own timeout stays under the step's, so a slow run still
      # writes its report.
      - name: Tests (uat/tests/run.sh)
        id: tests
        timeout-minutes: 180
        env:
          TIER: ${{ steps.inputs.outputs.tier }}
          SCENARIOS: ${{ steps.inputs.outputs.scenarios }}
          IMAS_UAT_RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          # Scenario L4 (UAT.7): the earlier release to upgrade from; empty skips L4.
          IMAS_UAT_UPGRADE_FROM_TAG: ${{ steps.inputs.outputs.upgrade_from_tag }}
          # on or off (check-inputs.sh, from dispatch_flags): the flags the core
          # hub was installed with; L5 runs when it is on.
          IMAS_UAT_DISPATCH_FLAGS: ${{ steps.inputs.outputs.dispatch_flags }}
          # An az session from the OIDC login stops renewing after about ten
          # minutes (AADSTS700024); vmctl.sh runs this and repeats the call.
          # The ha tier stops and starts hub VMs through vmctl.sh (stop-vm,
          # start-vm) with this login too.
          UAT_AZ_RELOGIN: ${{ github.workspace }}/uat/access/az-relogin.sh
          # run.sh runs each top-level test in its own process and refreshes
          # the login and the tunnels between them when 15 minutes old (W6).
          UAT_SESSION_HOOK: ${{ github.workspace }}/uat/access/session.sh
        run: |
          set -euo pipefail
          export IMAS_UAT_DIR="$STATE/hub"
          export IMAS_UAT_REPORT_DIR="$STATE/report"
          export IMAS_UAT_CORE_KUBECONFIG="$STATE/k0s/core.kubeconfig"
          export IMAS_UAT_ENDPOINTS="$STATE/k0s/endpoints.json"
          # The ha tier: the DMZ cluster, and the DMZ chart uat/hub/dmz pulled
          # (HA3's helm upgrade; the core chart is in the core state directory).
          export IMAS_UAT_DMZ_KUBECONFIG="$STATE/k0s/dmz.kubeconfig"
          export IMAS_UAT_DMZ_CHART="$STATE/dmz/chart/nats-${IMAS_UAT_RELEASE_TAG#v}.tgz"
          if [ "$TIER" = smoke ]; then export IMAS_UAT_TIMEOUT=45m; else export IMAS_UAT_TIMEOUT=165m; fi
          read -r -a ids <<<"$SCENARIOS"
          uat/tests/run.sh "$TIER" "${ids[@]}"

      # A failed or timed out HA2 (node stop) can leave a hub VM stopped. Start
      # every node of an HA hub again (a running VM just answers), so the
      # report, a kept environment and the destroy find the hubs whole.
      - name: Start the HA hubs' VMs
        if: always() && steps.tests.outcome != 'skipped' && steps.inputs.outputs.hub_nodes == '3'
        env:
          UAT_AZ_RELOGIN: ${{ github.workspace }}/uat/access/az-relogin.sh
        run: |
          set -euo pipefail
          # Best effort: vmctl.sh logs in again by itself on AADSTS700024.
          uat/access/session.sh phase "start the HA hubs' VMs" --no-tunnels || true
          status=0
          while IFS= read -r vm; do
            uat/access/vmctl.sh "$STATE/uat.json" start-vm "$vm" || status=1
          done < <(jq -r '.core[], .dmz[]' "$STATE/ha_node_names.json")
          exit "$status"

      # The failure-time diagnostic (W6): how old the login and the tunnels
      # were, whether each tunnel's process still ran, and the end of each
      # tunnel's log. Nothing secret is in them.
      - name: Azure login and tunnel ages (on failure)
        if: failure() && steps.tunnels.outcome != 'skipped'
        run: uat/access/session.sh ages "at the failure"

      - name: Close the Bastion tunnels
        if: always() && steps.tunnels.outcome != 'skipped'
        run: uat/access/tunnels.sh close "$STATE/access"

      # Allowlisted, non-secret files only, scanned for anything that looks
      # like a credential (a match fails this step and is not uploaded).
      - name: Collect the report and outputs
        id: collect
        if: always() && steps.runid.outcome == 'success'
        run: uat/scripts/collect-artifacts.sh "$STATE" "$ARTIFACTS"

      - name: Upload the test report
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: uat-report-${{ steps.runid.outputs.run_id }}
          path: ${{ runner.temp }}/uat-artifacts/report
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the outputs (no credentials)
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: uat-outputs-${{ steps.runid.outputs.run_id }}
          path: ${{ runner.temp }}/uat-artifacts/outputs
          if-no-files-found: warn
          retention-days: 30

      # Teardown, whatever happened above, unless keep_hours is above zero.
      # The azure/login action, as for the first login: the destroy does
      # not depend on uat/access, and the age guard never stops it (W6).
      - name: Azure login again (before the destroy)
        id: login_destroy
        if: always() && steps.apply.outcome != 'skipped' && steps.inputs.outputs.destroy == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy (uat/tofu/destroy.sh)
        id: destroy
        if: always() && steps.apply.outcome != 'skipped' && steps.inputs.outputs.destroy == 'true'
        env:
          TF_VAR_release_tag: ${{ steps.inputs.outputs.release_tag }}
          TF_VAR_region: ${{ steps.inputs.outputs.region }}
          TF_VAR_public_ingress: ${{ steps.inputs.outputs.public_ingress }}
          TF_VAR_public_ingress_cidrs: ${{ steps.inputs.outputs.public_ingress_cidrs }}
          TF_VAR_core_node_count: ${{ steps.inputs.outputs.core_node_count }}
          TF_VAR_dmz_node_count: ${{ steps.inputs.outputs.dmz_node_count }}
          LOGIN_OUTCOME: ${{ steps.login_destroy.outcome }}
        run: |
          if [ "$LOGIN_OUTCOME" = success ]; then uat/access/session.sh mark-login || true; fi
          uat/access/session.sh ages "destroy" || true
          uat/tofu/destroy.sh "$RUN_ID"

      # Independent of destroy.sh's own check: the job fails if the group or
      # anything tagged with the run_id is left.
      - name: Verify teardown
        if: always() && steps.destroy.outcome != 'skipped'
        run: uat/scripts/verify-teardown.sh "$RUN_ID"

      - name: Kept environment
        if: always() && steps.apply.outcome != 'skipped' && steps.inputs.outputs.destroy == 'false'
        run: |
          set -euo pipefail
          uat/access/session.sh phase "kept environment" --no-tunnels || true
          expires=$(az group show --name "imas-uat-$RUN_ID" --query tags.expires_at -o tsv 2>/dev/null || echo unknown)
          {
            echo "### Environment kept: imas-uat-$RUN_ID"
            echo
            echo "Not destroyed (keep_hours > 0). The janitor deletes it after expires_at $expires."
            echo "Reach it and destroy it early as uat/README.md, 'Keeping an environment', says."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::notice::environment imas-uat-$RUN_ID kept until $expires"

      - name: Summary
        if: always() && steps.runid.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          TIER: ${{ steps.inputs.outputs.tier }}
        run: |
          {
            echo "### UAT run $RUN_ID: $RELEASE_TAG, tier $TIER"
            echo
            if [ -s "$STATE/report/summary.txt" ]; then
              echo '```'
              cat "$STATE/report/summary.txt"
              echo '```'
            else
              echo "No test report: the run stopped before or during the tests (see the failed step)."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
