# replaced, never self-updated. saasapi, farmerbus and fleetreleaser have
# their own builds above.
dockers:
  - id: farmer-amd64
    goos: linux
    goarch: amd64
    ids: [farmer-pkg]
    image_templates:
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}-amd64"
    dockerfile: docker/goreleaser.farmer.dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/yogzblr/imas"
      - "--label=org.opencontainers.image.version={{ .Version }}"
