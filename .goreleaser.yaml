    image_templates:
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}-amd64"
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}-arm64"
    skip_push: "{{ .IsSnapshot }}"
  - name_template: "ghcr.io/yogzblr/imas-farmer:latest"
    image_templates:
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}-amd64"
