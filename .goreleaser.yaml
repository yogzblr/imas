# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

# Support for nightlies and proper versioning
snapshot:
  name_template: "{{ incpatch .Version }}-next"

builds:
  # Package manager builds (no self-update)
  - main: ./cmd/sprout/
    id: "sprout-pkg"
    binary: "{{.ProjectName}}-sprout-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  - main: ./cmd/farmer/
    id: "farmer-pkg"
    binary: "{{.ProjectName}}-farmer-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  - main: ./cmd/imas/
    id: "imas-pkg"
    binary: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  # Windows sprout, packaged as an MSI (see the msi section) that installs
  # the imas-sprout Windows service. Package-managed like the -pkg builds
  # above, so no self-update. A fixed binary name keeps the .wxs template's
  # {{ .Binary }} predictable.
  - main: ./cmd/sprout/
    id: "sprout-windows-pkg"
    binary: "{{.ProjectName}}-sprout"
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update

  # Standalone builds (with self-update)
  - main: ./cmd/sprout/
    id: "sprout"
    binary: "{{.ProjectName}}-sprout-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update
  - main: ./cmd/farmer/
    id: "farmer"
    binary: "{{.ProjectName}}-farmer-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update
  - main: ./cmd/imas/
    id: "imas"
    binary: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update

  # Service binary: container image + release archive
  - main: ./cmd/saasapi/
    id: "saasapi"
    binary: "{{.ProjectName}}-saasapi"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
  # Service binary: container image + release archive
  - main: ./cmd/farmerbus/
    id: "farmerbus"
    binary: "{{.ProjectName}}-farmerbus"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
  # Service binary: container image + release archive
  - main: ./cmd/fleetreleaser/
    id: "fleetreleaser"
    binary: "{{.ProjectName}}-fleetreleaser"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}

# generates macOS universal binaries
# name would be: imas-v1.0.0-darwin-universal
universal_binaries:
  - id: imas-universal
    ids:
      - "imas"
    name_template: "{{.ProjectName}}-{{.Version}}-darwin-universal"
    replace: true

# generates archives for the CLI (standalone binaries with self-update)
archives:
  - id: cli
    formats: [tar.gz]
    # This allows for us to handle the universal binaries
    allow_different_binary_count: true
    # This puts all the standalone binaries for a given system into one archive
    ids:
      - imas
      - imas-universal
      - farmer
      - sprout
    name_template: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip
  # Service binaries (not for CLI/sprout users): one archive per arch.
  - id: services
    formats: [tar.gz]
    ids:
      - saasapi
      - farmerbus
      - fleetreleaser
    name_template: "{{.ProjectName}}-services-{{.Version}}-{{.Os}}-{{.Arch}}"


# Windows installer for imas-sprout: installs the imas-sprout service. Built
# with msitools' wixl on Linux (install wixl + msitools on the runner), then
# fixed up by msi-postprocess.sh for what wixl can't express (directory ACL,
# service failure actions, Permanent/NeverOverwrite). See
# packaging/windows/imas-sprout.wxs and packaging/README.md.
msi:
  - id: imas-sprout-msi
    name: "{{.ProjectName}}-sprout-{{.Version}}-windows-{{.MsiArch}}"
    wxs: ./packaging/windows/imas-sprout.wxs
    # Build IDs, whatever the goreleaser docs say ("IDs of the archives"):
    # verified with goreleaser-pro v2.18.2, an archive ID matches nothing and
    # the pipe silently produces no MSI.
    ids:
      - sprout-windows-pkg
    # Copied to the same relative path next to the .wxs (not flattened).
    extra_files:
      - packaging/etc/imas-sprout.conf
    version: v3
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      after:
        - cmd: ./packaging/windows/msi-postprocess.sh "{{ .ArtifactPath }}"
          output: true

nfpms:
  - id: imas
    package_name: imas
    builds: [imas-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "Effective fleet configuration management"
    maintainer: Tai Groot <tai@taigrr.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: Adatomic, Inc.
    version_metadata: git

  - id: imas-farmer
    package_name: imas-farmer
    builds: [farmer-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "IMAS control plane"
    maintainer: Tai Groot <tai@taigrr.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: Adatomic, Inc.
    version_metadata: git
    contents:
      - src: ./packaging/etc/imas-farmer.conf
        dst: /etc/imas/farmer
        type: config
        file_info:
          mode: 0644
      - dst: /etc/imas/pki/farmer/
        type: dir
        file_info:
          mode: 0755
          owner: farmer
          group: farmer
      - dst: /var/cache/imas/farmer
        type: dir
        file_info:
          mode: 0755
          owner: farmer
          group: farmer
    scripts:
      preinstall: ./packaging/alpine/imas-farmer.pre-install
      postinstall: ./packaging/alpine/imas-farmer.post-install
    overrides:
      apk:
        contents:
          - src: ./packaging/alpine/imas-farmer.initd
            dst: /etc/init.d/imas-farmer
            type: config
            file_info:
              mode: 0755
      deb:
        contents:
          - src: ./packaging/systemd/imas-farmer.service
            dst: /lib/systemd/system/imas-farmer.service
            type: config
            file_info:
              mode: 0644
        scripts:
          preinstall: ./packaging/alpine/imas-farmer.pre-install
          postinstall: ./packaging/scripts/imas-farmer-deb-postinstall.sh
      rpm:
        contents:
          - src: ./packaging/systemd/imas-farmer.service
            dst: /usr/lib/systemd/system/imas-farmer.service
            type: config
            file_info:
              mode: 0644
        scripts:
          preinstall: ./packaging/alpine/imas-farmer.pre-install
          postinstall: ./packaging/scripts/imas-farmer-rpm-postinstall.sh

  - id: imas-sprout
    package_name: imas-sprout
    builds: [sprout-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "IMAS remote control agent"
    maintainer: Will Sinatra <wpsinatra@gmail.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: Adatomic, Inc.
    version_metadata: git
    contents:
      - src: ./packaging/etc/imas-sprout.conf
        dst: /etc/imas/sprout
        type: config
        file_info:
          mode: 0644
      - dst: /var/cache/imas/sprout
        type: dir
        file_info:
          mode: 0755
    scripts:
      postinstall: ./packaging/alpine/imas-sprout.post-install
    overrides:
      apk:
        contents:
          - src: ./packaging/alpine/imas-sprout.initd
            dst: /etc/init.d/imas-sprout
            type: config
            file_info:
              mode: 0755
      deb:
        contents:
          - src: ./packaging/systemd/imas-sprout.service
            dst: /lib/systemd/system/imas-sprout.service
            type: config
            file_info:
              mode: 0644
        scripts:
          postinstall: ./packaging/scripts/imas-sprout-deb-postinstall.sh
      rpm:
        contents:
          - src: ./packaging/systemd/imas-sprout.service
            dst: /usr/lib/systemd/system/imas-sprout.service
            type: config
            file_info:
              mode: 0644
        scripts:
          postinstall: ./packaging/scripts/imas-sprout-rpm-postinstall.sh

# Container images: GHCR only, linux/amd64 + linux/arm64, one multi-arch
