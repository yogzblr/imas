# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# Fail if go.mod/go.sum are not tidy, instead of tidying them here: a tidy
# that rewrote them would build a tree that is not the tagged commit. Fix it
# by committing the output of `go mod tidy`; ci.yml runs the same check on
# every pull request. (The hook runs after GoReleaser's dirty-tree check, so
# only this diff would catch it.)
before:
  hooks:
    - sh -c 'go mod tidy && git diff --exit-code -- go.mod go.sum'

# Support for nightlies and proper versioning
snapshot:
  name_template: "{{ incpatch .Version }}-next"

builds:
  # Package manager builds (no self-update). The binary name is deliberately
  # unversioned: nfpm installs it under bindir as-is, and the systemd units,
  # OpenRC init scripts and docs all expect /usr/bin/imas-sprout,
  # /usr/bin/imas-farmer and /usr/bin/imas. (Each build writes into its own
  # dist/<id>_<os>_<arch> directory, so the names do not collide.)
  - main: ./cmd/sprout/
    id: "sprout-pkg"
    binary: "{{.ProjectName}}-sprout"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    # Static: the service images are FROM scratch, which has no libc/loader.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  - main: ./cmd/farmer/
    id: "farmer-pkg"
    binary: "{{.ProjectName}}-farmer"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    # Static: the service images are FROM scratch, which has no libc/loader.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  - main: ./cmd/imas/
    id: "imas-pkg"
    binary: "{{.ProjectName}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  # Windows sprout, packaged as an MSI that installs the imas-sprout Windows
  # service. Package-managed like the -pkg builds above, so no self-update.
  # The post hook builds dist/imas-sprout-<Version>-windows-x64.msi from
  # packaging/windows/imas-sprout.wxs with msitools' wixl (install wixl +
  # msitools on the runner), then fixes it up with msi-postprocess.sh for
  # what wixl can't express (directory ACL, service failure actions,
  # Permanent/NeverOverwrite). This replaces goreleaser-pro's msi pipe, so
  # GoReleaser OSS is enough. The MSI is not a build artifact: checksum and
  # release pick it up through extra_files below. Hook commands run from
  # the project root, so --out dist is the dist directory. See
  # packaging/windows/build-msi.sh and packaging/README.md.
  - main: ./cmd/sprout/
    id: "sprout-windows-pkg"
    binary: "{{.ProjectName}}-sprout"
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
    hooks:
      post:
        - cmd: ./packaging/windows/build-msi.sh --binary "{{ .Path }}" --version "{{ .Version }}" --out dist --timestamp "{{ .CommitTimestamp }}"
          output: true

  # Standalone builds (with self-update)
  - main: ./cmd/sprout/
    id: "sprout"
    binary: "{{.ProjectName}}-sprout-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    # Static: the service images are FROM scratch, which has no libc/loader.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update
  - main: ./cmd/farmer/
    id: "farmer"
    binary: "{{.ProjectName}}-farmer-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    # Static: the service images are FROM scratch, which has no libc/loader.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update
  - main: ./cmd/imas/
    id: "imas"
    binary: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update

  # Service binary: container image + release archive
  - main: ./cmd/saasapi/
    id: "saasapi"
    binary: "{{.ProjectName}}-saasapi"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
  # Service binary: container image + release archive
  - main: ./cmd/farmerbus/
    id: "farmerbus"
    binary: "{{.ProjectName}}-farmerbus"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
  # Service binary: container image + release archive
  - main: ./cmd/fleetreleaser/
    id: "fleetreleaser"
    binary: "{{.ProjectName}}-fleetreleaser"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
  # Service binary: container image + release archive. The Helm chart's
  # schema migration hook Job (deploy/helm/farmer, "Migrations").
  - main: ./cmd/migrate/
    id: "migrate"
    binary: "{{.ProjectName}}-migrate"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}

# generates macOS universal binaries
# name would be: imas-v1.0.0-darwin-universal
universal_binaries:
  - id: imas-universal
    ids:
      - "imas"
    name_template: "{{.ProjectName}}-{{.Version}}-darwin-universal"
    replace: true

# generates archives for the CLI (standalone binaries with self-update)
archives:
  - id: cli
    formats: [tar.gz]
    # This allows for us to handle the universal binaries
    allow_different_binary_count: true
    # This puts all the standalone binaries for a given system into one archive
    ids:
      - imas
      - imas-universal
      - farmer
      - sprout
    name_template: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip
  # Service binaries (not for CLI/sprout users): one archive per arch.
  - id: services
    formats: [tar.gz]
    ids:
      - saasapi
      - farmerbus
      - fleetreleaser
      - migrate
    name_template: "{{.ProjectName}}-services-{{.Version}}-{{.Os}}-{{.Arch}}"


nfpms:
  - id: imas
    package_name: imas
    builds: [imas-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "Effective fleet configuration management"
    maintainer: Yogesh Gundurao <yogesh.gundurao@gmail.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: imas contributors
    version_metadata: git

  - id: imas-farmer
    package_name: imas-farmer
    builds: [farmer-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "IMAS control plane"
    maintainer: Yogesh Gundurao <yogesh.gundurao@gmail.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: imas contributors
    version_metadata: git
    # Shared files (config, trust root, directories) are repeated under each
    # override below on purpose: a per-format `contents` REPLACES the
    # top-level list in nfpm, it is not appended to it. See
    # packaging/check-package-contents.sh, which CI runs on a snapshot.
    scripts:
      preinstall: ./packaging/alpine/imas-farmer.pre-install
      postinstall: ./packaging/alpine/imas-farmer.post-install
    overrides:
      apk:
        contents:
          - src: ./packaging/etc/imas-farmer.conf
            dst: /etc/imas/farmer
            type: config
            file_info:
              mode: 0644
          - dst: /etc/imas/pki/farmer/
            type: dir
            file_info:
              mode: 0755
              owner: farmer
              group: farmer
          - dst: /var/cache/imas/farmer
            type: dir
            file_info:
              mode: 0755
              owner: farmer
              group: farmer
          - src: ./packaging/alpine/imas-farmer.initd
            dst: /etc/init.d/imas-farmer
            type: config
            file_info:
              mode: 0755
      deb:
        contents:
          - src: ./packaging/etc/imas-farmer.conf
            dst: /etc/imas/farmer
            type: config
            file_info:
              mode: 0644
          - dst: /etc/imas/pki/farmer/
            type: dir
            file_info:
              mode: 0755
              owner: farmer
              group: farmer
          - dst: /var/cache/imas/farmer
            type: dir
            file_info:
              mode: 0755
              owner: farmer
              group: farmer
          - src: ./packaging/systemd/imas-farmer.service
            dst: /lib/systemd/system/imas-farmer.service
            type: config
            file_info:
              mode: 0644
        scripts:
          preinstall: ./packaging/scripts/imas-farmer-preinstall.sh
          postinstall: ./packaging/scripts/imas-farmer-deb-postinstall.sh
      rpm:
        contents:
          - src: ./packaging/etc/imas-farmer.conf
            dst: /etc/imas/farmer
            type: config
            file_info:
              mode: 0644
          - dst: /etc/imas/pki/farmer/
            type: dir
            file_info:
              mode: 0755
              owner: farmer
              group: farmer
          - dst: /var/cache/imas/farmer
            type: dir
            file_info:
              mode: 0755
              owner: farmer
              group: farmer
          - src: ./packaging/systemd/imas-farmer.service
            dst: /usr/lib/systemd/system/imas-farmer.service
            type: config
            file_info:
              mode: 0644
        scripts:
          preinstall: ./packaging/scripts/imas-farmer-preinstall.sh
          postinstall: ./packaging/scripts/imas-farmer-rpm-postinstall.sh

  - id: imas-sprout
    package_name: imas-sprout
    builds: [sprout-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "IMAS remote control agent"
    maintainer: Yogesh Gundurao <yogesh.gundurao@gmail.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: imas contributors
    version_metadata: git
    # Shared files (config, trust root, directories) are repeated under each
    # override below on purpose: a per-format `contents` REPLACES the
    # top-level list in nfpm, it is not appended to it. See
    # packaging/check-package-contents.sh, which CI runs on a snapshot.
    scripts:
      postinstall: ./packaging/alpine/imas-sprout.post-install
    overrides:
      apk:
        contents:
          # noreplace: the sprout writes its own state (sproutid, an emptied
          # jointoken) and the admin's settings into this file, so an upgrade,
          # including a self_update's rpm -U, must keep it (.rpmnew beside it)
          # rather than move it to .rpmsave. dpkg keeps it via --force-confold.
          - src: ./packaging/etc/imas-sprout.conf
            dst: /etc/imas/sprout
            type: config|noreplace
            file_info:
              mode: 0644
          # The self_update trust root (packaging/etc/fleet-signing-keys.md).
          # Deliberately not a config file: every upgrade replaces it, which is
          # how a signing key rotation reaches the fleet.
          - src: ./packaging/etc/fleet-signing-keys.json
            dst: /etc/imas/fleet-signing-keys.json
            file_info:
              mode: 0644
          - dst: /var/cache/imas/sprout
            type: dir
            file_info:
              mode: 0755
          - src: ./packaging/alpine/imas-sprout.initd
            dst: /etc/init.d/imas-sprout
            type: config
            file_info:
              mode: 0755
      deb:
        contents:
          # noreplace: the sprout writes its own state (sproutid, an emptied
          # jointoken) and the admin's settings into this file, so an upgrade,
          # including a self_update's rpm -U, must keep it (.rpmnew beside it)
          # rather than move it to .rpmsave. dpkg keeps it via --force-confold.
          - src: ./packaging/etc/imas-sprout.conf
            dst: /etc/imas/sprout
            type: config|noreplace
            file_info:
              mode: 0644
          # The self_update trust root (packaging/etc/fleet-signing-keys.md).
          # Deliberately not a config file: every upgrade replaces it, which is
          # how a signing key rotation reaches the fleet.
          - src: ./packaging/etc/fleet-signing-keys.json
            dst: /etc/imas/fleet-signing-keys.json
            file_info:
              mode: 0644
          - dst: /var/cache/imas/sprout
            type: dir
            file_info:
              mode: 0755
          - src: ./packaging/systemd/imas-sprout.service
            dst: /lib/systemd/system/imas-sprout.service
            type: config
            file_info:
              mode: 0644
        scripts:
          postinstall: ./packaging/scripts/imas-sprout-deb-postinstall.sh
      rpm:
        contents:
          # noreplace: the sprout writes its own state (sproutid, an emptied
          # jointoken) and the admin's settings into this file, so an upgrade,
          # including a self_update's rpm -U, must keep it (.rpmnew beside it)
          # rather than move it to .rpmsave. dpkg keeps it via --force-confold.
          - src: ./packaging/etc/imas-sprout.conf
            dst: /etc/imas/sprout
            type: config|noreplace
            file_info:
              mode: 0644
          # The self_update trust root (packaging/etc/fleet-signing-keys.md).
          # Deliberately not a config file: every upgrade replaces it, which is
          # how a signing key rotation reaches the fleet.
          - src: ./packaging/etc/fleet-signing-keys.json
            dst: /etc/imas/fleet-signing-keys.json
            file_info:
              mode: 0644
          - dst: /var/cache/imas/sprout
            type: dir
            file_info:
              mode: 0755
          - src: ./packaging/systemd/imas-sprout.service
            dst: /usr/lib/systemd/system/imas-sprout.service
            type: config
            file_info:
              mode: 0644
        scripts:
          postinstall: ./packaging/scripts/imas-sprout-rpm-postinstall.sh

# Container images: GHCR only, linux/amd64 + linux/arm64, one multi-arch
# manifest per image, signed keyless with cosign (docker_signs below).
# Images use the package-managed (no_self_update) builds: a container is
# replaced, never self-updated. saasapi, farmerbus, fleetreleaser and
# migrate have their own builds above.
dockers:
  - id: farmer-amd64
    goos: linux
    goarch: amd64
    ids: [farmer-pkg]
    image_templates:
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}-amd64"
    dockerfile: docker/goreleaser.farmer.dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/yogzblr/imas"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    # Only push for tagged releases
    skip_push: "{{ .IsSnapshot }}"
  - id: farmer-arm64
    goos: linux
    goarch: arm64
    ids: [farmer-pkg]
    image_templates:
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}-arm64"
    dockerfile: docker/goreleaser.farmer.dockerfile
    use: buildx
