# Keyless cosign signatures (Sigstore OIDC from the GitHub Actions run; no
# key to manage). Verified before the chart is published, see
# .github/workflows/publish-packages.yml and SECURITY.md.
docker_signs:
  - id: cosign-images
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

# Creates a draft github release for maintainer review
release:
  github:
    owner: yogzblr
    name: imas
  # IDs of everything uploaded to the release. The nfpm IDs are listed so
  # the imas-farmer/imas-sprout rpm/deb/apk packages are release assets:
  # .github/workflows/publish-packages.yml publishes the release's assets
  # to Buildkite. ("imas" covers both the CLI archives and its nfpm entry.)
  ids:
    - imas-universal
    - imas
    - farmer
    - sprout
    - imas-farmer
    - imas-sprout
    - imas-sprout-msi
    - services
  draft: true
  # Support for nightlies
  prerelease: auto

# Sign the checksums file twice. GPG (detached .sig) stays for apt/rpm users
# and the existing SECURITY.md flow. Keyless cosign (.sigstore.json bundle) is
# what the publish workflow verifies against this repo's release workflow.
signs:
  - id: gpg
    cmd: gpg2
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    output: true
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
  groups:
    - title: "Breaking Changes"
      regexp: "^.*!:+.*$"
      order: 0
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 1
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 2
    - title: "Performance"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 3
    - title: "Refactor"
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 4
    - title: "Build"
      regexp: "^.*build[(\\w)]*:+.*$"
      order: 5
    - title: Others
      order: 999
