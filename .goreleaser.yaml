# Keyless cosign signatures (Sigstore OIDC from the GitHub Actions run; no
# key to manage). Verified before the chart is published, see
# .github/workflows/publish-packages.yml and SECURITY.md.
docker_signs:
  - id: cosign-images
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

# Creates a draft github release for maintainer review
release:
  github:
    owner: yogzblr
    name: imas
  # IDs of everything uploaded to the release. GoReleaser filters every
  # artifact except checksums and extra_files by these, using the ID of the
  # config entry that made it, so each kind of asset needs its own entry:
  #   cli, services                    the archives (archives[].id)
  #   imas, imas-farmer, imas-sprout   the rpm/deb/apk packages (nfpms[].id);
  #                                    publish-packages.yml publishes them
  #                                    to Buildkite
  #   gpg, cosign                      the signatures over checksums.txt
  #                                    (signs[].id): checksums.txt.sig and
  #                                    checksums.txt.sigstore.json, which
  #                                    publish-packages.yml verifies
  # Build IDs match nothing here (only a `formats: [binary]` archive uploads
  # a bare binary), so none are listed.
  ids:
    - cli
    - services
    - imas
    - imas-farmer
    - imas-sprout
    - gpg
    - cosign
  # The imas-sprout MSI, written by the sprout-windows-pkg post hook. Not an
  # artifact goreleaser knows by ID, so it is attached here. The publish
  # workflow packs it into the winget packages.
  extra_files:
    - glob: ./dist/imas-sprout-*-windows-x64.msi
  draft: true
  # Support for nightlies
  prerelease: auto

# checksums.txt covers the archives and packages, and the imas-sprout MSI
# through extra_files: the MSI is written by a build hook, and checksums are
# computed after all builds, so it exists by then. goreleaser-check.yml (on
# pull requests, from a snapshot) and publish-packages.yml (on the release)
# check that checksums.txt lists it. The name is fixed: publish-packages.yml
# downloads checksums.txt by name.
checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./dist/imas-sprout-*-windows-x64.msi

# Sign the checksums file twice. GPG (detached .sig) stays for apt/rpm users
# and the existing SECURITY.md flow. Keyless cosign (.sigstore.json bundle) is
# what the publish workflow verifies against this repo's release workflow.
signs:
  - id: gpg
    cmd: gpg2
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    output: true
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
  groups:
    - title: "Breaking Changes"
      regexp: "^.*!:+.*$"
      order: 0
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 1
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 2
    - title: "Performance"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 3
    - title: "Refactor"
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 4
    - title: "Build"
      regexp: "^.*build[(\\w)]*:+.*$"
      order: 5
    - title: Others
      order: 999
