# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

# Support for nightlies and proper versioning
snapshot:
  name_template: "{{ incpatch .Version }}-next"

builds:
  # Package manager builds (no self-update)
  - main: ./cmd/sprout/
    id: "sprout-pkg"
    binary: "{{.ProjectName}}-sprout-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  - main: ./cmd/farmer/
    id: "farmer-pkg"
    binary: "{{.ProjectName}}-farmer-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  - main: ./cmd/imas/
    id: "imas-pkg"
    binary: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update
  # Windows sprout, packaged as an MSI (see the msi section) that installs
  # the imas-sprout Windows service. Package-managed like the -pkg builds
  # above, so no self-update. A fixed binary name keeps the .wxs template's
  # {{ .Binary }} predictable.
  - main: ./cmd/sprout/
    id: "sprout-windows-pkg"
    binary: "{{.ProjectName}}-sprout"
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - no_self_update

  # Standalone builds (with self-update)
  - main: ./cmd/sprout/
    id: "sprout"
    binary: "{{.ProjectName}}-sprout-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update
  - main: ./cmd/farmer/
    id: "farmer"
    binary: "{{.ProjectName}}-farmer-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update
  - main: ./cmd/imas/
    id: "imas"
    binary: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    ldflags:
      - -X main.GitCommit={{.ShortCommit}} -X main.Tag=v{{.Version}}
    tags:
      - self_update

# generates macOS universal binaries
# name would be: imas-v1.0.0-darwin-universal
universal_binaries:
  - id: imas-universal
    ids:
      - "imas"
    name_template: "{{.ProjectName}}-{{.Version}}-darwin-universal"
    replace: true

# generates archives for the CLI (standalone binaries with self-update)
archives:
  - formats: tar.gz
    # This allows for us to handle the universal binaries
    allow_different_binary_count: true
    # This puts all the standalone binaries for a given system into one archive
    ids:
      - imas
      - imas-universal
      - farmer
      - sprout
    name_template: "{{.ProjectName}}-{{.Version}}-{{.Os}}-{{.Arch}}"
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

# Windows installer for imas-sprout: installs the imas-sprout service. Built
# with msitools' wixl on Linux (install wixl + msitools on the runner), then
# fixed up by msi-postprocess.sh for what wixl can't express (directory ACL,
# service failure actions, Permanent/NeverOverwrite). See
# packaging/windows/imas-sprout.wxs and packaging/README.md.
msi:
  - id: imas-sprout-msi
    name: "{{.ProjectName}}-sprout-{{.Version}}-windows-{{.MsiArch}}"
    wxs: ./packaging/windows/imas-sprout.wxs
    # Build IDs, whatever the goreleaser docs say ("IDs of the archives"):
    # verified with goreleaser-pro v2.18.2, an archive ID matches nothing and
    # the pipe silently produces no MSI.
    ids:
      - sprout-windows-pkg
    # Copied to the same relative path next to the .wxs (not flattened).
    extra_files:
      - packaging/etc/imas-sprout.conf
    version: v3
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      after:
        - cmd: ./packaging/windows/msi-postprocess.sh "{{ .ArtifactPath }}"
          output: true

nfpms:
  - id: imas
    package_name: imas
    builds: [imas-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "Effective fleet configuration management"
    maintainer: Tai Groot <tai@taigrr.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: Adatomic, Inc.
    version_metadata: git

  - id: imas-farmer
    package_name: imas-farmer
    builds: [farmer-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "IMAS control plane"
    maintainer: Tai Groot <tai@taigrr.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: Adatomic, Inc.
    version_metadata: git
    contents:
      - src: ./packaging/etc/imas-farmer.conf
        dst: /etc/imas/farmer
        type: config
        file_info:
          mode: 0644
      - dst: /etc/imas/pki/farmer/
        type: dir
        file_info:
          mode: 0755
          owner: farmer
          group: farmer
      - dst: /var/cache/imas/farmer
        type: dir
        file_info:
          mode: 0755
          owner: farmer
          group: farmer
    scripts:
      preinstall: ./packaging/alpine/imas-farmer.pre-install
      postinstall: ./packaging/alpine/imas-farmer.post-install
    overrides:
      apk:
        contents:
          - src: ./packaging/alpine/imas-farmer.initd
            dst: /etc/init.d/imas-farmer
            type: config
            file_info:
              mode: 0755
      deb:
        contents:
          - src: ./packaging/systemd/imas-farmer.service
            dst: /lib/systemd/system/imas-farmer.service
            type: config
            file_info:
              mode: 0644
        scripts:
          preinstall: ./packaging/alpine/imas-farmer.pre-install
          postinstall: ./packaging/scripts/imas-farmer-deb-postinstall.sh
      rpm:
        contents:
          - src: ./packaging/systemd/imas-farmer.service
            dst: /usr/lib/systemd/system/imas-farmer.service
            type: config
            file_info:
              mode: 0644
        scripts:
          preinstall: ./packaging/alpine/imas-farmer.pre-install
          postinstall: ./packaging/scripts/imas-farmer-rpm-postinstall.sh

  - id: imas-sprout
    package_name: imas-sprout
    builds: [sprout-pkg] # Use package manager build without self-update
    formats: [apk, deb, rpm]
    bindir: /usr/bin
    description: "IMAS remote control agent"
    maintainer: Will Sinatra <wpsinatra@gmail.com>
    license: 0BSD
    homepage: https://imas.dev
    vendor: Adatomic, Inc.
    version_metadata: git
    contents:
      - src: ./packaging/etc/imas-sprout.conf
        dst: /etc/imas/sprout
        type: config
        file_info:
          mode: 0644
      - dst: /var/cache/imas/sprout
        type: dir
        file_info:
          mode: 0755
    scripts:
      postinstall: ./packaging/alpine/imas-sprout.post-install
    overrides:
      apk:
        contents:
          - src: ./packaging/alpine/imas-sprout.initd
            dst: /etc/init.d/imas-sprout
            type: config
            file_info:
              mode: 0755
      deb:
        contents:
          - src: ./packaging/systemd/imas-sprout.service
            dst: /lib/systemd/system/imas-sprout.service
            type: config
            file_info:
              mode: 0644
        scripts:
          postinstall: ./packaging/scripts/imas-sprout-deb-postinstall.sh
      rpm:
        contents:
          - src: ./packaging/systemd/imas-sprout.service
            dst: /usr/lib/systemd/system/imas-sprout.service
            type: config
            file_info:
              mode: 0644
        scripts:
          postinstall: ./packaging/scripts/imas-sprout-rpm-postinstall.sh

# Cloudsmith publishing
publishers:
  - name: cloudsmith
    # Only publish for tagged releases (not snapshots/nightlies)
    disable: "{{ .IsSnapshot }}"
    cmd: cloudsmith push {{ if .IsSnapshot }}raw{{ else }}{{ .ArtifactExt }}{{ end }} {{ .Env.CLOUDSMITH_REPOSITORY }} {{ .ArtifactPath }}
    env:
      - CLOUDSMITH_API_KEY={{ .Env.CLOUDSMITH_API_KEY }}

# Docker images
dockers:
  # Docker Hub
  - image_templates:
      - "imas/farmer:{{ .Version }}"
      - "imas/farmer:latest"
    dockerfile: docker/goreleaser.farmer.dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    ids:
      - farmer
    # Only push for tagged releases
    skip_push: "{{ .IsSnapshot }}"

  - image_templates:
      - "imas/sprout:{{ .Version }}"
      - "imas/sprout:latest"
    dockerfile: docker/goreleaser.sprout.dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    ids:
      - sprout
    # Only push for tagged releases
    skip_push: "{{ .IsSnapshot }}"

  # GitHub Container Registry
  - image_templates:
      - "ghcr.io/yogzblr/imas-farmer:{{ .Version }}"
      - "ghcr.io/yogzblr/imas-farmer:latest"
    dockerfile: docker/goreleaser.farmer.dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    ids:
      - farmer
    # Only push for tagged releases
    skip_push: "{{ .IsSnapshot }}"

  - image_templates:
      - "ghcr.io/yogzblr/imas-sprout:{{ .Version }}"
      - "ghcr.io/yogzblr/imas-sprout:latest"
    dockerfile: docker/goreleaser.sprout.dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    ids:
      - sprout
    # Only push for tagged releases
    skip_push: "{{ .IsSnapshot }}"

# S3 artifact publishing for standalone binaries
blobs:
  - provider: s3
    region: us-east-1
    bucket: artifacts.imas.dev
    # Only upload for tagged releases (not snapshots/nightlies)
    disable: "{{ .IsSnapshot }}"
    ids:
      - imas # standalone builds only
      - farmer
      - sprout
    # Upload with version in path: s3://artifacts.imas.dev/linux/amd64/v1.0.0/imas
    extra_files:
      - glob: "./dist/imas-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
        name_template: "{{ .Os }}/{{ .Arch }}/{{ .Tag }}/imas"
      - glob: "./dist/imas-farmer-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
        name_template: "{{ .Os }}/{{ .Arch }}/{{ .Tag }}/farmer"
      - glob: "./dist/imas-sprout-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
        name_template: "{{ .Os }}/{{ .Arch }}/{{ .Tag }}/sprout"
      # Upload checksums and signatures for this version
      - glob: "./dist/checksums.txt"
        name_template: "{{ .Os }}/{{ .Arch }}/{{ .Tag }}/checksums.txt"
      - glob: "./dist/checksums.txt.sig"
        name_template: "{{ .Os }}/{{ .Arch }}/{{ .Tag }}/checksums.txt.sig"

  - provider: s3
    region: us-east-1
    bucket: artifacts.imas.dev
    # Only upload for tagged releases (not snapshots/nightlies)
    disable: "{{ .IsSnapshot }}"
    ids:
      - imas # standalone builds only
      - farmer
      - sprout
    # Also upload to "latest" path: s3://artifacts.imas.dev/linux/amd64/latest/imas
    extra_files:
      - glob: "./dist/imas-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
        name_template: "{{ .Os }}/{{ .Arch }}/latest/imas"
      - glob: "./dist/imas-farmer-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
        name_template: "{{ .Os }}/{{ .Arch }}/latest/farmer"
      - glob: "./dist/imas-sprout-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
        name_template: "{{ .Os }}/{{ .Arch }}/latest/sprout"
      # Upload checksums and signatures for latest
      - glob: "./dist/checksums.txt"
        name_template: "{{ .Os }}/{{ .Arch }}/latest/checksums.txt"
      - glob: "./dist/checksums.txt.sig"
        name_template: "{{ .Os }}/{{ .Arch }}/latest/checksums.txt.sig"

  # Upload global manifests (version-specific and latest)
  - provider: s3
    region: us-east-1
    bucket: artifacts.imas.dev
    disable: "{{ .IsSnapshot }}"
    extra_files:
      # Version-specific manifests
      - glob: "./dist/checksums.txt"
        name_template: "{{ .Tag }}/checksums.txt"
      - glob: "./dist/checksums.txt.sig"
        name_template: "{{ .Tag }}/checksums.txt.sig"
      - glob: "./dist/artifacts.json"
        name_template: "{{ .Tag }}/artifacts.json"
      # Latest manifests
      - glob: "./dist/checksums.txt"
        name_template: "latest/checksums.txt"
      - glob: "./dist/checksums.txt.sig"
        name_template: "latest/checksums.txt.sig"
      - glob: "./dist/artifacts.json"
        name_template: "latest/artifacts.json"

# Creates a draft github release for maintainer review
release:
  github:
    owner: yogzblr
    name: imas
  # IDs of everything uploaded to the release. The nfpm IDs are listed so
  # the imas-farmer/imas-sprout rpm/deb/apk packages are release assets:
  # .github/workflows/publish-packages.yml publishes the release's assets
  # to Buildkite. ("imas" covers both the CLI archives and its nfpm entry.)
  ids:
    - imas-universal
    - imas
    - farmer
    - sprout
    - imas-farmer
    - imas-sprout
    - imas-sprout-msi
  draft: true
  # Support for nightlies
  prerelease: auto

# Sign checksums and artifacts
signs:
  - cmd: gpg2
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  abbrev: -1
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
  groups:
    - title: "Breaking Changes"
      regexp: "^.*!:+.*$"
      order: 0
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 1
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 2
    - title: "Performance"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 3
    - title: "Refactor"
      regexp: "^.*refactor[(\\w)]*:+.*$"
      order: 4
    - title: "Build"
      regexp: "^.*build[(\\w)]*:+.*$"
      order: 5
    - title: Others
      order: 999

# AUR publishing
aurs:
  # IMAS CLI tool
  - name: imas
    ids: [imas-pkg]
    disable: "{{ or .IsSnapshot .IsPrerelease }}"
    homepage: https://imas.dev
    description: "imas: effective fleet configuration management CLI"
    maintainers:
      - "Tai Groot <tai@taigrr.com>"
    license: 0BSD
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/imas-bin.git"
    provides:
      - imas
    conflicts:
      - imas
      - imas-git
    commit_author:
      name: imas-bot
      email: bot@imas.dev
    commit_msg_template: "Update to {{ .Tag }}"
    package: |-
      # CLI binary
      install -Dm755 "./imas" "${pkgdir}/usr/bin/imas"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/imas-bin/LICENSE"

  # imas Farmer (Control Plane)
  - name: imas-farmer-bin
    ids: [farmer-pkg]
    disable: "{{ or .IsSnapshot .IsPrerelease }}"
    homepage: https://imas.dev
    description: "imas control plane service"
    maintainers:
      - "Tai Groot <tai@taigrr.com>"
    license: 0BSD
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/imas-farmer-bin.git"
    provides:
      - imas-farmer
    conflicts:
      - imas-farmer
      - imas-farmer-git
      - imas-farmer-bin
    backup:
      - etc/imas/farmer
    commit_author:
      name: imas-bot
      email: bot@imas.dev
    commit_msg_template: "Update to {{ .Tag }}"
    install: ./packaging/aur/imas-farmer.install
    package: |-
      # farmer binary
      install -Dm755 "./imas-farmer" "${pkgdir}/usr/bin/imas-farmer"

      # systemd service file
      install -Dm644 "./packaging/systemd/imas-farmer.service" "${pkgdir}/usr/lib/systemd/system/imas-farmer.service"

      # config file
      install -Dm644 "./packaging/etc/imas-farmer.conf" "${pkgdir}/etc/imas/farmer"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/imas-farmer-bin/LICENSE"

      # directories
      install -dm755 "${pkgdir}/etc/imas/pki/farmer"
      install -dm755 "${pkgdir}/var/cache/imas/farmer"

  # imas Sprout (Agent)
  - name: imas-sprout-bin
    ids: [sprout-pkg]
    disable: "{{ or .IsSnapshot .IsPrerelease }}"
    homepage: https://imas.dev
    description: "imas remote control agent"
    maintainers:
      - "Tai Groot <tai@taigrr.com>"
    license: 0BSD
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/imas-sprout-bin.git"
    provides:
      - imas-sprout
    conflicts:
      - imas-sprout
      - imas-sprout-git
      - imas-sprout-bin
    backup:
      - etc/imas/sprout
    commit_author:
      name: imas-bot
      email: bot@imas.dev
    commit_msg_template: "Update to {{ .Tag }}"
    install: ./packaging/aur/imas-sprout.install
    package: |-
      # sprout binary
      install -Dm755 "./imas-sprout" "${pkgdir}/usr/bin/imas-sprout"

      # systemd service file
      install -Dm644 "./packaging/systemd/imas-sprout.service" "${pkgdir}/usr/lib/systemd/system/imas-sprout.service"

      # config file
      install -Dm644 "./packaging/etc/imas-sprout.conf" "${pkgdir}/etc/imas/sprout"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/imas-sprout-bin/LICENSE"

      # directory
      install -dm755 "${pkgdir}/var/cache/imas/sprout"

# Announce releases
announce:
  discord:
    enabled: "{{ not .IsSnapshot }}"
    message_template: "imas {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"
