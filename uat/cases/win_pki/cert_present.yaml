id: I.win_pki.cert_present
title: 'import a certificate to the Personal store (PKI module)'
os: [windows]
notes: |
  A throwaway self-signed public certificate (CN=imas-uat-throwaway-test-cert, thumbprint 3D0AA4D63A52B151D025D38A267B37DDBCE45D8E; its private key was discarded when it was made) goes into LocalMachine\My, the Personal store, which grants no trust. The revert removes it. The setup first removes any copy a failed run left behind.
windows:
  setup: |
    Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath 'Cert:\LocalMachine\My\3D0AA4D63A52B151D025D38A267B37DDBCE45D8E'
    [IO.File]::WriteAllBytes('C:\Windows\Temp\imas-uat-@NONCE@.cer', [Convert]::FromBase64String(''))
  recipe: |
    steps:
      uat pki cert_present:
        win_pki.cert_present:
          - name: 'imas-uat'
          - path: 'C:\Windows\Temp\imas-uat-@NONCE@.cer'
          - thumbprint: '3D0AA4D63A52B151D025D38A267B37DDBCE45D8E'
          - store_location: 'LocalMachine'
          - store_name: 'My'
  check: |
    if (Test-Path -LiteralPath 'Cert:\LocalMachine\My\3D0AA4D63A52B151D025D38A267B37DDBCE45D8E') { exit 0 }
    exit 1
  revert: |
    Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath 'Cert:\LocalMachine\My\3D0AA4D63A52B151D025D38A267B37DDBCE45D8E', 'C:\Windows\Temp\imas-uat-@NONCE@.cer'
    exit 0
