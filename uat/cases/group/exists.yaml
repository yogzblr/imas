id: I.group.exists
title: 'assert a local group exists (no change)'
os: [ubuntu, alma, windows]
changes: false
pre_check: present
linux:
  setup: |
    groupadd iug@NONCE@
  recipe: |
    steps:
      uat group exists:
        group.exists:
          - name: 'iug@NONCE@'
  check: |
    getent group iug@NONCE@ >/dev/null
  revert: |
    groupdel iug@NONCE@ 2>/dev/null; true
windows:
  setup: |
    net localgroup iug@NONCE@ /add
    exit $LASTEXITCODE
  recipe: |
    steps:
      uat group exists:
        group.exists:
          - name: 'iug@NONCE@'
  check: |
    net localgroup iug@NONCE@ > $null 2>&1
    exit $LASTEXITCODE
  revert: |
    net localgroup iug@NONCE@ /delete > $null 2>&1
    exit 0
