id: I.file.missing
title: 'assert a file is missing (no change)'
os: [ubuntu, alma, windows]
changes: false
pre_check: present
notes: |
  An assertion method: it fails when the file exists and changes nothing. The check passes before and after.
linux:
  recipe: |
    steps:
      uat file missing:
        file.missing:
          - name: '/var/tmp/imas-uat-@NONCE@.txt'
  check: |
    [ ! -e /var/tmp/imas-uat-@NONCE@.txt ]
windows:
  recipe: |
    steps:
      uat file missing:
        file.missing:
          - name: 'C:\Windows\Temp\imas-uat-@NONCE@.txt'
  check: |
    if (Test-Path -LiteralPath 'C:\Windows\Temp\imas-uat-@NONCE@.txt') { exit 1 }
    exit 0
