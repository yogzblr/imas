id: I.service.restarted
title: 'restart a running service'
os: [ubuntu, alma, windows]
idempotent: false
notes: |
  A throwaway unit the setup writes under /usr/local/lib/systemd/system (so masking, which writes /etc/systemd/system, doesn't collide with it) running sleep; the revert removes it. A restart happens on every run by design (idempotent: false); the check sees a new invocation (Linux) or process (Windows). Start type cases use a throwaway service the setup registers with sc.exe (never started); state cases use the first of seclogon, WerSvc and wuauserv that exists and isn't disabled (Server Core has no Print Spooler; for restarted it must also run in a process of its own), chosen by the setup (`@SETUP_SERVICE@`), whose start type and state the setup records and the revert restores; with none of them the case is a skip.
linux:
  setup: |
    mkdir -p /usr/local/lib/systemd/system
    printf '[Unit]\nDescription=imas UAT throwaway service\n[Service]\nType=simple\nExecStart=/bin/sleep infinity\nExecReload=/bin/touch /var/tmp/imas-uat-@NONCE@.reloaded\n[Install]\nWantedBy=multi-user.target\n' > /usr/local/lib/systemd/system/imas-uat-@NONCE@.service
    systemctl daemon-reload
    systemctl start imas-uat-@NONCE@.service
    systemctl show -p InvocationID --value imas-uat-@NONCE@.service > /var/tmp/imas-uat-@NONCE@.inv
  recipe: |
    steps:
      uat service restarted:
        service.restarted:
          - name: 'imas-uat-@NONCE@.service'
  check: |
    systemctl is-active --quiet imas-uat-@NONCE@.service && [ "$(systemctl show -p InvocationID --value imas-uat-@NONCE@.service)" != "$(cat /var/tmp/imas-uat-@NONCE@.inv)" ]
  revert: |
    systemctl stop imas-uat-@NONCE@.service 2>/dev/null
    systemctl unmask imas-uat-@NONCE@.service 2>/dev/null
    systemctl disable imas-uat-@NONCE@.service 2>/dev/null
    rm -f /usr/local/lib/systemd/system/imas-uat-@NONCE@.service /var/tmp/imas-uat-@NONCE@.*
    systemctl daemon-reload; true
windows:
  setup: |
    # Server 2022 Core has no Print Spooler (W11): the first of these that
    # exists, isn't disabled and, once started, has its process to itself
    # (a restart shows as a new process id), else a skip. Its start type
    # and state before are recorded for the revert.
    $pick = $null
    foreach ($n in 'seclogon', 'WerSvc', 'wuauserv') {
      $s = Get-CimInstance Win32_Service -Filter "Name='$n'"
      if (-not $s -or $s.StartMode -eq 'Disabled') { continue }
      $before = "$($s.Name) $($s.StartMode) $($s.State)"
      Start-Service -Name $n -ErrorAction SilentlyContinue
      $s = Get-CimInstance Win32_Service -Filter "Name='$n'"
      $shared = @(Get-CimInstance Win32_Service -Filter "ProcessId=$($s.ProcessId)").Count -gt 1
      if ($s.State -eq 'Running' -and -not $shared) { $pick = $s; break }
      if ($before -notlike '* Running') { Stop-Service -Name $n -Force -ErrorAction SilentlyContinue }
    }
    if (-not $pick) { 'IMAS_UAT_SKIP: none of seclogon, WerSvc and wuauserv exists here, is not disabled and runs in a process of its own'; exit 0 }
    $before | Set-Content -LiteralPath 'C:\Windows\Temp\imas-uat-@NONCE@.svc'
    $pick.ProcessId | Set-Content -LiteralPath 'C:\Windows\Temp\imas-uat-@NONCE@.pid'
    'IMAS_UAT_SET SERVICE=' + $pick.Name
  recipe: |
    steps:
      uat service restarted:
        service.restarted:
          - name: '@SETUP_SERVICE@'
  check: |
    $s = Get-CimInstance Win32_Service -Filter "Name='@SETUP_SERVICE@'"
    if ($s.State -eq 'Running' -and "$($s.ProcessId)" -ne (Get-Content -LiteralPath 'C:\Windows\Temp\imas-uat-@NONCE@.pid')) { exit 0 }
    exit 1
  revert: |
    $p = 'C:\Windows\Temp\imas-uat-@NONCE@.svc'
    if (Test-Path -LiteralPath $p) {
      $name, $mode, $state = (Get-Content -LiteralPath $p).Split(' ')
      $t = @{ Auto = 'Automatic'; Manual = 'Manual'; Disabled = 'Disabled' }[$mode]
      if ($t) { Set-Service -Name $name -StartupType $t }
      if ($state -eq 'Running') { Start-Service -Name $name } else { Stop-Service -Name $name -Force }
      Remove-Item -Force -LiteralPath $p
    }
    Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath 'C:\Windows\Temp\imas-uat-@NONCE@.pid'
