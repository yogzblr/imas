id: I.service.unmasked
title: 'unmask a service'
os: [ubuntu, alma, windows]
notes: |
  A throwaway unit the setup writes under /usr/local/lib/systemd/system (so masking, which writes /etc/systemd/system, doesn't collide with it) running sleep; the revert removes it. On Windows unmasked restores start type Manual. Start type cases use a throwaway service the setup registers with sc.exe (never started); state cases use the Print Spooler, whose start type and state the setup records and the revert restores.
linux:
  setup: |
    mkdir -p /usr/local/lib/systemd/system
    printf '[Unit]\nDescription=imas UAT throwaway service\n[Service]\nType=simple\nExecStart=/bin/sleep infinity\nExecReload=/bin/touch /var/tmp/imas-uat-@NONCE@.reloaded\n[Install]\nWantedBy=multi-user.target\n' > /usr/local/lib/systemd/system/imas-uat-@NONCE@.service
    systemctl daemon-reload
    systemctl mask imas-uat-@NONCE@.service
  recipe: |
    steps:
      uat service unmasked:
        service.unmasked:
          - name: 'imas-uat-@NONCE@.service'
  check: |
    [ "$(systemctl is-enabled imas-uat-@NONCE@.service 2>/dev/null)" != masked ]
  revert: |
    systemctl stop imas-uat-@NONCE@.service 2>/dev/null
    systemctl unmask imas-uat-@NONCE@.service 2>/dev/null
    systemctl disable imas-uat-@NONCE@.service 2>/dev/null
    rm -f /usr/local/lib/systemd/system/imas-uat-@NONCE@.service /var/tmp/imas-uat-@NONCE@.*
    systemctl daemon-reload; true
windows:
  setup: |
    sc.exe create imasuat@NONCE@ binPath= C:\Windows\System32\cmd.exe start= demand DisplayName= imas-uat-throwaway | Out-Null
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    sc.exe config imasuat@NONCE@ start= disabled | Out-Null
    exit $LASTEXITCODE
  recipe: |
    steps:
      uat service unmasked:
        service.unmasked:
          - name: 'imasuat@NONCE@'
  check: |
    if ((Get-Service -Name imasuat@NONCE@).StartType -eq 'Manual') { exit 0 }
    exit 1
  revert: |
    sc.exe delete imasuat@NONCE@ | Out-Null
    exit 0
