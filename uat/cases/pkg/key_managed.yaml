id: I.pkg.key_managed
title: 'import a repository signing key that no repository uses'
os: [ubuntu, alma]
needs: [internet]
timeout: 15m
skip_os:
  windows: |
    pkg uses snack, whose only Windows manager is winget; Windows Server 2022 Core doesn't ship winget (App Installer), so every pkg method can only fail there. A Desktop Experience or Server 2025 image would be needed (owner decision).
notes: |
  Imports Docker's public package signing key, which no repository on the sprout refers to, so it changes what nothing verifies. On Ubuntu it lands in /etc/apt/keyrings/gpg.gpg (the setup refuses to run if that file exists, so the revert can't remove a key someone else put there); on AlmaLinux in the rpm keyring.
ubuntu:
  setup: |
    [ ! -e /etc/apt/keyrings/gpg.gpg ] || { echo '/etc/apt/keyrings/gpg.gpg exists already'; exit 1; }
  recipe: |
    steps:
      uat pkg key_managed:
        pkg.key_managed:
          - name: 'https://download.docker.com/linux/ubuntu/gpg'
  check: |
    [ -s /etc/apt/keyrings/gpg.gpg ]
  revert: |
    rm -f /etc/apt/keyrings/gpg.gpg
alma:
  setup: |
    ! rpm -q gpg-pubkey --qf '%{SUMMARY}\n' | grep -qi docker || { echo 'a Docker key is imported already'; exit 1; }
  recipe: |
    steps:
      uat pkg key_managed:
        pkg.key_managed:
          - name: 'https://download.docker.com/linux/ubuntu/gpg'
  check: |
    rpm -q gpg-pubkey --qf '%{SUMMARY}\n' | grep -qi docker
  revert: |
    for k in $(rpm -q gpg-pubkey --qf '%{NAME}-%{VERSION}-%{RELEASE} %{SUMMARY}\n' | grep -i docker | cut -d' ' -f1); do rpm -e "$k"; done; true
