id: I.win_dacl.ace_present
title: 'win_dacl ace_present'
skip: |
  Finding, from the code: internal/ingredients/windacl registers win_dacl, but cmd/sprout doesn't import it (it is missing from cmd/sprout/include_windows.go), so no sprout registers win_dacl and a recipe naming it fails with "unknown ingredient" on every sprout. tools/gendocs still documents it.
