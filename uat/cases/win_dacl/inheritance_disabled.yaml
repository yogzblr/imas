id: I.win_dacl.inheritance_disabled
title: 'stop a temp file inheriting permissions'
os: [windows]
notes: |
  A throwaway file @NONCE@ in C:\Windows\Temp, which inherits from its folder when created; the revert deletes it. copy_inherited is left at its default (true), so the effective permissions don't change.
windows:
  setup: |
    Set-Content -LiteralPath 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt' -Value 'imas uat @NONCE@'
  recipe: |
    steps:
      uat win_dacl inheritance disabled:
        win_dacl.inheritance_disabled:
          - name: 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt'
          - object_type: 'file'
  check: |
    if ((Get-Acl -LiteralPath 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt').AreAccessRulesProtected) { exit 0 }
    exit 1
  revert: |
    Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt'
    exit 0
