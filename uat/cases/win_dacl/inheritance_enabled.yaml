id: I.win_dacl.inheritance_enabled
title: 'let a temp file inherit permissions again'
os: [windows]
notes: |
  A throwaway file @NONCE@ in C:\Windows\Temp; the revert deletes it. The setup turns inheritance off with icacls (/inheritance:d keeps the inherited ACEs as explicit ones), so the recipe has a change to make.
windows:
  setup: |
    Set-Content -LiteralPath 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt' -Value 'imas uat @NONCE@'
    icacls 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt' /inheritance:d | Out-Null
    if ($LASTEXITCODE -ne 0) { exit 1 }
  recipe: |
    steps:
      uat win_dacl inheritance enabled:
        win_dacl.inheritance_enabled:
          - name: 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt'
          - object_type: 'file'
  check: |
    if (-not (Get-Acl -LiteralPath 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt').AreAccessRulesProtected) { exit 0 }
    exit 1
  revert: |
    Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath 'C:\Windows\Temp\imas-uat-dacl-@NONCE@.txt'
    exit 0
