id: I.network.link
title: 'bring a dummy interface up'
os: [ubuntu, alma]
notes: |
  Never touches the sprout's own connection: everything happens on a dummy interface the setup creates (iu<nonce>), with TEST-NET addresses (198.51.100.0/24, 203.0.113.0/24, RFC 5737) that route nowhere. The connectivity guard stays at its default (on). The revert deletes the interface, which takes its addresses and routes with it.
linux:
  setup: |
    ip link add iu@NONCE@ type dummy
  recipe: |
    steps:
      uat network link:
        network.link:
          - name: 'iu@NONCE@'
          - state: 'up'
  check: |
    ip -o link show dev iu@NONCE@ | grep -q '<[^>]*UP[,>]'
  revert: |
    ip link del iu@NONCE@ 2>/dev/null; true
