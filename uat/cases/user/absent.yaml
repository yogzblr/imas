id: I.user.absent
title: 'delete a local user'
os: [ubuntu, alma, windows]
linux:
  setup: |
    useradd -M iuu@NONCE@
  recipe: |
    steps:
      uat user absent:
        user.absent:
          - name: 'iuu@NONCE@'
  check: |
    ! getent passwd iuu@NONCE@ >/dev/null
  revert: |
    userdel -r iuu@NONCE@ 2>/dev/null; userdel iuu@NONCE@ 2>/dev/null; true
windows:
  setup: |
    net user iuu@NONCE@ 'Uat-@NONCE@-Pw1!' /add
    exit $LASTEXITCODE
  recipe: |
    steps:
      uat user absent:
        user.absent:
          - name: 'iuu@NONCE@'
  check: |
    net user iuu@NONCE@ > $null 2>&1
    if ($LASTEXITCODE -eq 0) { exit 1 }
    exit 0
  revert: |
    net user iuu@NONCE@ /delete > $null 2>&1
    exit 0
