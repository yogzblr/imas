id: I.user.exists
title: 'assert a local user exists (no change)'
os: [ubuntu, alma, windows]
changes: false
pre_check: present
linux:
  setup: |
    useradd -M iuu@NONCE@
  recipe: |
    steps:
      uat user exists:
        user.exists:
          - name: 'iuu@NONCE@'
  check: |
    getent passwd iuu@NONCE@ >/dev/null
  revert: |
    userdel -r iuu@NONCE@ 2>/dev/null; userdel iuu@NONCE@ 2>/dev/null; true
windows:
  setup: |
    # New-LocalUser with a SecureString (W11): net.exe's "user /add" with a
    # password over 14 characters asks for confirmation and exits -1 when
    # nobody answers. A random password, never printed.
    $ErrorActionPreference = 'Stop'
    $b = New-Object byte[] 18
    [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
    $pw = ConvertTo-SecureString -String ('Aa1!' + [Convert]::ToBase64String($b)) -AsPlainText -Force
    New-LocalUser -Name 'iuu@NONCE@' -Password $pw -AccountNeverExpires -ErrorAction Stop | Out-Null
  recipe: |
    steps:
      uat user exists:
        user.exists:
          - name: 'iuu@NONCE@'
  check: |
    if (Get-LocalUser -Name 'iuu@NONCE@' -ErrorAction SilentlyContinue) { exit 0 }
    exit 1
  revert: |
    Remove-LocalUser -Name 'iuu@NONCE@' -ErrorAction SilentlyContinue
    exit 0
