---
# A cut-down stand-in for local-path-provisioner's manifest, served by the
# test's curl stub. Only the helper image line matters to bootstrap.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: docker.io/library/busybox
