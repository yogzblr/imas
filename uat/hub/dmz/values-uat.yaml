# UAT values for deploy/helm/nats on the uat-dmz hub (UAT.3a).
#
# Static half: everything that is the same on every run. install.sh writes
# the run-specific half (values-run.yaml: the farmerbus image tag, the
# farmer upstream on the core private IP, the NetworkPolicy egress to it;
# values-accounts.yaml: the accounts bucket endpoint and the bus egress to
# it) from the endpoints file and passes all three, this file first.
#
# Layout (docs/claude-code-parallel-build-plan.md, section 4h): one
# single-node k0s cluster on a Standard_D2s_v5 (2 vCPU, 8 GiB) holding
# farmerbus and Envoy only. Core (farmer, saasapi) is another cluster, so
# every core peer is an IP address, never a Service or a pod selector.
# README.md in this directory lists what is assumed about the core side.

# Fixed names, so the core side and the scripts can rely on them:
#   bus client Service  imas-dmz-nats-bus   (farmer chart: bus.serviceName)
#   Envoy Deployment    imas-dmz-nats-envoy
# The release and namespace are both imas-dmz (lib.sh), as in
# deploy/helm/farmer's TestContractWithNatsChart.
---
fullnameOverride: imas-dmz-nats

commonLabels:
  imas.io/purpose: imas-uat

# No seeds (P21 slice 1): the operator, operator-signing, SYS account and
# tenant keys are OpenBao Transit keys on core, and a single-node bus needs
# no fence user (BUS_FENCE_USER is for bus.replicaCount > 1). The bus
# starts from the public trust ConfigMap imas-nats-trust, which install.sh
# copies from core (natsTrust.configMapName, the chart default). natsSeeds
# stays empty: the only seed in the DMZ is the loader's SYS user seed
# (loader.sysUserSecret), which install.sh --loader-seed puts in its own
# Secret.
natsSeeds:
  seeds: {}
natsTrust:
  configMapName: imas-nats-trust

bus:
  # Bus settings deploy/helm/farmer expects (its TestContractWithNatsChart):
  # organization equals the farmer chart's organization; the client port
  # equals its bus.port (farmer and saasapi dial tls://...:5406).
  organization: imas
  replicaCount: 1
  logLevel: info
  ports:
    client: 5406
    websocket: 5407
    health: 8080
  # Six sprouts plus core's connections. Sized with resources below.
  maxConnections: 1024
  tls:
    # A cert-manager Certificate issued by the UAT ClusterIssuer
    # (install.sh), with tls.crt, tls.key and the UAT CA as ca.crt.
    mode: secret
    secretName: imas-farmerbus-tls
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    # Kept ClusterIP. Core reaches the bus through install.sh's own
    # NodePort Service, node port 8442 (README.md, "Exposure").
    type: ClusterIP

# The accounts bucket on the core hub's RustFS (uat/hub/core/rustfs-setup.sh
# creates it and the read-only credential). The endpoint and the egress
# rule are run-specific (values-accounts.yaml). Plain HTTP, as core's own
# RustFS clients use. No PVC: the bus pod's loader sidecar rebuilds the
# resolver from this bucket at every start.
accountStore:
  useSSL: false
  bucket: imas-accounts
  # install.sh creates both Secrets (--accounts-reader-dir, --loader-seed).
  credentialsSecret: imas-bus-accounts-reader
loader:
  sysUserSecret: imas-bus-loader-sys-user

envoy:
  enabled: true
  # The chart's envoyproxy/envoy:v1.35.3, pinned by digest (P13): the image
  # index on Docker Hub, read 2026-10-13; the core edge (uat/hub/core
  # chart/values.yaml edge.image) runs the same one.
  image:
    digest: >-
      sha256:4d496918618a7ebd6c71ae8285e31ebff092f3a0a5ad642d50decf4a54eb2456
  replicaCount: 1
  logLevel: info
  listenerPort: 8443
  tls:
    # The DMZ edge certificate: a cert-manager Certificate for the DMZ FQDN
    # issued by the UAT ClusterIssuer (install.sh). Sprouts pin the UAT CA
    # (sproutrootca, sproutrootcatofu false).
    secretName: imas-envoy-dmz-tls
  jwtAuthn:
    issuer: imas-gateway
    jwks:
      source: remote
      remote:
        # farmer_api: https://<core private IP>:<farmer API port>
        # /v1/.well-known/jwks.json
        cluster: farmer_api
        cacheDuration: 300s
        asyncFetch:
          enabled: true
          # The listener opens once the first fetch has finished, whether
          # it succeeded or not, so Envoy becomes Ready before core exists.
          fastListener: false
  upstreams:
    # host and port come from the endpoints file (values-run.yaml).
    natsWebsocket:
      host: ""
      port: ""
  # Off, as in deploy/envoy/envoy.yaml: farmer's API certificate comes from
  # core's own PKI, which this side does not know (README.md, open
  # questions).
  upstreamTLS:
    caSecretName: ""
    caConfigMapName: ""
  # A six-sprout fleet behind one Envoy: 1 token per second, 300 burst.
  # gatewayJwtTtlSeconds must equal farmer's gatewayjwtttl (default 24h).
  refreshRateLimit:
    fleetSize: 100
    gatewayJwtTtlSeconds: 86400
    envoyReplicas: null
    headroom: 2
    fillIntervalSeconds: 1
    burstSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    # The chart's own Service stays in-cluster. install.sh exposes Envoy
    # with a Service of its own: NodePort 8443 (the owner's decision) or a
    # LoadBalancer (README.md, "Exposure").
    type: ClusterIP
    port: 443

networkPolicy:
  enabled: true
  # Core runs in another cluster, so these selectors match nothing here.
  # install.sh adds ipBlock rules for the core private IP instead:
  # envoyExtraEgress (values-run.yaml) and an extra bus ingress policy.
  core:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: imas-core
    podSelector:
      matchLabels:
        app.kubernetes.io/name: farmer
  # Anyone may reach the listener port; the NSG limits who gets that far
  # (sprouts and the runner, section 4h).
  envoyIngress:
    from: []
