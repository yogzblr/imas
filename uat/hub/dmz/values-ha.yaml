# deploy/helm/nats values for the HA DMZ hub (P24, brief
# H-azure-next-runs.md H4). An overlay: install.sh passes it after
# values-uat.yaml when the DMZ hub has more than one node (the endpoints
# file's dmz.nodes; the workflow input hub_nodes 3), and before the
# run-specific values. The single-node run never reads it.
#
# Three DMZ nodes (uat/k0s, etcd), each running one bus node and one Envoy:
#   - the bus: a three-node NATS cluster (routes over mutual TLS with the bus
#     certificate, which install.sh issues for every pod's headless name),
#     spread one per node, a PodDisruptionBudget. No volume: each node's
#     resolver directory is the chart's emptyDir, rebuilt by its loader from
#     the accounts bucket at every start (deploy/helm/nats README.md,
#     "Clustering"). A clustered node only serves while it routes to a
#     majority, so one node down leaves two serving.
#   - Envoy: three replicas, spread one per node, a PodDisruptionBudget. The
#     enrol rate limit is per Envoy (20 per 60 s), so the hub's is three
#     times that; check.sh's burst follows the node count.
# The DMZ's node ports (Envoy 8443, the bus 8442, externalTrafficPolicy
# Local) then answer on every node, behind the internal and public load
# balancers uat/tofu puts in front of an HA hub.
---
# A clustered bus's fence user (cmd/farmerbus fence.go): its seed in Secret
# imas-bus-fence-user, which install.sh --fence-seed makes from the core
# hub's seeds.sh file; its JWT, bus-fence-user.jwt, is in the trust the core
# bootstrap Job minted from natsTrust.busFenceUserPub. The bus's only seed.
natsSeeds:
  secretName: imas-bus-fence-user
  seeds:
    BUS_FENCE_USER: bus-fence-user.nk

bus:
  replicaCount: 3
  cluster:
    auth:
      # The route password, generated by install.sh once (64 hex
      # characters), never leaving the DMZ cluster.
      secretName: imas-bus-route-auth
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/instance: imas-dmz
          app.kubernetes.io/component: bus
  pdb:
    enabled: true
    maxUnavailable: 1

envoy:
  replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/instance: imas-dmz
          app.kubernetes.io/component: envoy
      # Count this revision's pods only, so a rolling update can place its
      # new pod next to the old ones.
      matchLabelKeys: [pod-template-hash]
  pdb:
    enabled: true
    maxUnavailable: 1
