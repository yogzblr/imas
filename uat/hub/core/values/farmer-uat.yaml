# deploy/helm/farmer values for the UAT core hub (UAT.3b). UAT ONLY.
# FLAG FOR SECURITY REVIEW: OpenBao runs initialised and unsealed by
# uat/hub/core/openbao-bootstrap.sh, whose unseal keys are kept in a
# Kubernetes Secret and a run artifact. Never copy this to production.
#
# This file is the layout; install.sh adds a second, run-specific values
# file (gen-values.sh: the DMZ address, the Keycloak issuer on the core
# FQDN, the bootstrap admin's public keys and the image tags), and
# core_test.go renders the chart with both. Names here must match
# lib/common.sh (core_test.go checks that too).
#
# Release imas-core in namespace imas-core: farmer is imas-core-farmer,
# saasapi imas-core-farmer-saasapi, OpenBao imas-core-openbao.

organization: imas

# The DMZ bus is on the other cluster. farmer and saasapi dial
# tls://<bus.host>:8442, where bus.host is the DMZ's private name
# (dmz.uat.imas.internal by default, UAT.1's Private DNS zone), and 8442 is
# the DMZ's bus node port (owner decisions 2026-10-06). The bus certificate
# (uat/hub/dmz) carries that name as a SAN, and it is the name both verify.
# gen-values.sh sets host, port, egressCIDRs (the DMZ private address, which
# NetworkPolicy can't take as a name) and sproutBusURLs from the endpoints
# file; the name is never written here.
bus:
  port: 8442

# The two user seeds seeds.sh makes (SYS_USER, SAASAPI_USER: the chart's
# default natsSeeds.seeds). The operator, operator-signing, SYS account and
# tenant keys are OpenBao Transit keys (P21 slice 1): the bootstrap Job
# creates the platform ones and writes the public trust to natsTrust's
# ConfigMap, which uat/hub/dmz/install.sh copies to the DMZ bus.
natsSeeds:
  secretName: imas-farmer-nats-seeds

# natsTrust.busLoaderUserPub (the DMZ bus loader's SYS user, whose seed
# seeds.sh makes as bus-loader-user.nk) is run-specific: gen-values.sh sets
# it from seeds.sh's public key file, so the bootstrap Job also mints
# bus-loader-user.jwt into the trust ConfigMap the DMZ copies.
natsTrust:
  configMapName: imas-nats-trust

# farmer's API certificate and the root it verifies the bus with come from
# the per-run UAT CA (cert-manager), the same CA the DMZ's bus and Envoy
# use. OpenBao PKI would give farmer a root the bus doesn't chain to.
# saasapi's bus CA (bus.ca empty) is this Secret's ca.crt.
tls:
  mode: secret
  secretName: imas-farmer-tls

# OpenBao: the subchart, standalone (not dev mode), one replica, single-node
# raft storage on the data PVC. OpenBao 2.7.1 has no "file" storage
# backend, so the subchart's default standalone config (storage "file")
# does not start; this one replaces it. node_id is fixed, and api_addr and
# cluster_addr are the pod's Service addresses: the client Service
# imas-core-openbao and, for the cluster port, the pod's name on the
# headless Service imas-core-openbao-internal (release imas-core in
# namespace imas-core, lib/common.sh). The subchart also exports
# BAO_API_ADDR and BAO_CLUSTER_ADDR, which win over the config file, so
# server.ha.apiAddr and server.ha.clusterAddr carry the same two addresses
# (the subchart reads them in standalone mode too); core_test.go checks
# they agree. Initialised and unsealed by openbao-bootstrap.sh while
# `helm install` runs; the chart's bootstrap Job waits for it to be
# unsealed (`until bao status`) and then uses the root token from
# openbaoBootstrap.tokenSecretName.
openbao:
  enabled: true
  injector:
    enabled: false
  server:
    dev:
      enabled: false
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path    = "/openbao/data"
          node_id = "imas-core-openbao-0"
        }

        api_addr     = "http://imas-core-openbao.imas-core.svc:8200"
        cluster_addr = "https://imas-core-openbao-0.imas-core-openbao-internal.imas-core.svc:8201"
    ha:
      enabled: false
      apiAddr: http://imas-core-openbao.imas-core.svc:8200
      clusterAddr: https://imas-core-openbao-0.imas-core-openbao-internal.imas-core.svc:8201
    dataStorage:
      enabled: true
      size: 1Gi
    authDelegator:
      enabled: true
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

# The token Secret holds a one-hour root-policy token openbao-bootstrap.sh
# mints for each run, never the root token: the Job revokes it when done
# (revokeToken, the chart default; owner decision a), and install.sh then
# deletes the Secret. check.sh confirms both (design T4).
openbaoBootstrap:
  enabled: true
  tokenSecretName: imas-uat-openbao-root
  tokenSecretKey: token

# PXC: one node, one HAProxy (the chart's eval sizing).
pxc:
  enabled: true
  pxc:
    size: 1
    persistence:
      size: 8Gi
  haproxy:
    enabled: true
    size: 1

# Valkey: standalone, one replica. The production path (unit S5): a
# password (auth on, the chart default, said here so the UAT can't drift
# from it), generated by the chart's OpenBao bootstrap Job and delivered as
# Secret imas-valkey-auth by saasapi-secrets.sh (no ESO here), and
# maxmemory-policy noeviction (the chart's valkey.valkeyConfig).
valkey:
  enabled: true
  auth:
    enabled: true

# RustFS (Apache-2.0) in namespace imas-uat. Plain HTTP inside the cluster.
# endpoint and useSSL are overridden per run by gen-values.sh from the
# endpoints file's object_store (README.md, "External S3"). Three buckets,
# all different: recipes, job logs, and the private sprout User JWT bucket
# (IMAS_S3_SPROUT_JWT_BUCKET; the chart has no default name, and enrolment
# fails without it). rustfs-setup.sh creates all three. The accounts bucket
# is the chart's accountStore default (imas-accounts), with its own writer
# credential (accountStore.credentialsSecret, also from rustfs-setup.sh).
objectStore:
  endpoint: imas-uat-rustfs.imas-uat.svc.cluster.local:9000
  useSSL: false
  bucket: imas-recipes
  jobBucket: imas-jobs
  sproutJWTBucket: imas-sprout-jwts
  credentialsSecret: imas-uat-s3-farmer
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

# farmer is stateless (no PVC): its NKey comes from Secret imas-farmer-nkey,
# key farmer.nk (the chart's farmer.nkeySecret defaults), which seeds.sh
# creates.
farmer:
  bootstrapAdmin:
    # pubkey and boxpub come from gen-values.sh (imas auth pubkey and
    # imas auth keygen of this release, run by admin-keys.sh).
    username: uat-admin
  # IMAS_SELF_UPDATE_ENABLED. Off here; gen-values.sh turns it on, with
  # saasapi.fleetUpdateDispatch.enabled, when the workflow input
  # dispatch_flags is true (IMAS_UAT_DISPATCH_FLAGS=on). UAT only: both stay
  # off anywhere else until the security review.
  selfUpdate:
    enabled: false

saasapi:
  enabled: true
  replicaCount: 2
  # saasapi.jwt.* come from gen-values.sh: issuer and JWKS URL on the core
  # FQDN, audience imas-saasapi (the Keycloak client the realm defines).
  internalAuthSecret:
    secretName: imas-saasapi-internal-auth
    currentKey: current
  # SAASAPI_FLEET_UPDATE_DISPATCH_ENABLED: set by gen-values.sh with
  # farmer.selfUpdate.enabled (above), from dispatch_flags.
  fleetUpdateDispatch:
    enabled: false
  # The operator plane (P20 option C): the listener the sprout release hook
  # Job registers the release on, so finish.sh's
  # `helm upgrade --set sproutRelease.register=true` really registers it.
  # tls: a cert-manager Certificate from the UAT CA (chart/
  # templates/certificates.yaml) for the operator Service's FQDN, whose
  # ca.crt the hook Job verifies the listener with. token: a random token
  # saasapi-secrets.sh generates, in a Secret of its own (key current); the
  # copy in <state>/core/sensitive/saasapi-operator-token is what finish.sh
  # and operator-release.sh present. FLAG FOR SECURITY REVIEW.
  operator:
    enabled: true
    tls:
      secretName: imas-saasapi-operator-tls
    token:
      secretName: imas-saasapi-operator-token
      currentKey: current
  recipes:
    enabled: true
    # saasapi's own RustFS user, limited by the release's
    # files/objectstore-policies/saasapi-recipes.json (rustfs-setup.sh).
    credentialsSecret: imas-uat-s3-saasapi
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
    credentialCheck: true
    # The realm roles in uat/hub/core/chart/files/imas-uat-realm.json.
    readRole: imas-recipes-read
    writeRole: imas-recipes-write
  # saasapi fetches Keycloak's JWKS from the core FQDN, served by the edge
  # proxy with a certificate from the UAT CA. Go reads SSL_CERT_FILE, so
  # the UAT CA (a public certificate, in a ConfigMap) replaces the system
  # roots for saasapi's HTTPS clients. Its bus CA is separate
  # (SAASAPI_NATS_CA_FILE) and its other connections are not HTTPS.
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/imas-uat-ca/ca.crt
  extraVolumes:
    - name: uat-ca
      configMap:
        name: imas-uat-ca
  extraVolumeMounts:
    - name: uat-ca
      mountPath: /etc/imas-uat-ca
      readOnly: true

networkPolicy:
  enabled: true
