{{- include "uat.validate" . -}}
{{- if .Values.minio.enabled }}
# RustFS: the UAT object store (Apache-2.0). One pod, one PVC, root
# credential from a Secret install.sh generates. Buckets, users and
# policies are made by minio-setup.sh with the curl inside this image,
# through RustFS's admin API. The resource names keep the "minio" spelling
# (imas-uat-minio, values key "minio") so nothing that names them changes.
# The volume has its own name (imas-uat-rustfs-data): a volume MinIO wrote
# (uid 1000) is not writable by RustFS (uid 10001), so it must not be reused.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imas-uat-rustfs-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
    app.kubernetes.io/name: imas-uat-minio
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.minio.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imas-uat-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
    app.kubernetes.io/name: imas-uat-minio
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: imas-uat-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imas-uat-minio
        imas.io/uat-only: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rustfs
          image: {{ .Values.minio.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.minio.rootSecret }}, key: user } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.minio.rootSecret }}, key: password } }
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /logs
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: s3 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: s3 }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: logs, mountPath: /logs }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: imas-uat-rustfs-data
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: logs
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: imas-uat-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
    app.kubernetes.io/name: imas-uat-minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imas-uat-minio
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
{{- end }}
