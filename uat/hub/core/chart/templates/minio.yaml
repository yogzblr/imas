{{- include "uat.validate" . -}}
# MinIO: the UAT-only object store (AGPL-3.0; test only, never shipped,
# never a dependency of a released artifact). One pod, one PVC, root
# credential from a Secret install.sh generates. Buckets, users and
# policies are made by minio-setup.sh with the mc inside this image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imas-uat-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
    app.kubernetes.io/name: imas-uat-minio
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.minio.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imas-uat-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
    app.kubernetes.io/name: imas-uat-minio
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: imas-uat-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imas-uat-minio
        imas.io/uat-only: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["minio"]
          args: ["server", "/data", "--address", ":9000", "--console-address", "127.0.0.1:9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.minio.rootSecret }}, key: user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.minio.rootSecret }}, key: password } }
            - name: MINIO_BROWSER
              value: "off"
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: imas-uat-minio
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: imas-uat-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
    app.kubernetes.io/name: imas-uat-minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: imas-uat-minio
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
