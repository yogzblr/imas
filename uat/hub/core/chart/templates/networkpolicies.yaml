{{- include "uat.validate" . -}}
{{- $farmerNS := dict "kubernetes.io/metadata.name" .Values.farmer.namespace -}}
{{- $uatNS := dict "kubernetes.io/metadata.name" .Release.Namespace -}}
# Additive to deploy/helm/farmer's own policies (NetworkPolicies are
# additive). The chart admits the DMZ by pod and namespace selectors,
# which can't match pods on another cluster, so the cross-cluster paths
# are opened here by address, and nothing wider:
#   - farmer: in from the edge proxy on its API port (the DMZ's Envoy
#     reaches the edge on the core private address); out to the DMZ private
#     address on the bus port.
#   - saasapi: out to the DMZ private address on the bus port.
#   - the edge: in on 443 from anywhere (the NSG limits it to the runner),
#     in on farmer's API port from the DMZ's nodes only; with
#     versity.enabled, in on the accounts store port from the DMZ's nodes
#     only and out to Versity Gateway's S3 port.
#   - Keycloak: in from the edge only. RustFS: in from farmer and
#     saasapi, and from the DMZ's nodes on its hostPort, for the bus's
#     account loader (read-only, accounts bucket only; design D22). That
#     and farmer's API are the only DMZ-to-core paths.
# The DMZ's private address (dmz.privateIP: its node's, or its internal load
# balancer's on an HA hub) is where traffic to the DMZ goes; the DMZ's
# traffic arrives from its nodes' addresses (dmz.nodeIPs). On an HA core hub
# (loadBalancerProbe.enabled) the Azure health probes are admitted on the
# load-balanced ports too (uat.dmzPeers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imas-uat-farmer-cross-cluster
  namespace: {{ .Values.farmer.namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.farmer.name }}
      app.kubernetes.io/instance: {{ .Values.farmer.release }}
      app.kubernetes.io/component: farmer
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: {{ toJson $uatNS }} }
          podSelector: { matchLabels: { app.kubernetes.io/name: imas-uat-edge } }
      ports:
        - { protocol: TCP, port: {{ .Values.farmer.apiPort }} }
  egress:
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" .Values.dmz.privateIP }} }
      ports:
        - { protocol: TCP, port: {{ .Values.bus.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imas-uat-saasapi-cross-cluster
  namespace: {{ .Values.farmer.namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.farmer.name }}
      app.kubernetes.io/instance: {{ .Values.farmer.release }}
      app.kubernetes.io/component: saasapi
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: { cidr: {{ printf "%s/32" .Values.dmz.privateIP }} }
      ports:
        - { protocol: TCP, port: {{ .Values.bus.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imas-uat-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: imas-uat-edge
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - { protocol: TCP, port: 443 }
    - from:
        {{- include "uat.dmzPeers" . | trim | nindent 8 }}
        {{- range .Values.dmz.extraFarmerAPISources }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.farmer.apiPort }} }
    {{- if .Values.versity.enabled }}
    - from:
        {{- include "uat.dmzPeers" . | trim | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ .Values.core.accountsStorePort }} }
    {{- end }}
  egress:
    - to:
        - namespaceSelector: { matchLabels: {{ toJson $farmerNS }} }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.farmer.name }}
              app.kubernetes.io/instance: {{ .Values.farmer.release }}
              app.kubernetes.io/component: saasapi
      ports:
        - { protocol: TCP, port: {{ .Values.farmer.saasapiPort }} }
    - to:
        - namespaceSelector: { matchLabels: {{ toJson $farmerNS }} }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.farmer.name }}
              app.kubernetes.io/instance: {{ .Values.farmer.release }}
              app.kubernetes.io/component: farmer
      ports:
        - { protocol: TCP, port: {{ .Values.farmer.apiPort }} }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: imas-uat-keycloak } }
      ports:
        - { protocol: TCP, port: 8080 }
    {{- if .Values.versity.enabled }}
    - to:
        - namespaceSelector: { matchLabels: {{ toJson $farmerNS }} }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: imas-versity
              app.kubernetes.io/instance: {{ .Values.farmer.release }}
              app.kubernetes.io/component: versity
      ports:
        - { protocol: TCP, port: {{ .Values.versity.port }} }
    {{- end }}
    {{- include "uat.dnsEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imas-uat-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: imas-uat-keycloak
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: imas-uat-edge } }
      ports:
        - { protocol: TCP, port: 8080 }
{{- if .Values.rustfs.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imas-uat-rustfs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: imas-uat-rustfs
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: {{ toJson $farmerNS }} }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.farmer.name }}
              app.kubernetes.io/instance: {{ .Values.farmer.release }}
      ports:
        - { protocol: TCP, port: 9000 }
    - from:
        {{- include "uat.dmzPeers" . | trim | nindent 8 }}
      ports:
        - { protocol: TCP, port: 9000 }
{{- end }}
