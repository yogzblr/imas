# Values for the UAT-only extras chart. install.sh sets every run-specific
# value with --set; these defaults only make `helm template` render.

# The deploy/helm/farmer release this chart serves.
farmer:
  release: imas-core
  namespace: imas-core
  # app.kubernetes.io/name of farmer's and saasapi's pods (the chart name).
  name: farmer
  # <release>-farmer and <release>-farmer-saasapi, the chart's Services.
  serviceName: imas-core-farmer
  apiPort: 5405
  saasapiServiceName: imas-core-farmer-saasapi
  saasapiServicePort: 80
  saasapiPort: 8081
  # tls.secretName: issued here by cert-manager from the UAT CA.
  tlsSecretName: imas-farmer-tls
  # saasapi's operator plane (saasapi.operator, P20 option C): its Service
  # (<saasapi fullname>-operator) and saasapi.operator.tls.secretName,
  # issued here from the UAT CA. The registration hook Job verifies the
  # listener with this Secret's ca.crt.
  saasapiOperatorServiceName: imas-core-farmer-saasapi-operator
  operatorTLSSecretName: imas-saasapi-operator-tls

clusterDomain: cluster.local

# The core hub, from the endpoints file.
core:
  fqdn: core.uat.invalid
  privateIP: 10.60.2.4
  # The private name (UAT.1's Private DNS zone), on farmer's certificate:
  # the DMZ's Envoy may dial farmer by it.
  privateFQDN: core.uat.imas.internal
  # The edge proxy's hostPorts (owner decision 2026-10-06: hostPorts only;
  # the core node port range is 30000-32767).
  httpsPort: 443
  farmerAPIPort: 5405

# The DMZ hub, from the endpoints file.
dmz:
  privateIP: 10.60.1.4
  # The private name farmer and saasapi reach the bus by (UAT.1's Private
  # DNS zone): farmer's bus.host, set by gen-values.sh from the same value.
  privateFQDN: dmz.uat.imas.internal
  # Extra sources allowed to reach farmer's API through the edge proxy
  # (CIDRs). Empty: the DMZ private IP only.
  extraFarmerAPISources: []

# The DMZ bus is dialled by its private name (dmz.privateFQDN), which the
# farmer chart takes as bus.host (values/farmer-uat.yaml and gen-values.sh);
# no Service stands in for it here. bus.port is the DMZ's node port for the
# bus client port (dmz.ports.bus): 8442 (owner decision, 2026-10-06; the DMZ
# node port range is 8442-8443). The policies below name it.
bus:
  port: 8442

# cert-manager issuer of the per-run UAT CA (UAT.2).
caIssuer:
  kind: ClusterIssuer
  name: imas-uat-ca

rustfs:
  # false: no object store is deployed (object_store.mode external).
  enabled: true
  # RustFS (Apache-2.0), which replaced MinIO (AGPL-3.0). Pinned; never
  # latest. 1.0.1 passed the rig (smoke 10/10, core 58/0/3, 2026-10-09).
  # The digest is the one that pulled on the rig; it wins over the tag.
  image: docker.io/rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
  rootSecret: imas-uat-rustfs-root
  # The node port the DMZ bus's account loader reads the accounts bucket on
  # (<core private IP>:9000, uat/hub/dmz dmz.account_store.endpoint's
  # default; uat/tofu accounts_store_port). A hostPort, as the edge's
  # (owner decision 2026-10-06: the core node port range is 30000-32767).
  hostPort: 9000
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

keycloak:
  # Apache-2.0. Pinned by tag and digest (P13); never latest. Docker Hub's
  # keycloak/keycloak, the project's own mirror of quay.io/keycloak/keycloak,
  # because its digest could be read from the registry: the image index
  # (linux/amd64 and linux/arm64) of 26.4.0, read 2026-10-13.
  image: docker.io/keycloak/keycloak:26.4.0@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd
  realm: imas-uat
  # KC_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD (master realm), generated per run.
  adminSecret: imas-uat-keycloak-admin
  # UAT_TESTS_CLIENT_SECRET and the four user passwords, generated per run,
  # substituted into files/imas-uat-realm.json at import.
  realmEnvSecret: imas-uat-keycloak-realm
  # The embedded H2 database of start-dev (dev-file), on a small PVC so a
  # pod restart keeps the tenant bindings.
  storage: 1Gi
  storageClassName: ""
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1536Mi }

edge:
  # Apache-2.0; the same version as the nats chart's Envoy (docs/INSTALL.md),
  # pinned by digest too (P13): the image index of v1.35.3 on Docker Hub,
  # read 2026-10-13; uat/hub/dmz/values-uat.yaml pins the DMZ's Envoy to it.
  image: envoyproxy/envoy:v1.35.3@sha256:4d496918618a7ebd6c71ae8285e31ebff092f3a0a5ad642d50decf4a54eb2456
  tlsSecretName: imas-uat-edge-tls
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
