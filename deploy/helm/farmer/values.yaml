# imas core chart: cmd/farmer + cmd/saasapi. See README.md.
#
# The defaults are a SELF-CONTAINED EVAL INSTALL: OpenBao (dev mode, in
# memory), a one-node PXC cluster and a standalone Valkey are deployed as
# subcharts. For production, turn each of openbao/pxc/valkey off and point
# openbaoClient, database and valkey.addrs at the real instances
# (ci/external-values.yaml is a worked example).

nameOverride: ""
fullnameOverride: ""
# Labels added to every resource this chart renders (not to subcharts').
commonLabels: {}
# Kubernetes cluster DNS domain, for the FQDNs this chart builds.
clusterDomain: cluster.local

# farmerorganization: the legacy tenant's ID. Must equal the nats chart's
# bus.organization and match ^[0-9A-Za-z_-]{1,191}$. farmer's built-in
# default "imas farmer" is not a valid tenant ID and stops it at boot.
organization: imas

# ---------------------------------------------------------------------------
# The DMZ bus (deploy/helm/nats). farmer and saasapi both dial it.
# ---------------------------------------------------------------------------
bus:
  # The nats chart's bus client Service and namespace:
  # <release>-nats-bus in the nats release's namespace. Required unless
  # bus.host is set.
  serviceName: ""
  namespace: imas-dmz
  # A bus outside this cluster: the bare DNS name farmer (farmerbusurl)
  # and saasapi (SAASAPI_NATS_URL) dial instead of the bus Service FQDN,
  # as tls://<host>:<port>. Not a URL, not host:port and not an IP
  # address; bus.port carries the port. The bus certificate must carry it as a SAN: saasapi always
  # verifies the name it dials. Empty (the default): the Service FQDN.
  host: ""
  # The bus client port (the nats chart's bus.ports.client), or the port
  # bus.host answers on (e.g. a node port).
  port: 5406
  # CIDRs farmer's and saasapi's NetworkPolicies may reach the bus at, on
  # bus.port, as ipBlock peers. A bus at bus.host is outside the cluster,
  # so the namespace/pod selector of the bus egress rule
  # (networkPolicy.dmz) never matches it: list its addresses here. With
  # bus.host set and this list set, the rule has only these peers;
  # without bus.host they are added next to the selector. NetworkPolicy
  # can't match a DNS name: keep this in step with what bus.host resolves
  # to by hand.
  egressCIDRs: []
  #   - 10.20.1.4/32
  # IMAS_SPROUT_BUS_URLS: the externally reachable wss:// addresses of
  # the nats chart's Envoy that enrollment hands sprouts. Required: the
  # fallback farmer derives from its own interface is an in-cluster name
  # no sprout can reach.
  sproutBusURLs: []
  #   - wss://bus.imas.example.com:443/
  # CA that issued the bus's certificate, for saasapi (farmer uses its own
  # rootca; see tls). Set one of secretName/configMapName. Both empty:
  # tls.mode=secret uses tls.secretName's ca.crt, tls.mode=openbao fetches
  # the PKI mount's CA from OpenBao at pod start.
  ca:
    secretName: ""
    configMapName: ""
    key: ca.crt
  # farmerbustlsservername: the name farmer verifies the bus certificate
  # against. Empty (the default): the host of farmerbusurl, i.e. the bus
  # Service FQDN (which the nats chart's default SANs cover) or bus.host.
  # Set it only if the bus certificate carries a different name. saasapi
  # always verifies the name it dials.
  tlsServerName: ""
  # IMAS_BUS_EXPECTED_NODES: how many bus nodes farmer's claims push waits
  # for (the nats chart's bus.replicaCount). 0: the nodes that answer a
  # server ping. A node still missing after the retries is logged, not an
  # error: its account loader applies the JWT from accountStore.
  expectedNodes: 0

# ---------------------------------------------------------------------------
# NATS NKey seeds. Never generated by this chart. Since P21 slice 1 only
# user-kind seeds remain: the operator, operator-signing, SYS account and
# tenant keys are OpenBao Transit keys (farmer.openbao.natsSign, natsTrust)
# and have no seed anywhere.
# ---------------------------------------------------------------------------
natsSeeds:
  # Existing Secret with the seeds (the one ESO syncs from OpenBao:
  # externalSecrets below, or deploy/farmer/externalsecrets.yaml). Required.
  secretName: imas-farmer-nats-seeds
  mountPath: /var/run/secrets/imas/nats
  # NAME: secret key. Each becomes IMAS_NATS_<NAME>_SEED_FILE. Both are
  # required: SYS_USER is farmer's SYS account user (its resolver
  # connection), SAASAPI_USER the credential saasapi holds. The publish Job
  # mounts SAASAPI_USER only. OPERATOR, OPERATOR_SIGNING, SYS_ACCOUNT,
  # TENANT and TENANT_SIGNING are refused: nothing reads them any more.
  seeds:
    SYS_USER: sys-user.nk
    SAASAPI_USER: saasapi-user.nk
  # More NAME: key pairs of user-kind seeds.
  extraSeeds: {}

# ---------------------------------------------------------------------------
# The public NATS trust (internal/pki/natstrust.go): the operator JWT, the
# operator, operator-signing and SYS account public keys, the SYS account
# JWT and, for a clustered bus, the bus fence user JWT. The OpenBao
# bootstrap Job (`farmer bootstrap-nats-trust`) mints it from the Transit
# keys and writes it to this ConfigMap in the release namespace; farmer
# and the publish Job mount it at /var/run/imas/nats-trust
# (IMAS_NATS_TRUST_DIR). Public data only. A bus in another namespace or
# cluster gets a copy (README.md, "NATS trust").
# ---------------------------------------------------------------------------
natsTrust:
  configMapName: imas-nats-trust
  # The bus CA ConfigMap (unit S1): when the bootstrap Job sets up OpenBao
  # PKI (tls.mode=openbao or openbaoBootstrap.farmerbus.enabled), its
  # nats-trust step writes the PKI mount's issuer certificate
  # (<tls.openbao.pkiMount>/cert/ca, the issuing_ca of the bus certificate)
  # to this ConfigMap in the release namespace as ca.crt, creating it when
  # absent and updating it when the PEM changed. Public data only. A bus in
  # bus.tls.mode=openbao needs a copy under the nats chart's
  # loader.caConfigMap (README.md, "NATS trust").
  busCAConfigMapName: imas-bus-ca
  # The nats chart's bus fence user public key (U..., from the
  # BUS_FENCE_USER seed ops created for a clustered bus). Set, the
  # bootstrap also mints bus-fence-user.jwt (IMAS_NATSBOOT_BUS_FENCE_USER_PUB).
  # Required before the bus runs with bus.replicaCount > 1.
  busFenceUserPub: ""
  # The nats chart's account loader SYS user public key (U..., from the
  # seed ops created for its loader.sysUserSecret). Set, the bootstrap also
  # mints bus-loader-user.jwt (IMAS_NATSBOOT_BUS_LOADER_USER_PUB), which
  # every bus pod's loader sidecar connects with. Required before the bus
  # runs the loader (P21 slice 2); must differ from busFenceUserPub.
  busLoaderUserPub: ""
  # Also copy the public trust to OpenBao KV v2 at
  # secret/data/platform/imas/nats-trust (the bootstrap's ephemeral policy
  # then gets that one path). Off: the copy is by hand or pipeline.
  kvCopy:
    enabled: false

# ---------------------------------------------------------------------------
# farmer's TLS: its API certificate, and the root CA it verifies the bus
# with (config.RootCA). Bus and farmer must be issued from the same CA.
# ---------------------------------------------------------------------------
tls:
  # secret: tls.crt/tls.key/ca.crt from secretName (e.g. cert-manager).
  # openbao: issued from OpenBao PKI at every start (IMAS_CERTS_OPENBAO_*).
  mode: openbao
  secretName: imas-farmer-tls
  # SANs requested in openbao mode. Empty: the farmer Service's names.
  certHosts: []
  openbao:
    pkiMount: pki
    # PKI role (IMAS_CERTS_OPENBAO_ROLE).
    role: imas-farmer
    # Kubernetes auth role this client logs in with.
    k8sRole: imas-farmer-certs
    # token auth only: key in openbaoClient.tokenSecretName.
    tokenSecretKey: certs-token

# ---------------------------------------------------------------------------
# How farmer, saasapi and the publish Job reach OpenBao. One address and
# auth method; each client logs in with its own role and gets only its
# own policy (never share a role between identities).
# ---------------------------------------------------------------------------
openbaoClient:
  # Empty with openbao.enabled: this release's OpenBao Service. Required
  # otherwise.
  addr: ""
  # ConfigMap holding OpenBao's CA as caKey (*_OPENBAO_CACERT). Empty uses
  # the system roots (and plain http for the eval OpenBao).
  caConfigMap: ""
  caKey: ca.crt
  # imas's OpenBao clients refuse a plain http:// address: tokens, login
  # JWTs and tenant box keys would cross the network unencrypted. true
  # accepts one (*_OPENBAO_ALLOW_INSECURE=true), for a throwaway install;
  # the chart refuses to render an http:// addr without it. The bundled
  # dev-mode OpenBao (openbao.enabled with openbao.server.dev.enabled and
  # no addr: the eval install) is http only and gets it without this.
  allowInsecure: false
  # kubernetes (projected ServiceAccount token, 10-minute expiry) or token.
  authMethod: kubernetes
  k8sMount: kubernetes
  # Audience of the projected token; every role's `audience` must match.
  k8sAudience: openbao
  # token auth: Secret holding one token per client (the *.tokenSecretKey
  # values). Never put farmer's and the publisher's tokens in one Secret
  # that farmer's pod mounts.
  tokenSecretName: ""

# The bao CLI image: runs the OpenBao bootstrap Job, and fetches the bus CA
# for saasapi in tls.mode=openbao. Keep it at the subchart's server version.
openbaoTools:
  image:
    repository: quay.io/openbao/openbao
    tag: "2.7.1"
    digest: ""
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# PXC. farmer owns the farmer schema, saasapi the saas schema; each reads
# the other's (docs/design/imas-machine-manager-api-design.md §5.1).
# ---------------------------------------------------------------------------
database:
  # Empty with pxc.enabled: this release's HAProxy Service. Required
  # otherwise.
  host: ""
  port: 3306
  # go-sql-driver DSN parameters, shared by both DSNs.
  params: "parseTime=true&charset=utf8mb4&loc=UTC"
  farmer:
    name: farmer
    user: farmer_svc
  saasapi:
    name: saas
    user: saas_svc
  # External PXC: an existing Secret holding both full DSNs
  # (user:pass@tcp(host:port)/db?params). Required when pxc.enabled=false.
  # With pxc.enabled the chart generates one (random passwords, kept
  # across upgrades) unless this is set.
  existingSecret: ""
  existingSecretKeys:
    farmerDSN: farmer-dsn
    saasapiDSN: saasapi-dsn
  # cmd/migrate, as Helm hook Jobs (README.md, "Migrations"). `migrate up`
  # on install (post-install with pxc.enabled, pre-install otherwise) and
  # on pre-upgrade; `migrate check` on pre-rollback. farmer and saasapi
  # don't migrate their own schemas: they wait for the version they need.
  # FLAG FOR SECURITY REVIEW: the `up` pod holds PXC's root password.
  migrate:
    image:
      repository: ghcr.io/yogzblr/imas-migrate
      # Empty: the chart's appVersion. Keep it at farmer's and saasapi's
      # version: the migrations are compiled into the binary.
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    # Secret/key with PXC root's password, mounted in the `up` pod only.
    # Empty with pxc.enabled: the operator's <cluster>-secrets (or
    # pxc.pxc.clusterSecretName). Empty with an external PXC: the root
    # step is skipped (--skip-root), and the schemas, users, §4.1 grants
    # and farmer's enrollment_keys column grant are ops' job.
    rootPasswordSecret: ""
    rootPasswordKey: root
    rootUser: root
    # How long cmd/migrate waits for PXC (--wait). Covers the bundled
    # cluster coming up on first install.
    wait: 15m
    backoffLimit: 2
    # Overall budget: PXC coming up, another run's migration lock, the
    # migrations themselves. `helm install/upgrade --timeout` must be at
    # least this long, or Helm gives up on the hook first.
    activeDeadlineSeconds: 1800
    # Emit Argo CD hook annotations (Sync with the bundled PXC, PreSync
    # with an external one) instead of letting Argo CD map Helm's.
    argoCDHooks: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Object storage for recipes, job logs and sprout JWTs (not bundled, unless
# versity.enabled puts the Versity Gateway in front of Azure Blob).
# farmer starts without it; recipe, job and enrolment requests fail until
# it is reachable.
# ---------------------------------------------------------------------------
objectStore:
  # host[:port], no scheme. Empty with versity.enabled: the gateway's
  # Service (and useSSL is ignored: plain HTTP in the cluster).
  endpoint: ""
  useSSL: true
  bucket: ""
  # Must differ from bucket: GET /files/ serves every key in the recipe
  # bucket to any authenticated caller.
  jobBucket: ""
  # IMAS_S3_SPROUT_JWT_BUCKET: the private bucket farmer keeps sprout User
  # JWTs in. Must differ from bucket and jobBucket. Required for
  # enrolment: without it farmer can't hand a sprout its JWT.
  sproutJWTBucket: ""
  # Secret with the access key pair (IMAS_S3_ACCESS_KEY_ID/_SECRET_ACCESS_KEY).
  credentialsSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

# ---------------------------------------------------------------------------
# The accounts bucket (docs/briefs/P21-slice2-bus-loader.md §4). farmer
# writes every Account JWT it pushes to accounts/<account>.jwt and bumps
# accounts/index, before the push; each bus node's account loader (nats
# chart, accountStore) reads it with a read-only credential, so a bus node
# started empty loads every Account from here. A bucket and a write
# credential of its own: farmer's objectStore credential must not reach it,
# and this one must not reach the recipe, job or sprout JWT bucket.
# Required: the chart fails to render without a bucket and an endpoint
# (endpoint or objectStore.endpoint), and farmer refuses to start without
# them, since the bus keeps no Accounts of its own across a restart.
# ---------------------------------------------------------------------------
accountStore:
  # host[:port], no scheme. Empty: objectStore.endpoint (the Versity
  # Gateway's Service with versity.enabled).
  endpoint: ""
  # null: objectStore.useSSL.
  useSSL: null
  bucket: imas-accounts
  # Secret with the writer's access key pair (IMAS_ACCOUNTS_S3_ACCESS_KEY_ID/
  # _SECRET_ACCESS_KEY): get, put and list on the bucket, no delete. UAT:
  # uat/hub/core/rustfs-setup.sh creates it. Must not be
  # objectStore.credentialsSecret.
  credentialsSecret: imas-farmer-accounts-writer
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key
  # IMAS_ACCOUNTS_EVENT_SUBJECT: the accounts-changed event farmer
  # publishes in the SYS Account; the nats chart's accountStore.eventSubject.
  eventSubject: imas.bus.accounts.changed

# ---------------------------------------------------------------------------
# Versity Gateway (design D18; README.md, "Versity Gateway"): an optional
# S3 gateway in front of Azure Blob, the production object store. Off by
# default (the code only speaks S3: any S3 endpoint works, D15).
#
# On, it is the S3 endpoint of farmer, saasapi and the accounts bucket:
# objectStore.endpoint and accountStore.endpoint must be left empty, and
# the chart points them at the gateway's Service
# (<release>-farmer-versity.<namespace>.svc:<port>, plain HTTP inside the
# cluster; objectStore.useSSL is then ignored). Set objectStore.endpoint to
# use another S3 endpoint instead (and leave this off). The DMZ bus's
# account loader reads the accounts bucket through the same Service (the
# nats chart's accountStore.endpoint) with versity.accountsReader's
# credential.
#
# Users: one per component credential, written into the gateway's IAM
# file from these Secrets by an init container (`farmer versity-iam`):
#   farmer           objectStore.credentialsSecret: the recipe, job and
#                    sprout JWT buckets
#   saasapi-recipes  saasapi.recipes.credentialsSecret (with
#                    saasapi.recipes.enabled): tenants/*/recipes/* of the
#                    recipe bucket (files/objectstore-policies/)
#   accounts-writer  accountStore.credentialsSecret: get, put, list on
#                    the accounts bucket
#   accounts-reader  versity.accountsReader.credentialsSecret: get, list
#                    on the accounts bucket (the DMZ bus, design D22)
#   logs-writer      logShipping.credentialsSecret (with logShipping):
#                    put under logShipping.prefix of the log bucket
#   logs-retention   logShipping.retention.credentialsSecret: list the
#                    log bucket, delete under logShipping.prefix
# Every user is role "user": it reaches only what its buckets' policies
# grant. The createBuckets hook Job creates the buckets (Azure Blob
# containers) with the root credential and writes those policies.
# FLAG FOR SECURITY REVIEW: the gateway holds the Azure account key and
# every object store credential.
# ---------------------------------------------------------------------------
versity:
  enabled: false
  # Apache-2.0 (DEPENDENCIES.md). Pinned by digest (the render fails
  # without one); the tag is informational.
  image:
    repository: docker.io/versity/versitygw
    tag: "v1.8.0"
    digest: "sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  # The S3 port of the pods and the Service (VGW_PORT). 1024 or above:
  # the gateway runs as non-root.
  port: 7070
  # VGW_REGION: the region the gateway signs and answers for.
  region: us-east-1
  # VGW_HEALTH: the gateway's health endpoint (GET, no credential), which
  # the probes call.
  healthPath: /_/health
  # The Azure Blob backend (`versitygw azure`).
  azure:
    # Existing Secret with the storage account name and key
    # (AZ_ACCOUNT_NAME, AZ_ACCESS_KEY). Required when enabled.
    credentialsSecret: ""
    accountNameKey: account-name
    accountKeyKey: account-key
    # AZ_ENDPOINT: the Blob service URL. Empty:
    # https://<account>.blob.core.windows.net/.
    endpoint: ""
  # Existing Secret with the gateway's root S3 credential
  # (ROOT_ACCESS_KEY_ID / ROOT_SECRET_ACCESS_KEY). Only the gateway and
  # the createBuckets Job mount it; no component uses it. Required when
  # enabled; must differ from every user's Secret.
  rootCredentials:
    secretName: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  # The DMZ bus's read-only accounts credential (the nats chart's
  # accountStore.credentialsSecret holds the same pair, in the DMZ
  # namespace). Required when the accounts bucket is the gateway's.
  accountsReader:
    credentialsSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  # The hook Job (`farmer versity-buckets`, post-install/post-upgrade)
  # that creates objectStore.bucket, .jobBucket, .sproutJWTBucket,
  # accountStore.bucket and logShipping.bucket (with logShipping) on the
  # gateway and writes their bucket policies.
  # Every run replaces the policies with the chart's, so a removed grant
  # goes too. Bucket names must be valid Azure Blob container names.
  createBuckets:
    # Fixed name, no RBAC, no API token.
    serviceAccountName: imas-versity-buckets
    # In-pod deadline, retries for a gateway still starting included.
    timeout: 10m
    backoffLimit: 2
    # `helm install/upgrade --timeout` must be at least this long.
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600
    argoCDHooks: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # Reloader rolls the gateway when a credential Secret changes (the IAM
  # file is written at pod start).
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty: spread over nodes (kubernetes.io/hostname, maxSkew 1,
  # ScheduleAnyway).
  topologySpreadConstraints: []
  priorityClassName: ""
  service:
    type: ClusterIP
    annotations: {}
  # Rendered only with replicas > 1.
  pdb:
    enabled: true
    maxUnavailable: 1
  networkPolicy:
    # Peers allowed in on the S3 port besides farmer, saasapi, the
    # createBuckets Job and the nats chart's bus pods in this cluster
    # (networkPolicy.dmz): e.g. the DMZ nodes' addresses as ipBlock
    # peers when the bus runs in another cluster.
    extraIngressFrom: []
    # Peers of the Azure Blob egress rule (443). Empty: any destination,
    # on 443 only. Narrow it to the storage account's addresses (or a
    # private endpoint's) as ipBlock peers.
    azureEgress: []

# ---------------------------------------------------------------------------
# Log shipping (design D16; README.md, "Log shipping and retention"):
# Fluent Bit (Apache-2.0, DEPENDENCIES.md) on every node tails the
# container logs of this release's namespace (farmer's, saasapi's and
# every other pod's: service logs and the audit log, all JSON on stdout)
# and writes them, gzipped, to `bucket` on the object store farmer uses
# (objectStore.endpoint, or the Versity Gateway with versity.enabled),
# under <prefix><YYYY>/<MM>/<DD>/<pod>-<time>-<uuid>.gz. Off by default.
#
# Retention: the log retention CronJob (`farmer log-retention`) deletes
# the days older than retention.days (default 30), with a credential of
# its own that may list and delete there and nothing else. Not a bucket
# lifecycle rule: Versity Gateway v1.8.0 does not implement one.
#
# With versity.enabled the createBuckets Job also creates `bucket`, with
# a policy for two users: logs-writer (credentialsSecret: PutObject under
# prefix) and logs-retention (retention.credentialsSecret: list the
# bucket, DeleteObject under prefix). Elsewhere give the two credentials
# those grants on the store (files/objectstore-policies/logs-*.json).
#
# existingConfigMap replaces the chart's Fluent Bit configuration (key
# fluent-bit.yaml), to send the logs elsewhere without a chart change
# (D16); retention is then the destination's own, and the CronJob is not
# rendered.
# FLAG FOR SECURITY REVIEW: the shipper reads every container log of the
# namespace on its node (a hostPath of /var/log, read-only) and runs as
# root to do so, with no capabilities.
# ---------------------------------------------------------------------------
logShipping:
  enabled: false
  image:
    repository: docker.io/fluent/fluent-bit
    tag: "4.2.0"
    digest: "sha256:aff743e1a5e61d036d10a4472d67cdd7a6b408c92218eb86e3f301e2bac7817a"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # The log bucket; must differ from every other bucket of the chart, and
  # be a valid Azure Blob container name with versity.enabled.
  bucket: imas-logs
  # The key root of every log object, ending in "/".
  prefix: logs/
  # The region the S3 output signs for (versity.region with the gateway).
  region: us-east-1
  # Existing Secret with the writer's access key pair (Fluent Bit's
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY): PutObject under prefix
  # only. Required when enabled; must differ from every other component's.
  credentialsSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key
  # Host log files tailed. Empty: /var/log/containers/*_<namespace>_*.log,
  # this release's namespace.
  paths: []
  # An object is written when this much is buffered, or uploadTimeout
  # after its first record, whichever is first.
  totalFileSize: 50M
  uploadTimeout: 10m
  # A ConfigMap of your own with key fluent-bit.yaml, used instead of the
  # chart's. Empty: the chart's.
  existingConfigMap: ""
  retention:
    # Days a log object is kept, by the day in its key: a whole number,
    # 1..3650; 0 or null is the default, 30.
    days: 30
    # The CronJob's schedule (UTC unless timeZone is set).
    schedule: "17 3 * * *"
    timeZone: ""
    # Existing Secret with the retention credential: ListBucket on the
    # bucket and DeleteObject under prefix, nothing else. Required when
    # enabled; must differ from credentialsSecret.
    credentialsSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
    serviceAccountName: imas-log-retention
    timeout: 30m
    backoffLimit: 2
    activeDeadlineSeconds: 2400
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  serviceAccountName: imas-log-shipper
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  # Root, to read the node's container logs (root-owned, 0640); no
  # capabilities and a read-only root filesystem.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }
  # Extra environment of the shipper, e.g. a credential an
  # existingConfigMap's output reads.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  # The default tolerates every taint, so every node, control plane
  # included, ships its pods' logs.
  tolerations:
    - operator: Exists
  priorityClassName: ""
  networkPolicy:
    # Extra egress rules of the shipper, e.g. for an existingConfigMap's
    # destination.
    extraEgress: []

# ---------------------------------------------------------------------------
# farmer (cmd/farmer)
# ---------------------------------------------------------------------------
farmer:
  image:
    repository: ghcr.io/yogzblr/imas-farmer
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Farmer is stateless (README.md, "Farmer is stateless"): replicas share
  # PXC, Valkey, OpenBao and the object store, and serialise through row
  # leases. Rolled one pod at a time (RollingUpdate, maxUnavailable 0).
  replicaCount: 2
  logLevel: info
  # IMAS_LOG_FORMAT: json (one object per line, for the log shipper) or
  # text.
  logFormat: json
  apiPort: 5405
  # farmer's NKey seed (IMAS_FARMER_NKEY_SEED_FILE): one user-kind seed
  # that every replica mounts read-only, so all of them are the same NATS
  # user. Never generated by farmer or this chart; the render fails
  # without secretName and key. A Secret of its own: saasapi and the Jobs
  # never mount it. With externalSecrets.enabled, ESO syncs it from
  # externalSecrets.seedPath, property farmer_nkey (README.md, "Seeds").
  nkeySecret:
    secretName: imas-farmer-nkey
    key: farmer.nk
    mountPath: /var/run/secrets/imas/farmer-nkey
  # The first admin of the imas CLI, bootstrapped from farmer's config
  # file (users.admin in /etc/imas/farmer), never over the bus (J.3,
  # docs/design/imas-payload-encryption-design.md Decision A). Every CLI
  # request is sealed with the user's CLI box key, so the first admin
  # needs both halves of their identity here:
  #   pubkey:   their NKey public key (imas auth pubkey), the user ID.
  #   boxpub:   the CLI box public key their own imas auth keygen printed.
  #             Check its fingerprint with them out of band.
  #   username: optional, shown in listings and audit entries.
  # Farmer imports boxpub into its database once, on the first start that
  # sees this user with no key history; from then on the database is
  # authoritative (rotations, admin resets), and changing boxpub here does
  # nothing. Further users are added by this admin with imas users add.
  #
  # Required (FIX.3): the CLI can't add a user over the bus, so an install
  # with no bootstrap admin has no one who can make a request, and the
  # render fails if pubkey and boxpub are empty. Both keys are made
  # offline, before the install (imas auth privkey, imas auth keygen; see
  # docs/INSTALL.md, "The imas CLI").
  #   skip:     true renders no users section and silences that check.
  #             Only when farmer's database already holds an admin: an
  #             upgrade of a release installed without this value, or a
  #             reinstall against the same database. Mutually exclusive
  #             with pubkey, boxpub and username.
  bootstrapAdmin:
    pubkey: ""
    username: ""
    boxpub: ""
    skip: false
  # Removed in J.3: an admin with no CLI box key can't make a single
  # request. Rendering fails if it is set; use bootstrapAdmin.
  adminPubKeys: []
  # gatewayjwtttl. Keep equal to the nats chart's
  # envoy.refreshRateLimit.gatewayJwtTtlSeconds.
  gatewayJWTTTL: 24h
  # IMAS_JOB_RECONCILE_WINDOW (deploy/farmer/values.job-reconcile.yaml).
  # A quoted Go duration; null or "" emits nothing (every job recorded).
  jobs:
    reconcileWindow: "2h"
    # IMAS_JOB_LEASE_TTL: lease TTL of the hourly jobs (job expiry, cohort
    # refresher, account push), a quoted Go duration. Empty: farmer's
    # default, 120s.
    leaseTTL: ""
  # How long farmer keeps data (docs/retention.md, U4). Each value emits
  # its variable, which wins over the config file; null or "" emits
  # nothing, and farmer reads its config file key (joblogttl,
  # recipeauditretentiondays, boxkeygraceduration, settable through
  # farmer.extraConfig) or, without one, uses the same default. A value
  # farmer refuses (out of range, not a duration) stops it at startup
  # with a message naming the variable or key.
  retention:
    # IMAS_JOB_LOG_TTL: a job's records and step events (the job bucket's
    # jobs/<tenant>/<sprout>/<jid>/ objects and its job_status row) are
    # deleted this long after the job's last activity, by the hourly job
    # reaper. A quoted Go duration, 1h..87600h; "0" is the default, 720h.
    jobLogTTL: "720h"
    # IMAS_RECIPE_AUDIT_RETENTION_DAYS: days the recipe audit records
    # (tenants/<tenant>/recipe-audit/<day>/ in objectStore.bucket) are
    # kept; farmer's daily sweep deletes older days. A whole number,
    # 1..3650; 0 keeps them for ever.
    recipeAuditDays: 365
    # IMAS_BOX_KEY_GRACE_DURATION: how long a sprout's previous box public
    # key stays valid after the sprout rotates it (rows of
    # pki_sprout_box_keys in state grace, revoked after it). A quoted Go
    # duration, 10m..720h; "0" is the default, 24h.
    boxKeyGrace: "24h"
  # Per-tenant bus connections (connected on first use). One is closed
  # once unused for idleTTL and with no sprout heartbeat for
  # heartbeatWindow; the next use dials it again. Quoted Go durations.
  tenantConnections:
    # IMAS_TENANT_CONN_IDLE_TTL
    idleTTL: "10m"
    # IMAS_TENANT_CONN_HEARTBEAT_WINDOW
    heartbeatWindow: "15m"
  # IMAS_TENANT_RELOCK_INTERVAL: how often farmer pushes a fresh lock-out
  # for every deprovisioned tenant whose Account is still live on the bus
  # or in the accounts bucket (security review 2026-10, L11). A quoted Go
  # duration from "1m" to "24h"; farmer refuses to start outside that
  # range. Empty: farmer's default, 10m.
  tenantRelockInterval: "10m"
  # Recipe template render limits (IMAS_RECIPE_*; internal/cook's
  # "Bounded work"). Recipes are tenant-written, untrusted input, so every
  # render is capped, and every cook as a whole (security review B4). All
  # nine are required: sizes, iterations and maxIncludes are positive
  # whole numbers, the timeouts quoted Go durations. Farmer refuses to
  # start if one is out of range (per render: sizes up to 64 MiB, time up
  # to 1m, iterations up to 10000000, maxValueBytes <= maxRenderedBytes;
  # per cook: each at least its per-render value and at most 256 MiB, 5m
  # or 100000000; maxIncludes 1 to 256). saasapi validates recipe uploads
  # under these same per-render values and maxIncludes (owner decision,
  # 2026-10-04: one set of limits, no saasapi override); it never cooks,
  # so it gets no cook* value.
  recipes:
    templateLimits:
      # A recipe's source, checked on read and before parsing.
      maxSourceBytes: 262144
      # One render's output.
      maxRenderedBytes: 1048576
      # Any one string a template function returns.
      maxValueBytes: 262144
      # One recipe's template execution.
      renderTimeout: "2s"
      # Total iterations of every range in one render.
      maxRangeIterations: 10000
      # One cook's budget, shared by every render of the cook: finding
      # the includes and building the steps, for the recipe it names and
      # every recipe it includes. Total time inside the renders.
      cookRenderTimeout: "10s"
      # Total output of every render of one cook (8 MiB).
      cookMaxRenderedBytes: 8388608
      # Total range iterations of every render of one cook.
      cookMaxRangeIterations: 100000
      # Distinct recipes one cook may include (the recipe it names is not
      # counted); at most 256. saasapi also refuses an upload whose own
      # include list is longer.
      maxIncludes: 64
  # IMAS_SELF_UPDATE_ENABLED: farmer's own switch for self_update on
  # internal.sprout.action (security review 2026-10, L1), independent of
  # saasapi.fleetUpdateDispatch.enabled. Off, farmer refuses every
  # self_update, so a forged request can't start an update. Leave it off
  # until the security review and the release UAT gate are done
  # (docs/BUILD-STATUS.md); a rollout needs both switches on.
  selfUpdate:
    enabled: false
  # internal.sprout.action concurrency per farmer replica (security review
  # M5). cmd.run and cook share one pool; self_update has a pool of its
  # own, so rollouts can't be starved; within each pool one tenant holds
  # at most tenantConcurrency slots. A request that doesn't fit is refused
  # at once (farmer_busy) and saasapi sends it again; nothing queues.
  # Positive integers up to 1024; null emits no env var (farmer's default).
  sproutActions:
    # IMAS_SPROUT_ACTION_CONCURRENCY.
    concurrency: 256
    # IMAS_SELF_UPDATE_CONCURRENCY.
    selfUpdateConcurrency: 16
    # IMAS_SPROUT_ACTION_TENANT_CONCURRENCY.
    tenantConcurrency: 32
  # OpenBao clients inside farmer, one role each.
  openbao:
    # Gateway JWT signer (Transit sign on exactly this key).
    gateway:
      transitMount: transit
      keyName: imas-gateway-jwt
      k8sRole: imas-farmer-gateway
      tokenSecretKey: gateway-token
    # Tenant X25519 keypairs in KV v2: one secret per tenant at
    # <kvMount>/data/<kvPath>/tenants/<tenant_id>. Nothing is read or
    # written at <kvPath> itself; there is no shared keypair.
    tenantBox:
      kvMount: secret
      kvPath: imas/tenant-x25519
      k8sRole: imas-farmer-tenantbox
      tokenSecretKey: tenantbox-token
    # NATS trust chain signer (IMAS_NATSSIGN_*, internal/pki/natskeys):
    # signs every account and user JWT farmer issues with the Transit keys
    # nats-operator-signing, nats-sys-account and nats-tsign-<tenant>,
    # creates the per-tenant keys at provisioning, soft-deletes them at
    # offboarding and destroys them when the tenant's data is purged
    # (saasapi.tenantPurge). Policy files/openbao-policies/imas-farmer-natssign.hcl,
    # which names the transit mount, so transitMount stays "transit".
    natsSign:
      k8sRole: imas-farmer-natssign
      tokenSecretKey: natssign-token
      transitMount: transit
      # IMAS_NATSSIGN_TIMEOUT / _BATCH_MAX / _WORKERS.
      timeout: 15s
      batchMax: 64
      workers: 4
  # Extra /etc/imas/farmer keys. Chart-managed keys win.
  extraConfig: {}
  # Never put a raw IMAS_NATS_*_SEED or any IMAS_SAASAPI_CRED_OPENBAO_* here.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  terminationGracePeriodSeconds: 60
  startupProbe:
    httpGet: { path: /health, port: api, scheme: HTTPS }
    periodSeconds: 5
    failureThreshold: 60
  # /ready: PXC, Valkey and the legacy tenant's bus connection.
  readinessProbe:
    httpGet: { path: /ready, port: api, scheme: HTTPS }
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet: { path: /health, port: api, scheme: HTTPS }
    periodSeconds: 20
    timeoutSeconds: 5
  # Reloader rolls farmer when the seed Secret changes (the rotation
  # runbook in deploy/farmer/README.md depends on it).
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  # Empty: preferred pod anti-affinity on kubernetes.io/hostname, so the
  # replicas land on different nodes where they can.
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  service:
    type: ClusterIP
    annotations: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Rendered only with replicaCount > 1.
  pdb:
    enabled: true
    minAvailable: 1

# ---------------------------------------------------------------------------
# saasapi (cmd/saasapi)
# ---------------------------------------------------------------------------
saasapi:
  enabled: true
  image:
    repository: ghcr.io/yogzblr/imas-saasapi
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  command: []
  args: []
  replicaCount: 2
  # IMAS_LOG_FORMAT: json or text.
  logFormat: json
  port: 8081
  # Layer-2 auth: the Keycloak realm whose end-user JWTs the BFF forwards.
  # All three are required (saasapi refuses to start without them).
  jwt:
    keycloakJWKSURL: ""
    issuer: ""
    audience: ""
  # Layer-1 auth: the BFF's shared secret (INTERNAL_AUTH_SECRET_CURRENT,
  # and _PREVIOUS during a rotation). Existing Secret, required.
  internalAuthSecret:
    secretName: imas-saasapi-internal-auth
    currentKey: current
    previousKey: previous
  # saasapi's NATS identity: its seed and the JWT the publish Job writes to
  # OpenBao, delivered by ESO (externalSecrets.saasapi) as this Secret.
  natsCredentials:
    secretName: imas-saasapi-nats
    seedKey: nats-user.nk
    jwtKey: SAASAPI_NATS_USER_JWT
  # The SaaS API's half of sealed internal.* traffic (J.4, README "Control-
  # plane box keys"). One Secret, mounted only in saasapi's pods: its box
  # PRIVATE key (<base>/saasapi-box, field priv), mounted read-only as a
  # file (SAASAPI_BOX_PRIV_FILE), and the platform PUBLIC key it pins
  # (<base>/controlplane-pub, field platform_pub; SAASAPI_PLATFORM_BOX_PUB).
  # ESO renders it with externalSecrets.enabled; otherwise create it by
  # hand once the keygen Job has run (README). saasapi refuses to start
  # without both. It never holds the platform private key, and farmer never
  # mounts this Secret. FLAG FOR SECURITY REVIEW.
  controlPlaneBox:
    secretName: imas-saasapi-box
    privKey: saasapi-box.key
    platformPubKey: SAASAPI_PLATFORM_BOX_PUB
  # POST .../sprouts/updates. The sprout-side update path is built, but
  # leave this off until the security review and the release UAT gate are
  # done (docs/BUILD-STATUS.md). On needs farmer.selfUpdate.enabled, or
  # farmer refuses every update.
  fleetUpdateDispatch:
    enabled: false
    # SAASAPI_FLEET_UPDATE_CLOCK_SKEW: how far saasapi's and farmer's
    # clocks may differ when a wave checks that a sprout's report postdates
    # its update (a Go duration, above 0 and at most 5m). Empty keeps
    # saasapi's default, 30s. Widen only for nodes without NTP.
    clockSkew: ""
  # internal.sprout.action dispatch concurrency per saasapi replica
  # (internal/saasapi/dispatch_limits.go; security review M5): a
  # cmd.run/cook pool, a pool reserved for rollout waves, and one tenant's
  # cap in each, which must be at most half of concurrency (saasapi
  # refuses to start otherwise). Keep each at or below farmer's
  # farmer.sproutActions value times farmer's replicas. Positive integers
  # up to 1024; null emits no env var (saasapi's default).
  actionDispatch:
    # SAASAPI_ACTION_DISPATCH_CONCURRENCY.
    concurrency: 256
    # SAASAPI_SELF_UPDATE_DISPATCH_CONCURRENCY.
    selfUpdateConcurrency: 16
    # SAASAPI_ACTION_DISPATCH_TENANT_CONCURRENCY.
    tenantConcurrency: 32
    # SAASAPI_ACTION_MAX_PENDING_PER_TENANT: POST .../sprouts/actions is
    # refused (429 backlog_full, nothing written) when a tenant's queued
    # and dispatching items plus the request's asset_ids would exceed
    # this. A soft limit: requests in flight at the same moment on other
    # replicas may each pass. Update rollouts are never refused by it.
    # An integer from 1 to 100000; null emits no env var (saasapi's
    # default, 2000).
    maxPendingPerTenant: 2000
  # The outbox sweeper (internal/saasapi/sweeper.go, CL.3): re-publishes
  # tenant provisioning jobs left pending, re-sends §1.5 action items left
  # queued (never ones already sent), and resumes update rollouts whose pod
  # died (only with fleetUpdateDispatch on). Safe on every replica: work is
  # claimed with a row lease in the saas schema. Empty or null keeps
  # saasapi's default and emits no env var. Durations are Go durations.
  outboxSweeper:
    # SAASAPI_OUTBOX_SWEEPER_ENABLED.
    enabled: true
    # SAASAPI_OUTBOX_SWEEP_INTERVAL: default 30s, 1s..1h.
    interval: ""
    # SAASAPI_OUTBOX_PROVISIONING_STALE_AFTER: a pending provisioning job is
    # published again this long after its last publish, doubling per
    # attempt. Default 2m, 10s..24h.
    provisioningStaleAfter: ""
    # SAASAPI_OUTBOX_ACTION_STALE_AFTER: the same for a queued action item.
    # Default 2m, 10s..24h.
    actionStaleAfter: ""
    # SAASAPI_OUTBOX_ACTION_MAX_AGE: a queued action item not sent this long
    # after it was accepted fails as expired_not_sent instead of being sent
    # late. Default 30m, 1m..1h.
    actionMaxAge: ""
    # SAASAPI_OUTBOX_MAX_ATTEMPTS: dispatches before a job or item is
    # failed. Default 5, 1..50.
    maxAttempts: null
    # SAASAPI_OUTBOX_LEASE_TTL: how soon a dead pod's batch or rollout is
    # taken over. Default 2m, 15s..1h.
    leaseTTL: ""
  # Erasing an offboarded tenant's data (internal/saasapi tenant_purge.go,
  # S6). Offboarding locks a tenant out at once; its data (recipes, job
  # output, sprout and property rows, sprout JWTs, box keys, Transit keys,
  # its saas rows) is erased once it has been offboarded for `after`, by a
  # purge job the outbox sweeper starts. Only a tombstone stays (README,
  # "Erasing an offboarded tenant's data"). An operator can purge sooner:
  # POST /v1/operator/tenants/{tenant_id}/purge on the operator plane.
  # null keeps saasapi's default and emits no env var.
  # FLAG FOR SECURITY REVIEW: a purge cannot be undone.
  tenantPurge:
    # SAASAPI_TENANT_PURGE_ENABLED: default true. false: the sweeper
    # purges nothing; the operator route still does.
    enabled: null
    # SAASAPI_TENANT_PURGE_AFTER: the retention delay, a Go duration.
    # Default 720h (30 days), 1h..8760h.
    after: null
  # How long the SaaS database keeps terminal rows (internal/saasapi
  # retention.go; docs/retention.md, U4). The outbox sweeper deletes them
  # hourly, at most 500 rows per statement with a pause between
  # statements, so it never locks a table.
  retention:
    # SAASAPI_TERMINAL_ROW_RETENTION: finished action batches and items,
    # finished provisioning jobs of tenants that are not offboarding,
    # offboarded or purged (those are the tombstone's record), and
    # enrollment keys (join tokens) past their expiry, once they are this
    # old. A Go duration, 24h..87600h; null or "" emits nothing, "0" is
    # the default, 2160h (90 days).
    terminalRows: "2160h"
  # The operator plane (internal/saasapi NewOperatorServer, API design
  # §2.5): sprout release registration and revoke, on its own HTTPS
  # listener and its own Service (<release>-saasapi-operator), never the
  # one the gateway routes to. The sprout release hook Job (sproutRelease
  # below) is its only in-cluster caller. cmd/saasapi starts this listener
  # when SAASAPI_OPERATOR_LISTEN_ADDR is set (which this switch sets).
  # FLAG FOR SECURITY REVIEW: the operator token can register any
  # well-formed release whose checksums.txt it supplies; a sprout installs
  # only what verifies against its packaged keyring.
  operator:
    enabled: false
    port: 8443
    # kubernetes.io/tls Secret: tls.crt/tls.key for the listener, and
    # ca.crt, which the hook Job verifies the listener with (it mounts only
    # that key). SANs: the operator Service's FQDN (NOTES prints it).
    tls:
      secretName: ""
    # Existing Secret with the operator bearer token (at least 32
    # characters, no whitespace): SAASAPI_OPERATOR_TOKEN_FILE, and the
    # token the hook Job presents. A Secret of its own. previousKey: set
    # only during a rotation (SAASAPI_OPERATOR_TOKEN_PREVIOUS_FILE; README,
    # "Rotating the operator token").
    token:
      secretName: ""
      currentKey: current
      previousKey: ""
    service:
      annotations: {}
  # Tenant recipe upload (REC.1, API design §1.6; FLAG FOR SECURITY
  # REVIEW): PUT/GET/DELETE /v1/tenants/{tenant_id}/recipes/{name}. saasapi
  # writes tenants' recipes to objectStore.bucket at objectStore.endpoint
  # (the bucket farmer cooks from) with an object-store credential of its
  # OWN, never farmer's (objectStore.credentialsSecret). That credential's
  # policy must allow only tenants/*/recipes/* (plus PutObject on
  # tenants/*/recipe-audit/*): never sprouts/, the job bucket or the
  # platform recipe prefix. Examples: files/objectstore-policies/. Uploads
  # are validated under farmer.recipes.templateLimits, the same IMAS_RECIPE_*
  # values farmer cooks under. Off: the routes answer 503.
  recipes:
    enabled: false
    # Existing Secret with saasapi's access key pair. The id becomes
    # SAASAPI_RECIPES_S3_ACCESS_KEY_ID; the secret key is mounted as a file
    # (SAASAPI_RECIPES_S3_SECRET_ACCESS_KEY_FILE). Required when enabled.
    credentialsSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
    # Keycloak roles (realm roles, or client roles of saasapi.jwt.audience).
    # Reading needs either; writing (PUT, DELETE) needs writeRole. A recipe
    # runs as root on the tenant's sprouts: grant writeRole like the right
    # to run commands, not like a viewer. They must differ.
    readRole: imas-recipes-read
    writeRole: imas-recipes-write
    # Per-tenant caps (SAASAPI_RECIPES_MAX_COUNT, 1..100000, and
    # SAASAPI_RECIPES_MAX_TOTAL_BYTES, up to 1 GiB).
    maxCount: 500
    maxTotalBytes: 20971520
    # PUT and DELETE per tenant, one budget for both (shared across pods
    # through Valkey when it is configured).
    writeRateLimit:
      perSecond: 1
      burst: 10
    # SAASAPI_RECIPES_CREDENTIAL_CHECK (FIX.3): at startup saasapi asks the
    # object store whether its recipe credential can create an object
    # outside tenants/ or under sprouts/, read a key under sprouts/ or list
    # sprouts/, create or delete one under the platform recipe prefix
    # (farmer's recipedir), or do anything at all in objectStore.jobBucket
    # (FIX.5), and refuses to start if any of it is allowed, or if the
    # store gives no answer it can classify within about 30 seconds (fail
    # closed: only AccessDenied counts as denied). It needs
    # objectStore.jobBucket set. This is what makes the policy in
    # files/objectstore-policies/ a checked limit rather than
    # documentation. Turn it off only for a store whose answers it can't
    # classify, and limit the credential some other way; NOTES warns.
    credentialCheck: true
  # deploy/saasapi/values.rate-limit.yaml. null emits no env var (the
  # compiled-in default).
  enrollmentKeys:
    rateLimit:
      # Sustained POST .../enrollment-keys per second, per tenant; > 0.
      perSecond: 1
      # Back-to-back requests before perSecond applies; whole number >= 1.
      burst: 5
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  terminationGracePeriodSeconds: 30
  # saasapi has no unauthenticated route, so TCP.
  readinessProbe:
    tcpSocket: { port: http }
    periodSeconds: 10
  livenessProbe:
    tcpSocket: { port: http }
    periodSeconds: 20
  # Reloader rolls saasapi when its NATS seed or auth secret changes. A
  # refreshed NATS JWT needs no roll: saasapi re-reads its mounted file.
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  pdb:
    enabled: true
    maxUnavailable: 1

# ---------------------------------------------------------------------------
# `farmer publish-saasapi-credential` (deploy/farmer/
# saasapi-credential-publish-job.yaml): a post-install/post-upgrade hook
# that writes saasapi's NATS User JWT to OpenBao KV v2.
# FLAG FOR SECURITY REVIEW: its ServiceAccount is the only identity that
# may log in to the KV-write role. See README.md.
# ---------------------------------------------------------------------------
credentialPublisher:
  enabled: true
  # Fixed name: the OpenBao role's bound_service_account_names names it.
  serviceAccountName: imas-saasapi-cred-publisher
  k8sRole: imas-saasapi-cred-publisher
  # token auth: the publisher's own Secret (empty: openbaoClient's). Keep
  # it apart from farmer's tokens.
  tokenSecretName: ""
  tokenSecretKey: publisher-token
  kvMount: secret
  # Its own path. Neither it nor externalSecrets.seedPath may be a prefix
  # of the other.
  kvPath: platform/imas/saasapi-nats-user
  # Its NATS signer (IMAS_NATSSIGN_*): signs the SaaS API User JWT with the
  # SYS account Transit key only (files/openbao-policies/
  # imas-nats-sys-signer.hcl). A role of its own, bound to this
  # ServiceAccount alone.
  natsSign:
    k8sRole: imas-natssign-publisher
    # token auth: key in tokenSecretName (empty: openbaoClient's).
    tokenSecretKey: natssign-publisher-token
  # IMAS_SAASAPI_USER_JWT_TTL: the SaaS API User JWT's lifetime (its exp;
  # security review 2026-10, L14), a Go duration from 1h to 720h. A run
  # writes a new JWT once a third of it is left.
  userJWTTTL: 24h
  # The refresh CronJob: the same run on a schedule, so the JWT is renewed
  # before it expires without a deployment. It runs every everyHours hours
  # (1, 2, 3, 4, 6, 8 or 12, so the runs are evenly spaced) at minute
  # minute, schedule "<minute> */<everyHours> * * *". A JWT is renewed by
  # the first run after only a third of userJWTTTL is left, and that run
  # may start up to startingDeadlineSeconds late and run for up to
  # activeDeadlineSeconds, so the render fails unless userJWTTTL is more
  # than 3 x (everyHours + those two) (the default: 24h against 12h45m). A
  # run with nothing due is one KV read and one Transit signature and
  # writes nothing.
  refresh:
    everyHours: 4
    minute: 17
    startingDeadlineSeconds: 600
  # Emit the Argo CD hook annotations too.
  argoCDHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Control-plane box keys (docs/design/imas-payload-encryption-design.md,
# "Sealing the control plane", J.1; README.md "Control-plane box keys"):
# a post-install/post-upgrade hook Job (`farmer
# ensure-controlplane-box-keys`, farmer's image, its own ServiceAccount and
# OpenBao role) that creates the platform key and the SaaS API's box key
# in OpenBao KV v2, never in a Kubernetes Secret this chart renders, and
# publishes their public halves. Under farmer.openbao.tenantBox's
# kvMount/kvPath (<base>):
#   <base>/platform          platform keypair. Read by farmer's tenantbox
#                            role only.
#   <base>/saasapi-box       the SaaS API's box keypair. Read only by the
#                            SaaS API's External Secret
#                            (saasapi.controlPlaneBox); no farmer policy
#                            reaches it.
#   <base>/controlplane-pub  the public halves: farmer pins
#                            saasapi_box_pub, the SaaS API platform_pub.
# The Job may create and read the keypairs but never update them, so an
# upgrade can't replace a key. On by default since J.4 (rollout step 5):
# farmer opens and seals every internal.* message with these keys, and
# saasapi won't start without its half. With an external OpenBao
# (openbaoBootstrap off), its role and policy (imas-controlplane-box-keygen,
# rendered in the policies ConfigMap) must exist before install, or the
# hook fails the release. Turn it off only if you create the keys some
# other way (README). FLAG FOR SECURITY REVIEW.
# ---------------------------------------------------------------------------
controlPlaneBoxKeys:
  enabled: true
  # Fixed name: the OpenBao role's bound_service_account_names names it.
  serviceAccountName: imas-controlplane-box-keygen
  k8sRole: imas-controlplane-box-keygen
  # token auth: the Job's own Secret (empty: openbaoClient's).
  tokenSecretName: ""
  tokenSecretKey: cpbox-token
  argoCDHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Sprout release registration (API design §2.5, README.md "Sprout release
# registration"): a post-install/post-upgrade hook Job (`farmer
# register-sprout-release`, farmer's image) that POSTs the sprout release
# this chart carries (files/sprout-release.json: version, min_sprout_version
# from packaging/helm/min-sprout-version, packages; stamped at release time
# by packaging/helm/stamp-sprout-release.sh) to saasapi's operator plane. Renders only when that file is present AND
# saasapi.operator.enabled: a chart from a source checkout has no release
# to register, and NOTES says why it was skipped.
# A 200 (already registered, same contents) is success; a 409 (this
# version is registered with different contents) fails the release.
# FLAG FOR SECURITY REVIEW: the Job holds the operator token.
# ---------------------------------------------------------------------------
sproutRelease:
  # false: never register, even from a stamped chart with the operator
  # plane on (NOTES says so).
  register: true
  # Validated and logged by saasapi; not stored.
  channel: stable
  # Fixed name, no RBAC, no OpenBao role, no API token. Must not be any
  # other workload's ServiceAccount.
  serviceAccountName: imas-sprout-release-registrar
  # In-pod retries for an unreachable saasapi (still rolling out), 408,
  # 429 and 5xx, with exponential backoff. Any other answer is final.
  retry:
    attempts: 8
    initialDelaySeconds: 5
    maxDelaySeconds: 60
  # Per request.
  requestTimeoutSeconds: 600
  # Pod retries after the in-pod ones run out. A 409 or other refusal
  # fails the Job at once (podFailurePolicy), whatever this says.
  backoffLimit: 1
  # `helm install/upgrade --timeout` must be at least this long.
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 3600
  argoCDHooks: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# External Secrets Operator wiring (deploy/farmer/externalsecrets.yaml).
# Off by default: the eval install needs the seed Secret created by hand.
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  # Read-only ESO store for this namespace.
  secretStoreRef:
    kind: SecretStore
    name: openbao
  # Ops-written seed path (property per seed: lowercased NAME, e.g.
  # sys_user, saasapi_user; farmer's NKey is farmer_nkey). imas writes
  # one property of it only: valkey_password, Valkey's password, which
  # the OpenBao bootstrap Job generates when it is absent and never
  # overwrites (valkey.auth; docs/OPENBAO-RUNBOOK.md).
  seedPath: platform/imas/nats-seeds
  # The KV v2 mount the SecretStore reads seedPath from: where the
  # bootstrap Job writes valkey_password.
  seedMount: secret
  seedsRefreshInterval: 5m
  # saasapi's credential: seed from seedPath, JWT from
  # credentialPublisher.kvPath (field "jwt").
  saasapi:
    enabled: true
    # Short: this is the tail of the rotation window.
    refreshInterval: 1m

# ---------------------------------------------------------------------------
# OpenBao setup: a post-install/post-upgrade Job that enables Transit
# (imas-gateway-jwt), KV v2, PKI (tls.mode=openbao) and kubernetes auth,
# writes the policies in files/openbao-policies, creates one role per
# client, and creates the NATS trust (P21 slice 1):
#   prepare    (bao) the setup above, then mints one orphan, non-renewable
#              10-minute token for the ephemeral policy imas-nats-bootstrap
#              into a memory-backed volume.
#   nats-trust (farmer image, `farmer bootstrap-nats-trust`) creates the
#              three platform Transit keys, writes the trust ConfigMap
#              (natsTrust) and revokes that token.
#   bootstrap  (bao) the roles, revokes the handoff token by accessor,
#              deletes imas-nats-bootstrap, then revokes its own token
#              (revokeToken).
# Only with openbao.enabled. It never writes NATS seeds; with valkey.auth.enabled
# prepare also generates Valkey's password (property valkey_password of the
# seed path) when it is absent, never overwriting it (README.md, "Valkey").
# FLAG FOR SECURITY REVIEW: its token configures OpenBao, and the handoff
# token signs with the operator identity key.
# ---------------------------------------------------------------------------
openbaoBootstrap:
  enabled: true
  # Secret/key with a root token (from the recovery quorum; README.md,
  # "OpenBao bootstrap token"). Empty with openbao.server.dev.enabled: the
  # chart renders one holding the dev root token. The reference is
  # optional: without the Secret the Job configures nothing and only
  # checks that the trust ConfigMap is complete.
  tokenSecretName: ""
  tokenSecretKey: token
  # Revoke that token when done (`bao token revoke -self`), so no standing
  # admin is left (owner decision a). Never in dev mode. A later
  # policy or role change re-runs the Job with a fresh root token.
  revokeToken: true
  # Role token lifetimes.
  tokenTTL: 20m
  tokenMaxTTL: 1h
  # The nats chart's bus in openbao TLS mode: create its PKI role
  # (imas-farmerbus) and a Kubernetes auth role bound to its
  # ServiceAccount, so both charts share one CA.
  farmerbus:
    enabled: false
    serviceAccountName: ""
    # SANs its PKI role may issue. Empty: the bus Service's names.
    allowedNames: []
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# NetworkPolicies for farmer, saasapi and the Jobs.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # The nats chart's pods, for bus egress and farmer API ingress.
  # Full LabelSelectors, as in the nats chart.
  dmz:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: imas-dmz
    busPodSelector:
      matchLabels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: bus
    envoyPodSelector:
      matchLabels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: envoy
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Peers for each dependency when it is NOT bundled. Empty: any
  # destination, on that port only. Bundled ones are this namespace's pods.
  external:
    # The reference Job's peer (deploy/farmer/saasapi-credential-publish-job.yaml).
    openbao:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openbao
    openbaoPort: 8200
    pxc: []
    valkey: []
    valkeyPort: 6379
    # The Kubernetes API, for the bootstrap Job's nats-trust container
    # (it reads and writes the trust ConfigMap). cidrs: the API server's
    # addresses as ipBlock peers; empty: any destination, on these ports
    # only. Both ports by default: the kubernetes Service (443) is usually
    # translated to the API server's own port (often 6443) before the
    # policy applies.
    kubeApi:
      cidrs: []
      ports: [443, 6443]
    # The object store at objectStore.endpoint, on its port (443 or 80
    # with no port, per objectStore.useSSL), for both workloads: farmer
    # (recipes, staged recipes, job logs) whenever objectStore.endpoint is
    # set, and saasapi (recipe writes) with saasapi.recipes.enabled. Each
    # is a rule of its own, independent of farmerExtraEgress and
    # saasapiExtraEgress, so narrowing those keeps object storage working.
    # Empty: any destination, on that port only. Set it to the object
    # store's peers (namespaceSelector/podSelector, or ipBlock) to narrow
    # both rules.
    objectStore: []
  # saasapi's listener. Empty: anyone, on that port only.
  saasapiIngress:
    from: []
  # saasapi's operator listener (saasapi.operator). The sprout release
  # hook Job's pods always; these peers too (e.g. an operations bastion
  # for the revoke call). Empty: the hook Job only.
  saasapiOperatorIngress:
    from: []
  # Extra egress rules, added to the ones above. saasapi's default allows
  # HTTPS anywhere for the Keycloak JWKS fetch; narrow it to your Keycloak.
  # farmer's object store needs nothing here (external.objectStore).
  farmerExtraEgress: []
  saasapiExtraEgress:
    - ports:
        - { protocol: TCP, port: 443 }

# ---------------------------------------------------------------------------
# Subcharts. Everything under these keys is passed to the subchart as is.
# ---------------------------------------------------------------------------

# OpenBao (openbao/openbao-helm). Eval: dev mode, in-memory, unsealed,
# root token "root". Never use dev mode for anything real.
openbao:
  enabled: true
  injector:
    enabled: false
  server:
    dev:
      enabled: true
      devRootToken: root
    # openbaoClient/k8s auth uses the server's own token for TokenReview.
    authDelegator:
      enabled: true

# The Percona operator (percona/pxc-operator). Follows pxc.enabled; set
# pxc-operator.enabled=false if the cluster already runs one.
pxc-operator: {}

# PXC (percona/pxc-db, aliased). Eval-sized: one node, one HAProxy, no
# backups. For production use pxc.enabled=false and an operator-managed
# cluster sized per docs/design/imas-1m-scale-plan.md.
pxc:
  enabled: true
  unsafeFlags:
    pxcSize: true
    proxySize: true
  pxc:
    size: 1
    # Pinned here (the pxc-db 1.20.0 default), so an upgrade of the
    # subchart never changes the server version unannounced.
    image:
      repository: percona/percona-xtradb-cluster
      tag: 8.4.8-8.1
    persistence:
      size: 8Gi
  haproxy:
    enabled: true
    size: 1
  proxysql:
    enabled: false
  logcollector:
    enabled: false
  backup:
    enabled: false

# Valkey (valkey-io/valkey-helm 0.12.0): standalone, with a password and
# no eviction (unit S5; README.md, "Valkey"). The replay cache and the
# heartbeat keys in it are security state. The keys under valkey.* are
# also the subchart's values: auth.enabled, auth.usersExistingSecret,
# auth.aclUsers, tls.enabled and tls.existingSecret configure the bundled
# Valkey itself; addrs, auth.allowInsecure/secretName/key and
# tls.caConfigMap/caKey/serverName are this chart's. Restrict network
# access to it all the same.
valkey:
  enabled: true
  # External Valkey (valkey.enabled=false): host:port list for both
  # IMAS_VALKEY_ADDRS and SAASAPI_VALKEY_ADDRS. Must be the same Valkey:
  # saasapi reads the heartbeat keys farmer writes. Ignored when bundled.
  addrs: []
  dataStorage:
    enabled: false
  auth:
    # farmer and saasapi authenticate as ACL user "default" with the
    # password in Secret secretName (key key), mounted as the file
    # /var/run/secrets/imas/valkey/password (IMAS_VALKEY_PASSWORD_FILE,
    # SAASAPI_VALKEY_PASSWORD_FILE); never an env var, a value or a
    # ConfigMap. The password is generated by the OpenBao bootstrap Job
    # into externalSecrets.seedPath, property valkey_password, and synced
    # by ESO (externalSecrets.enabled) or by hand (README.md, "Valkey").
    # Rotation is a pod restart of farmer, saasapi and Valkey.
    enabled: true
    # false with enabled=false renders nothing: a Valkey without a
    # password lets anyone who reaches it replay or lock out sprouts.
    # For a throwaway install only.
    allowInsecure: false
    secretName: imas-valkey-auth
    key: password
    # The bundled Valkey (subchart) reads the same Secret. Keep these as
    # they are: the chart refuses anything else.
    usersExistingSecret: "{{ .Values.auth.secretName }}"
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  tls:
    # farmer and saasapi connect with TLS (1.2 or later), verifying the
    # server against the CA in ConfigMap caConfigMap (key caKey) only,
    # never the system roots, and against serverName (default: the host
    # dialled). Expected for a production (external) Valkey.
    enabled: false
    caConfigMap: ""
    caKey: ca.crt
    serverName: ""
    # Bundled Valkey only: its server certificate Secret (server.crt,
    # server.key, ca.crt). It then serves TLS on the same port, 6379.
    existingSecret: ""
  # The bundled Valkey must never evict keys: an evicted replay claim is
  # a replay, an evicted heartbeat a sprout shown offline. farmer and
  # saasapi warn at startup when a Valkey may evict (INFO memory).
  valkeyConfig: |
    maxmemory-policy noeviction
