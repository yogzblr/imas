# imas core chart: cmd/farmer + cmd/saasapi. See README.md.
#
# The defaults are a SELF-CONTAINED EVAL INSTALL: OpenBao (dev mode, in
# memory), a one-node PXC cluster and a standalone Valkey are deployed as
# subcharts. For production, turn each of openbao/pxc/valkey off and point
# openbaoClient, database and valkey.addrs at the real instances
# (ci/external-values.yaml is a worked example).

nameOverride: ""
fullnameOverride: ""
# Labels added to every resource this chart renders (not to subcharts').
commonLabels: {}
# Kubernetes cluster DNS domain, for the FQDNs this chart builds.
clusterDomain: cluster.local

# farmerorganization: the legacy tenant's ID. Must equal the nats chart's
# bus.organization and match ^[0-9A-Za-z_-]{1,191}$. farmer's built-in
# default "imas farmer" is not a valid tenant ID and stops it at boot.
organization: imas

# ---------------------------------------------------------------------------
# The DMZ bus (deploy/helm/nats). farmer and saasapi both dial it.
# ---------------------------------------------------------------------------
bus:
  # The nats chart's bus client Service and namespace:
  # <release>-nats-bus in the nats release's namespace. Required.
  serviceName: ""
  namespace: imas-dmz
  # The bus client port (the nats chart's bus.ports.client).
  port: 5406
  # IMAS_SPROUT_BUS_URLS: the externally reachable wss:// addresses of
  # the nats chart's Envoy that enrollment hands sprouts. Required: the
  # fallback farmer derives from its own interface is an in-cluster name
  # no sprout can reach.
  sproutBusURLs: []
  #   - wss://bus.imas.example.com:443/
  # CA that issued the bus's certificate, for saasapi (farmer uses its own
  # rootca; see tls). Set one of secretName/configMapName. Both empty:
  # tls.mode=secret uses tls.secretName's ca.crt, tls.mode=openbao fetches
  # the PKI mount's CA from OpenBao at pod start.
  ca:
    secretName: ""
    configMapName: ""
    key: ca.crt
  # farmerbustlsservername: the name farmer verifies the bus certificate
  # against. Empty (the default): the host of farmerbusurl, i.e. the bus
  # Service FQDN, which the nats chart's default SANs cover. Set it only
  # if the bus certificate carries a different name. saasapi always
  # verifies the FQDN it dials.
  tlsServerName: ""

# ---------------------------------------------------------------------------
# NATS NKey seeds. Never generated by this chart.
# ---------------------------------------------------------------------------
natsSeeds:
  # Existing Secret with the seeds (the one ESO syncs from OpenBao:
  # externalSecrets below, or deploy/farmer/externalsecrets.yaml). Must be
  # byte-identical to the one the nats chart mounts. Required.
  secretName: imas-farmer-nats-seeds
  mountPath: /var/run/secrets/imas/nats
  # NAME: secret key. Each becomes IMAS_NATS_<NAME>_SEED_FILE. All six are
  # required: without one, farmer generates its own on its PVC and splits
  # from the bus's trust chain (OPERATOR..TENANT_SIGNING), or from the
  # credential saasapi holds (SAASAPI_USER).
  seeds:
    OPERATOR: operator.nk
    OPERATOR_SIGNING: operator-signing.nk
    SYS_ACCOUNT: sys-account.nk
    TENANT: tenant.nk
    TENANT_SIGNING: tenant-signing.nk
    SAASAPI_USER: saasapi-user.nk
  # More NAME: key pairs, e.g. per-tenant Account seeds
  # (TENANT_T_8F2A: tenant-t-8f2a.nk).
  extraSeeds: {}

# ---------------------------------------------------------------------------
# farmer's TLS: its API certificate, and the root CA it verifies the bus
# with (config.RootCA). Bus and farmer must be issued from the same CA.
# ---------------------------------------------------------------------------
tls:
  # secret: tls.crt/tls.key/ca.crt from secretName (e.g. cert-manager).
  # openbao: issued from OpenBao PKI at every start (IMAS_CERTS_OPENBAO_*).
  mode: openbao
  secretName: imas-farmer-tls
  # SANs requested in openbao mode. Empty: the farmer Service's names.
  certHosts: []
  openbao:
    pkiMount: pki
    # PKI role (IMAS_CERTS_OPENBAO_ROLE).
    role: imas-farmer
    # Kubernetes auth role this client logs in with.
    k8sRole: imas-farmer-certs
    # token auth only: key in openbaoClient.tokenSecretName.
    tokenSecretKey: certs-token

# ---------------------------------------------------------------------------
# How farmer, saasapi and the publish Job reach OpenBao. One address and
# auth method; each client logs in with its own role and gets only its
# own policy (never share a role between identities).
# ---------------------------------------------------------------------------
openbaoClient:
  # Empty with openbao.enabled: this release's OpenBao Service. Required
  # otherwise.
  addr: ""
  # ConfigMap holding OpenBao's CA as caKey (*_OPENBAO_CACERT). Empty uses
  # the system roots (and plain http for the eval OpenBao).
  caConfigMap: ""
  caKey: ca.crt
  # kubernetes (projected ServiceAccount token, 10-minute expiry) or token.
  authMethod: kubernetes
  k8sMount: kubernetes
  # Audience of the projected token; every role's `audience` must match.
  k8sAudience: openbao
  # token auth: Secret holding one token per client (the *.tokenSecretKey
  # values). Never put farmer's and the publisher's tokens in one Secret
  # that farmer's pod mounts.
  tokenSecretName: ""

# The bao CLI image: runs the OpenBao bootstrap Job, and fetches the bus CA
# for saasapi in tls.mode=openbao. Keep it at the subchart's server version.
openbaoTools:
  image:
    repository: quay.io/openbao/openbao
    tag: "2.6.3"
    digest: ""
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# PXC. farmer owns the farmer schema, saasapi the saas schema; each reads
# the other's (docs/design/cloudxp-machine-manager-api-design.md §5.1).
# ---------------------------------------------------------------------------
database:
  # Empty with pxc.enabled: this release's HAProxy Service. Required
  # otherwise.
  host: ""
  port: 3306
  # go-sql-driver DSN parameters, shared by both DSNs.
  params: "parseTime=true&charset=utf8mb4&loc=UTC"
  farmer:
    name: farmer
    user: farmer_svc
  saasapi:
    name: saas
    user: saas_svc
  # External PXC: an existing Secret holding both full DSNs
  # (user:pass@tcp(host:port)/db?params). Required when pxc.enabled=false.
  # With pxc.enabled the chart generates one (random passwords, kept
  # across upgrades) unless this is set.
  existingSecret: ""
  existingSecretKeys:
    farmerDSN: farmer-dsn
    saasapiDSN: saasapi-dsn
  # cmd/migrate, as Helm hook Jobs (README.md, "Migrations"). `migrate up`
  # on install (post-install with pxc.enabled, pre-install otherwise) and
  # on pre-upgrade; `migrate check` on pre-rollback. farmer and saasapi
  # don't migrate their own schemas: they wait for the version they need.
  # FLAG FOR SECURITY REVIEW: the `up` pod holds PXC's root password.
  migrate:
    image:
      repository: ghcr.io/yogzblr/imas-migrate
      # Empty: the chart's appVersion. Keep it at farmer's and saasapi's
      # version: the migrations are compiled into the binary.
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    # Secret/key with PXC root's password, mounted in the `up` pod only.
    # Empty with pxc.enabled: the operator's <cluster>-secrets (or
    # pxc.pxc.clusterSecretName). Empty with an external PXC: the root
    # step is skipped (--skip-root), and the schemas, users, §4.1 grants
    # and farmer's enrollment_keys column grant are ops' job.
    rootPasswordSecret: ""
    rootPasswordKey: root
    rootUser: root
    # How long cmd/migrate waits for PXC (--wait). Covers the bundled
    # cluster coming up on first install.
    wait: 15m
    backoffLimit: 2
    # Overall budget: PXC coming up, another run's migration lock, the
    # migrations themselves. `helm install/upgrade --timeout` must be at
    # least this long, or Helm gives up on the hook first.
    activeDeadlineSeconds: 1800
    # Emit Argo CD hook annotations (Sync with the bundled PXC, PreSync
    # with an external one) instead of letting Argo CD map Helm's.
    argoCDHooks: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Object storage for recipes and job logs (not bundled). farmer starts
# without it; recipe and job requests fail until it's reachable.
# ---------------------------------------------------------------------------
objectStore:
  endpoint: ""
  useSSL: true
  bucket: ""
  # Must differ from bucket: GET /files/ serves every key in the recipe
  # bucket to any authenticated caller.
  jobBucket: ""
  # Secret with the access key pair (IMAS_S3_ACCESS_KEY_ID/_SECRET_ACCESS_KEY).
  credentialsSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

# ---------------------------------------------------------------------------
# farmer (cmd/farmer)
# ---------------------------------------------------------------------------
farmer:
  image:
    repository: ghcr.io/yogzblr/imas-farmer
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Held at 1: FarmerPKI (NATS JWTs, the SaaS API credential's rotation
  # state, farmer's NKey) lives on one ReadWriteOnce volume. See README.md.
  replicaCount: 1
  logLevel: info
  apiPort: 5405
  # Admin NKey public keys (pubkeys.admin in /etc/imas/farmer).
  adminPubKeys: []
  # gatewayjwtttl. Keep equal to the nats chart's
  # envoy.refreshRateLimit.gatewayJwtTtlSeconds.
  gatewayJWTTTL: 24h
  # IMAS_JOB_RECONCILE_WINDOW (deploy/farmer/values.job-reconcile.yaml).
  # A quoted Go duration; null or "" emits nothing (every job recorded).
  jobs:
    reconcileWindow: "2h"
  # Recipe template render limits (IMAS_RECIPE_*; internal/cook's
  # "Bounded work"). Recipes are tenant-written, untrusted input, so every
  # render is capped. All five are required: sizes and iterations are
  # positive whole numbers, renderTimeout a quoted Go duration. Farmer
  # refuses to start if one is out of range (sizes up to 64 MiB, time up
  # to 1m, iterations up to 10000000, maxValueBytes <= maxRenderedBytes).
  # The SaaS API's recipe upload should validate with the same values.
  recipes:
    templateLimits:
      # A recipe's source, checked on read and before parsing.
      maxSourceBytes: 262144
      # One render's output.
      maxRenderedBytes: 1048576
      # Any one string a template function returns.
      maxValueBytes: 262144
      # One recipe's template execution.
      renderTimeout: "2s"
      # Total iterations of every range in one render.
      maxRangeIterations: 10000
  # IMAS_SELF_UPDATE_ENABLED: farmer's own switch for self_update on
  # internal.sprout.action (security review 2026-10, L1), independent of
  # saasapi.fleetUpdateDispatch.enabled. Off, farmer refuses every
  # self_update, so a forged request can't start an update. Leave it off
  # until the security review and the release UAT gate are done
  # (docs/BUILD-STATUS.md); a rollout needs both switches on.
  selfUpdate:
    enabled: false
  # internal.sprout.action concurrency per farmer replica (security review
  # M5). cmd.run and cook share one pool; self_update has a pool of its
  # own, so rollouts can't be starved; within each pool one tenant holds
  # at most tenantConcurrency slots. A request that doesn't fit is refused
  # at once (farmer_busy) and saasapi sends it again; nothing queues.
  # Positive integers up to 1024; null emits no env var (farmer's default).
  sproutActions:
    # IMAS_SPROUT_ACTION_CONCURRENCY.
    concurrency: 64
    # IMAS_SELF_UPDATE_CONCURRENCY.
    selfUpdateConcurrency: 16
    # IMAS_SPROUT_ACTION_TENANT_CONCURRENCY.
    tenantConcurrency: 8
  # OpenBao clients inside farmer, one role each.
  openbao:
    # Gateway JWT signer (Transit sign on exactly this key).
    gateway:
      transitMount: transit
      keyName: imas-gateway-jwt
      k8sRole: imas-farmer-gateway
      tokenSecretKey: gateway-token
    # Read-only view of the fleet signing key (imas-fleet-verify.hcl).
    fleetSign:
      transitMount: transit
      keyName: imas-fleet-signing
      k8sRole: imas-farmer-fleet-verify
      tokenSecretKey: farmer-fleetsign-token
    # Tenant X25519 keypairs in KV v2: one secret per tenant at
    # <kvMount>/data/<kvPath>/tenants/<tenant_id>. Nothing is read or
    # written at <kvPath> itself; there is no shared keypair.
    tenantBox:
      kvMount: secret
      kvPath: imas/tenant-x25519
      k8sRole: imas-farmer-tenantbox
      tokenSecretKey: tenantbox-token
  # Extra /etc/imas/farmer keys. Chart-managed keys win.
  extraConfig: {}
  # Never put a raw IMAS_NATS_*_SEED or any IMAS_SAASAPI_CRED_OPENBAO_* here.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  persistence:
    # FarmerPKI and audit logs. Off uses emptyDir: every restart then
    # mints a fresh farmer NKey and loses the SaaS API credential's
    # rotation state. Eval only.
    enabled: true
    existingClaim: ""
    size: 1Gi
    storageClassName: ""
    accessModes: [ReadWriteOnce]
    # helm.sh/resource-policy: keep, so an uninstall can't delete FarmerPKI.
    keep: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  terminationGracePeriodSeconds: 60
  startupProbe:
    httpGet: { path: /health, port: api, scheme: HTTPS }
    periodSeconds: 5
    failureThreshold: 60
  # /ready: PXC, Valkey and the legacy tenant's bus connection.
  readinessProbe:
    httpGet: { path: /ready, port: api, scheme: HTTPS }
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet: { path: /health, port: api, scheme: HTTPS }
    periodSeconds: 20
    timeoutSeconds: 5
  # Reloader rolls farmer when the seed Secret changes (the rotation
  # runbook in deploy/farmer/README.md depends on it).
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  service:
    type: ClusterIP
    annotations: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# ---------------------------------------------------------------------------
# saasapi (cmd/saasapi)
# ---------------------------------------------------------------------------
saasapi:
  enabled: true
  image:
    repository: ghcr.io/yogzblr/imas-saasapi
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  command: []
  args: []
  replicaCount: 2
  port: 8081
  # Layer-2 auth: the Keycloak realm whose end-user JWTs the BFF forwards.
  # All three are required (saasapi refuses to start without them).
  jwt:
    keycloakJWKSURL: ""
    issuer: ""
    audience: ""
  # Layer-1 auth: the BFF's shared secret (INTERNAL_AUTH_SECRET_CURRENT,
  # and _PREVIOUS during a rotation). Existing Secret, required.
  internalAuthSecret:
    secretName: imas-saasapi-internal-auth
    currentKey: current
    previousKey: previous
  # saasapi's NATS identity: its seed and the JWT the publish Job writes to
  # OpenBao, delivered by ESO (externalSecrets.saasapi) as this Secret.
  natsCredentials:
    secretName: imas-saasapi-nats
    seedKey: nats-user.nk
    jwtKey: SAASAPI_NATS_USER_JWT
  # POST .../sprouts/updates. The sprout-side update path is built, but
  # leave this off until the security review and the release UAT gate are
  # done (docs/BUILD-STATUS.md). On needs the fleetSign client below, and
  # farmer.selfUpdate.enabled, or farmer refuses every update.
  fleetUpdateDispatch:
    enabled: false
    # SAASAPI_FLEET_UPDATE_CLOCK_SKEW: how far saasapi's and farmer's
    # clocks may differ when a wave checks that a sprout's report postdates
    # its update (a Go duration, above 0 and at most 5m). Empty keeps
    # saasapi's default, 30s. Widen only for nodes without NTP.
    clockSkew: ""
  # internal.sprout.action dispatch concurrency per saasapi replica
  # (internal/saasapi/dispatch_limits.go; security review M5): a
  # cmd.run/cook pool, a pool reserved for rollout waves, and one tenant's
  # cap in each, which must be at most half of concurrency (saasapi
  # refuses to start otherwise). Keep each at or below farmer's
  # farmer.sproutActions value times farmer's replicas. Positive integers
  # up to 1024; null emits no env var (saasapi's default).
  actionDispatch:
    # SAASAPI_ACTION_DISPATCH_CONCURRENCY.
    concurrency: 64
    # SAASAPI_SELF_UPDATE_DISPATCH_CONCURRENCY.
    selfUpdateConcurrency: 16
    # SAASAPI_ACTION_DISPATCH_TENANT_CONCURRENCY.
    tenantConcurrency: 8
  # The outbox sweeper (internal/saasapi/sweeper.go, CL.3): re-publishes
  # tenant provisioning jobs left pending, re-sends §1.5 action items left
  # queued (never ones already sent), and resumes update rollouts whose pod
  # died (only with fleetUpdateDispatch on). Safe on every replica: work is
  # claimed with a row lease in the saas schema. Empty or null keeps
  # saasapi's default and emits no env var. Durations are Go durations.
  outboxSweeper:
    # SAASAPI_OUTBOX_SWEEPER_ENABLED.
    enabled: true
    # SAASAPI_OUTBOX_SWEEP_INTERVAL: default 30s, 1s..1h.
    interval: ""
    # SAASAPI_OUTBOX_PROVISIONING_STALE_AFTER: a pending provisioning job is
    # published again this long after its last publish, doubling per
    # attempt. Default 2m, 10s..24h.
    provisioningStaleAfter: ""
    # SAASAPI_OUTBOX_ACTION_STALE_AFTER: the same for a queued action item.
    # Default 2m, 10s..24h.
    actionStaleAfter: ""
    # SAASAPI_OUTBOX_ACTION_MAX_AGE: a queued action item not sent this long
    # after it was accepted fails as expired_not_sent instead of being sent
    # late. Default 15m, 1m..1h.
    actionMaxAge: ""
    # SAASAPI_OUTBOX_MAX_ATTEMPTS: dispatches before a job or item is
    # failed. Default 5, 1..50.
    maxAttempts: null
    # SAASAPI_OUTBOX_LEASE_TTL: how soon a dead pod's batch or rollout is
    # taken over. Default 2m, 15s..1h.
    leaseTTL: ""
  # The operator plane (internal/saasapi NewOperatorServer, API design
  # §2.5): sprout release registration and revoke, on its own HTTPS
  # listener and its own Service (<release>-saasapi-operator), never the
  # one the gateway routes to. The sprout release hook Job (sproutRelease
  # below) is its only in-cluster caller. On also turns on the fleetSign
  # client below. NOTE: cmd/saasapi does not start this listener yet
  # (README.md, "Known gaps"); leave it off until it does.
  # FLAG FOR SECURITY REVIEW: the operator token can get any well-formed
  # release above fleetreleaser's floor signed.
  operator:
    enabled: false
    port: 8443
    # kubernetes.io/tls Secret: tls.crt/tls.key for the listener, and
    # ca.crt, which the hook Job verifies the listener with (it mounts only
    # that key). SANs: the operator Service's FQDN (NOTES prints it).
    tls:
      secretName: ""
    # Existing Secret with the operator bearer token (at least 32
    # characters, no whitespace): SAASAPI_OPERATOR_TOKEN_FILE, and the
    # token the hook Job presents. A Secret of its own. previousKey: set
    # only during a rotation (SAASAPI_OPERATOR_TOKEN_PREVIOUS_FILE; README,
    # "Rotating the operator token").
    token:
      secretName: ""
      currentKey: current
      previousKey: ""
    # cmd/fleetreleaser, the only signer (deploy/fleetreleaser/README.md).
    fleetReleaser:
      # SAASAPI_FLEETRELEASER_URL: https://host[:port], no path.
      url: ""
      # SAASAPI_FLEETRELEASER_TOKEN_FILE: the caller token saasapi presents.
      tokenSecretName: ""
      tokenKey: token
      # Optional ConfigMap with fleetreleaser's CA (system roots otherwise).
      caConfigMap: ""
      caKey: ca.crt
    service:
      annotations: {}
  openbao:
    fleetSign:
      transitMount: transit
      keyName: imas-fleet-signing
      k8sRole: imas-saasapi-fleet-verify
      tokenSecretKey: saasapi-fleetsign-token
  # deploy/saasapi/values.rate-limit.yaml. null emits no env var (the
  # compiled-in default).
  enrollmentKeys:
    rateLimit:
      # Sustained POST .../enrollment-keys per second, per tenant; > 0.
      perSecond: 1
      # Back-to-back requests before perSecond applies; whole number >= 1.
      burst: 5
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
  terminationGracePeriodSeconds: 30
  # saasapi has no unauthenticated route, so TCP.
  readinessProbe:
    tcpSocket: { port: http }
    periodSeconds: 10
  livenessProbe:
    tcpSocket: { port: http }
    periodSeconds: 20
  # Reloader rolls saasapi when its NATS credential or auth secret changes.
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  pdb:
    enabled: true
    maxUnavailable: 1

# ---------------------------------------------------------------------------
# `farmer publish-saasapi-credential` (deploy/farmer/
# saasapi-credential-publish-job.yaml): a post-install/post-upgrade hook
# that writes saasapi's NATS User JWT to OpenBao KV v2.
# FLAG FOR SECURITY REVIEW: its ServiceAccount is the only identity that
# may log in to the KV-write role. See README.md.
# ---------------------------------------------------------------------------
credentialPublisher:
  enabled: true
  # Fixed name: the OpenBao role's bound_service_account_names names it.
  serviceAccountName: imas-saasapi-cred-publisher
  k8sRole: imas-saasapi-cred-publisher
  # token auth: the publisher's own Secret (empty: openbaoClient's). Keep
  # it apart from farmer's tokens.
  tokenSecretName: ""
  tokenSecretKey: publisher-token
  kvMount: secret
  # Its own path. Neither it nor externalSecrets.seedPath may be a prefix
  # of the other.
  kvPath: platform/imas/saasapi-nats-user
  # Emit the Argo CD hook annotations too.
  argoCDHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Control-plane box keys (docs/design/imas-payload-encryption-design.md,
# "Sealing the control plane", J.1; README.md "Control-plane box keys"):
# a post-install/post-upgrade hook Job (`farmer
# ensure-controlplane-box-keys`, farmer's image, its own ServiceAccount and
# OpenBao role) that creates the platform key and the SaaS API's box key
# in OpenBao KV v2, never in a Kubernetes Secret this chart renders, and
# publishes their public halves. Under farmer.openbao.tenantBox's
# kvMount/kvPath (<base>):
#   <base>/platform          platform keypair. Read by farmer's tenantbox
#                            role only.
#   <base>/saasapi-box       the SaaS API's box keypair. Read only by the
#                            SaaS API's External Secret (rollout step 5);
#                            no farmer policy reaches it.
#   <base>/controlplane-pub  the public halves: farmer pins
#                            saasapi_box_pub, the SaaS API platform_pub.
# The Job may create and read the keypairs but never update them, so an
# upgrade can't replace a key. Keep it off until cmd/farmer dispatches the
# subcommand (not in J.1's file scope): with it off nothing uses these
# keys yet. FLAG FOR SECURITY REVIEW.
# ---------------------------------------------------------------------------
controlPlaneBoxKeys:
  enabled: false
  # Fixed name: the OpenBao role's bound_service_account_names names it.
  serviceAccountName: imas-controlplane-box-keygen
  k8sRole: imas-controlplane-box-keygen
  # token auth: the Job's own Secret (empty: openbaoClient's).
  tokenSecretName: ""
  tokenSecretKey: cpbox-token
  argoCDHooks: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# Sprout release registration (API design §2.5, README.md "Sprout release
# registration"): a post-install/post-upgrade hook Job (`farmer
# register-sprout-release`, farmer's image) that POSTs the sprout release
# this chart carries (files/sprout-release.json: version, min_sprout_version
# from packaging/helm/min-sprout-version, packages; stamped at release time
# by packaging/helm/stamp-sprout-release.sh) to saasapi's operator plane. Renders only when that file is present AND
# saasapi.operator.enabled: a chart from a source checkout has no release
# to register, and NOTES says why it was skipped.
# A 200 (already registered, same contents) is success; a 409 (this
# version is registered with different contents) fails the release.
# FLAG FOR SECURITY REVIEW: the Job holds the operator token.
# ---------------------------------------------------------------------------
sproutRelease:
  # false: never register, even from a stamped chart with the operator
  # plane on (NOTES says so).
  register: true
  # Validated and logged by saasapi; not stored.
  channel: stable
  # Fixed name, no RBAC, no OpenBao role, no API token. Must not be any
  # other workload's ServiceAccount.
  serviceAccountName: imas-sprout-release-registrar
  # In-pod retries for an unreachable saasapi (still rolling out), 408,
  # 429 and 5xx, with exponential backoff. Any other answer is final.
  retry:
    attempts: 8
    initialDelaySeconds: 5
    maxDelaySeconds: 60
  # Per request. One registration makes up to 16 fleetreleaser calls.
  requestTimeoutSeconds: 600
  # Pod retries after the in-pod ones run out. A 409 or other refusal
  # fails the Job at once (podFailurePolicy), whatever this says.
  backoffLimit: 1
  # `helm install/upgrade --timeout` must be at least this long.
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 3600
  argoCDHooks: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# External Secrets Operator wiring (deploy/farmer/externalsecrets.yaml).
# Off by default: the eval install needs the seed Secret created by hand.
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  # Read-only ESO store for this namespace.
  secretStoreRef:
    kind: SecretStore
    name: openbao
  # Ops-written seed path (property per seed: lowercased NAME, e.g.
  # sys_account, saasapi_user). Written by nothing in imas.
  seedPath: platform/imas/nats-seeds
  seedsRefreshInterval: 5m
  # saasapi's credential: seed from seedPath, JWT from
  # credentialPublisher.kvPath (field "jwt").
  saasapi:
    enabled: true
    # Short: this is the tail of the rotation window.
    refreshInterval: 1m

# ---------------------------------------------------------------------------
# Eval OpenBao setup: a post-install/post-upgrade Job that enables Transit
# (imas-gateway-jwt, imas-fleet-signing), KV v2, PKI (tls.mode=openbao)
# and kubernetes auth, writes the policies in files/openbao-policies and
# creates one role per client. Only with openbao.enabled. It never writes
# NATS seeds.
# ---------------------------------------------------------------------------
openbaoBootstrap:
  enabled: true
  # Secret/key with a token allowed to configure OpenBao. Empty with
  # openbao.server.dev.enabled: the chart renders one holding the dev
  # root token.
  tokenSecretName: ""
  tokenSecretKey: token
  # Role token lifetimes.
  tokenTTL: 20m
  tokenMaxTTL: 1h
  # The nats chart's bus in openbao TLS mode: create its PKI role
  # (imas-farmerbus) and a Kubernetes auth role bound to its
  # ServiceAccount, so both charts share one CA.
  farmerbus:
    enabled: false
    serviceAccountName: ""
    # SANs its PKI role may issue. Empty: the bus Service's names.
    allowedNames: []
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ---------------------------------------------------------------------------
# NetworkPolicies for farmer, saasapi and the Jobs.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # The nats chart's pods, for bus egress and farmer API ingress.
  # Full LabelSelectors, as in the nats chart.
  dmz:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: imas-dmz
    busPodSelector:
      matchLabels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: bus
    envoyPodSelector:
      matchLabels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: envoy
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Peers for each dependency when it is NOT bundled. Empty: any
  # destination, on that port only. Bundled ones are this namespace's pods.
  external:
    # The reference Job's peer (deploy/farmer/saasapi-credential-publish-job.yaml).
    openbao:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openbao
    openbaoPort: 8200
    pxc: []
    valkey: []
    valkeyPort: 6379
  # saasapi's listener. Empty: anyone, on that port only.
  saasapiIngress:
    from: []
  # saasapi's operator listener (saasapi.operator). The sprout release
  # hook Job's pods always; these peers too (e.g. an operations bastion
  # for the revoke call). Empty: the hook Job only.
  saasapiOperatorIngress:
    from: []
  # saasapi -> cmd/fleetreleaser, on saasapi.operator.fleetReleaser.url's
  # port. Empty: any destination, on that port only.
  fleetreleaser:
    to: []
  # Extra egress rules. saasapi's default allows HTTPS anywhere for the
  # Keycloak JWKS fetch; narrow it to your Keycloak.
  farmerExtraEgress: []
  saasapiExtraEgress:
    - ports:
        - { protocol: TCP, port: 443 }

# ---------------------------------------------------------------------------
# Subcharts. Everything under these keys is passed to the subchart as is.
# ---------------------------------------------------------------------------

# OpenBao (openbao/openbao-helm). Eval: dev mode, in-memory, unsealed,
# root token "root". Never use dev mode for anything real.
openbao:
  enabled: true
  injector:
    enabled: false
  server:
    dev:
      enabled: true
      devRootToken: root
    # openbaoClient/k8s auth uses the server's own token for TokenReview.
    authDelegator:
      enabled: true

# The Percona operator (percona/pxc-operator). Follows pxc.enabled; set
# pxc-operator.enabled=false if the cluster already runs one.
pxc-operator: {}

# PXC (percona/pxc-db, aliased). Eval-sized: one node, one HAProxy, no
# backups. For production use pxc.enabled=false and an operator-managed
# cluster sized per docs/design/imas-1m-scale-plan.md.
pxc:
  enabled: true
  unsafeFlags:
    pxcSize: true
    proxySize: true
  pxc:
    size: 1
    # Pinned here (the pxc-db 1.20.0 default), so an upgrade of the
    # subchart never changes the server version unannounced.
    image:
      repository: percona/percona-xtradb-cluster
      tag: 8.4.8-8.1
    persistence:
      size: 8Gi
  haproxy:
    enabled: true
    size: 1
  proxysql:
    enabled: false
  logcollector:
    enabled: false
  backup:
    enabled: false

# Valkey (valkey-io/valkey-helm): standalone, no auth or TLS, matching
# farmer's and saasapi's Valkey clients. Restrict network access to it.
valkey:
  enabled: true
  # External Valkey (valkey.enabled=false): host:port list for both
  # IMAS_VALKEY_ADDRS and SAASAPI_VALKEY_ADDRS. Must be the same Valkey:
  # saasapi reads the heartbeat keys farmer writes. Ignored when bundled.
  addrs: []
  dataStorage:
    enabled: false
