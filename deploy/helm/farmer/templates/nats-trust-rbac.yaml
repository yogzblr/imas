{{- if and .Values.openbao.enabled .Values.openbaoBootstrap.enabled }}
{{- include "imas-farmer.validate" . -}}
{{- $name := printf "%s-openbao-bootstrap" (include "imas-farmer.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- /*
The OpenBao bootstrap Job's Kubernetes identity (P21 slice 1 brief §4.4):
its nats-trust container (`farmer bootstrap-nats-trust`) reads and writes
the public trust ConfigMap natsTrust.configMapName in this namespace and,
when the Job sets up PKI, the public bus CA ConfigMap
natsTrust.busCAConfigMapName (unit S1), and nothing else. "create" can't
be limited by resourceNames (the object has no name until it exists), so
it covers any ConfigMap in the namespace; get, update and patch are
limited to those ConfigMaps. No Secrets, no other kinds, no cluster
scope. The token is projected into nats-trust alone
(openbao-bootstrap-job.yaml, kube-api volume).
FLAG FOR SECURITY REVIEW.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao-bootstrap
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao-bootstrap
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ .Values.natsTrust.configMapName | quote }}
      {{- if include "imas-farmer.bootstrap.needPKI" . }}
      - {{ .Values.natsTrust.busCAConfigMapName | quote }}
      {{- end }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
