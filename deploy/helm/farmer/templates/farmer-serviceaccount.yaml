{{- if .Values.farmer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "imas-farmer.farmer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: farmer
  {{- with .Values.farmer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC: farmer needs no Kubernetes API access. Its OpenBao logins use
# an audience-scoped projected token (see the Deployment). It must never
# be bound to the imas-saasapi-cred-publisher OpenBao role.
automountServiceAccountToken: false
{{- end }}
