{{- if and .Values.pxc.enabled (not .Values.database.existingSecret) }}
{{- include "imas-farmer.validate" . -}}
{{- $name := printf "%s-db" (include "imas-farmer.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if $existing }}{{- $old = $existing.data -}}{{- end -}}
{{- /* Alphanumeric only: they go into DSNs and SQL string literals. */ -}}
{{- $farmerPw := ternary (index $old "farmer-password" | default "" | b64dec) (randAlphaNum 32) (hasKey $old "farmer-password") -}}
{{- $saasPw := ternary (index $old "saasapi-password" | default "" | b64dec) (randAlphaNum 32) (hasKey $old "saasapi-password") -}}
{{- $db := .Values.database -}}
{{- $host := printf "%s:%v" (include "imas-farmer.dbHost" .) $db.port -}}
# Credentials for the PXC this release deploys: generated once, kept
# across upgrades (lookup), applied by the migrate Job. With an
# external PXC, database.existingSecret replaces this.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  farmer-password: {{ $farmerPw | quote }}
  saasapi-password: {{ $saasPw | quote }}
  {{ $db.existingSecretKeys.farmerDSN }}: {{ printf "%s:%s@tcp(%s)/%s?%s" $db.farmer.user $farmerPw $host $db.farmer.name $db.params | quote }}
  {{ $db.existingSecretKeys.saasapiDSN }}: {{ printf "%s:%s@tcp(%s)/%s?%s" $db.saasapi.user $saasPw $host $db.saasapi.name $db.params | quote }}
{{- end }}
