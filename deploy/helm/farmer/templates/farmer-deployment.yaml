{{- include "imas-farmer.validate" . -}}
{{- $seeds := fromYaml (include "imas-farmer.seeds" .) -}}
{{- $tlsDir := include "imas-farmer.tlsDir" . -}}
{{- $ob := .Values.farmer.openbao -}}
{{- $os := .Values.objectStore -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imas-farmer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: farmer
spec:
  # Stateless (README.md, "Farmer is stateless"): replicas share PXC,
  # Valkey, OpenBao and the object store. One new pod at a time, and no
  # old one goes before its replacement is ready.
  replicas: {{ .Values.farmer.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "imas-farmer.farmer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "imas-farmer.labels" . | nindent 8 }}
        app.kubernetes.io/component: farmer
        {{- with .Values.farmer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/farmer-configmap.yaml") . | sha256sum }}
        {{- with .Values.farmer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "imas-farmer.farmer.serviceAccountName" . }}
      automountServiceAccountToken: false
      # config.LoadConfig folds every env var into the config; don't let
      # Kubernetes inject one per Service in the namespace.
      enableServiceLinks: false
      {{- with .Values.farmer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.farmer.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.farmer.terminationGracePeriodSeconds }}
      {{- with .Values.farmer.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.farmer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.farmer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.farmer.affinity }}
        {{- toYaml .Values.farmer.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "imas-farmer.farmer.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.farmer.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: farmer
          image: {{ include "imas-farmer.farmer.image" . | quote }}
          imagePullPolicy: {{ .Values.farmer.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.farmer.apiPort }}
              protocol: TCP
          env:
            # User seeds (SYS_USER, SAASAPI_USER): one
            # IMAS_NATS_<NAME>_SEED_FILE per mounted key, the _FILE form
            # only (deploy/farmer/farmer-deployment-nats-seeds.patch.yaml).
            # The trust chain keys are Transit keys (IMAS_NATSSIGN_* below)
            # and have no seed.
            {{- range $name, $key := $seeds }}
            - name: IMAS_NATS_{{ $name }}_SEED_FILE
              value: {{ printf "%s/%s" $.Values.natsSeeds.mountPath $key | quote }}
            {{- end }}
            # farmer's NKey: the same seed in every replica, from its own
            # Secret (farmer.nkeySecret); farmer never generates one.
            - name: IMAS_FARMER_NKEY_SEED_FILE
              value: {{ printf "%s/%s" .Values.farmer.nkeySecret.mountPath .Values.farmer.nkeySecret.key | quote }}
            # Deliberately absent: every IMAS_SAASAPI_CRED_OPENBAO_* var.
            # farmer's long-running process must never be configured with
            # (or able to log in as) the KV-write identity.
            - name: IMAS_PXC_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imas-farmer.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretKeys.farmerDSN }}
            {{- with include "imas-farmer.valkeyAddrs" . }}
            - name: IMAS_VALKEY_ADDRS
              value: {{ . | quote }}
            {{- end }}
            {{- /* objectStore.endpoint, or the Versity Gateway's Service
            (versity.enabled), which the accounts bucket falls back to
            too when accountStore.endpoint is empty. */}}
            {{- with include "imas-farmer.s3Endpoint" . }}
            - name: IMAS_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $os.bucket }}
            - name: IMAS_S3_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- with $os.jobBucket }}
            - name: IMAS_S3_JOB_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- with $os.sproutJWTBucket }}
            # Sprout User JWTs (internal/pki MintOrReuseUserJWT); private.
            - name: IMAS_S3_SPROUT_JWT_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- if $os.credentialsSecret }}
            - name: IMAS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $os.credentialsSecret }}
                  key: {{ $os.accessKeyIdKey }}
            - name: IMAS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $os.credentialsSecret }}
                  key: {{ $os.secretAccessKeyKey }}
            {{- end }}
            {{- $acc := .Values.accountStore }}
            # The accounts bucket (accountStore): farmer's own write
            # credential, separate from IMAS_S3_*.
            - name: IMAS_ACCOUNTS_S3_BUCKET
              value: {{ $acc.bucket | quote }}
            {{- if include "imas-farmer.accountsUseVersity" . }}
            # The Versity Gateway's Service (versity.enabled), plain HTTP.
            - name: IMAS_ACCOUNTS_S3_ENDPOINT
              value: {{ include "imas-farmer.versity.endpoint" . | quote }}
            - name: IMAS_ACCOUNTS_S3_USE_SSL
              value: "false"
            {{- else }}
            {{- with $acc.endpoint }}
            - name: IMAS_ACCOUNTS_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $acc.useSSL) }}
            - name: IMAS_ACCOUNTS_S3_USE_SSL
              value: {{ $acc.useSSL | toString | quote }}
            {{- end }}
            {{- end }}
            - name: IMAS_ACCOUNTS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $acc.credentialsSecret }}
                  key: {{ $acc.accessKeyIdKey }}
            - name: IMAS_ACCOUNTS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $acc.credentialsSecret }}
                  key: {{ $acc.secretAccessKeyKey }}
            {{- with $acc.eventSubject }}
            - name: IMAS_ACCOUNTS_EVENT_SUBJECT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bus.expectedNodes }}
            - name: IMAS_BUS_EXPECTED_NODES
              value: {{ . | toString | quote }}
            {{- end }}
            {{- /* deploy/farmer/deployment.env.job-reconcile.yaml: absent,
            null or "" emits nothing; the type is checked in validate. */}}
            {{- with .Values.farmer.jobs.reconcileWindow }}
            - name: IMAS_JOB_RECONCILE_WINDOW
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.farmer.jobs.leaseTTL }}
            - name: IMAS_JOB_LEASE_TTL
              value: {{ . | quote }}
            {{- end }}
            # Per-tenant bus connections: idle close (owner decision 3 of
            # docs/briefs/P21-slice3-farmer-saasapi-state.md).
            {{- with .Values.farmer.tenantConnections }}
            {{- with .idleTTL }}
            - name: IMAS_TENANT_CONN_IDLE_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .heartbeatWindow }}
            - name: IMAS_TENANT_CONN_HEARTBEAT_WINDOW
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.farmer.logFormat }}
            - name: IMAS_LOG_FORMAT
              value: {{ . | quote }}
            {{- end }}
            {{- /* Recipe template render limits, per render and per cook
            (security review B4); types checked in validate, ranges by
            farmer at startup (cook.SetRenderLimits). */}}
            {{- with .Values.farmer.recipes.templateLimits }}
            - name: IMAS_RECIPE_MAX_SOURCE_BYTES
              value: {{ .maxSourceBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_MAX_RENDERED_BYTES
              value: {{ .maxRenderedBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_MAX_VALUE_BYTES
              value: {{ .maxValueBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_RENDER_TIMEOUT
              value: {{ .renderTimeout | quote }}
            - name: IMAS_RECIPE_MAX_RANGE_ITERATIONS
              value: {{ .maxRangeIterations | int64 | toString | quote }}
            - name: IMAS_RECIPE_COOK_RENDER_TIMEOUT
              value: {{ .cookRenderTimeout | quote }}
            - name: IMAS_RECIPE_COOK_MAX_RENDERED_BYTES
              value: {{ .cookMaxRenderedBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_COOK_MAX_RANGE_ITERATIONS
              value: {{ .cookMaxRangeIterations | int64 | toString | quote }}
            - name: IMAS_RECIPE_MAX_INCLUDES
              value: {{ .maxIncludes | int64 | toString | quote }}
            {{- end }}
            # Farmer's own self_update switch (security review L1), off unless
            # farmer.selfUpdate.enabled.
            - name: IMAS_SELF_UPDATE_ENABLED
              value: {{ .Values.farmer.selfUpdate.enabled | default false | toString | quote }}
            {{- with .Values.farmer.sproutActions }}
            {{- if not (kindIs "invalid" .concurrency) }}
            - name: IMAS_SPROUT_ACTION_CONCURRENCY
              value: {{ .concurrency | int | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .selfUpdateConcurrency) }}
            - name: IMAS_SELF_UPDATE_CONCURRENCY
              value: {{ .selfUpdateConcurrency | int | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .tenantConcurrency) }}
            - name: IMAS_SPROUT_ACTION_TENANT_CONCURRENCY
              value: {{ .tenantConcurrency | int | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.tls.mode "openbao" }}
            # API certificate from OpenBao PKI (internal/certs).
            {{- include "imas-farmer.openbaoEnv" (dict "root" $ "prefix" "IMAS_CERTS_OPENBAO" "k8sRole" .Values.tls.openbao.k8sRole "tokenKey" .Values.tls.openbao.tokenSecretKey) | nindent 12 }}
            - name: IMAS_CERTS_OPENBAO_PKI_MOUNT
              value: {{ .Values.tls.openbao.pkiMount | quote }}
            - name: IMAS_CERTS_OPENBAO_ROLE
              value: {{ .Values.tls.openbao.role | quote }}
            {{- end }}
            # Gateway JWT signer: Transit sign on {{ $ob.gateway.keyName }} only.
            {{- include "imas-farmer.openbaoEnv" (dict "root" $ "prefix" "IMAS_GATEWAY_OPENBAO" "k8sRole" $ob.gateway.k8sRole "tokenKey" $ob.gateway.tokenSecretKey) | nindent 12 }}
            - name: IMAS_GATEWAY_OPENBAO_TRANSIT_MOUNT
              value: {{ $ob.gateway.transitMount | quote }}
            # NATS trust chain signer (P21 slice 1): signs through Transit
            # (operator-signing, SYS account, tenant signing keys), never
            # with the operator identity key; and the public trust from the
            # ConfigMap natsTrust.configMapName. farmer refuses to start
            # without either (pki.CheckNATSAuth).
            {{- include "imas-farmer.natsSignEnv" (dict "root" $ "k8sRole" $ob.natsSign.k8sRole "tokenKey" $ob.natsSign.tokenSecretKey) | nindent 12 }}
            # Tenant X25519 keypair (KV v2).
            {{- include "imas-farmer.openbaoEnv" (dict "root" $ "prefix" "IMAS_TENANTBOX_OPENBAO" "k8sRole" $ob.tenantBox.k8sRole "tokenKey" $ob.tenantBox.tokenSecretKey) | nindent 12 }}
            - name: IMAS_TENANTBOX_OPENBAO_KV_MOUNT
              value: {{ $ob.tenantBox.kvMount | quote }}
            - name: IMAS_TENANTBOX_OPENBAO_KV_PATH
              value: {{ $ob.tenantBox.kvPath | quote }}
            {{- with .Values.farmer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.farmer.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.farmer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.farmer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.farmer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.farmer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/imas/farmer
              subPath: farmer
              readOnly: true
            # The process's temp directory, the only writable volume
            # besides tls; nothing on it outlives the pod, and farmer never
            # reads back what an earlier process wrote. Farmer keeps no
            # JWT or key on disk.
            - name: tmp
              mountPath: /tmp
            - name: nats-seeds
              mountPath: {{ .Values.natsSeeds.mountPath }}
              readOnly: true
            - name: farmer-nkey
              mountPath: {{ .Values.farmer.nkeySecret.mountPath }}
              readOnly: true
            {{- include "imas-farmer.natsTrustVolumeMount" . | nindent 12 }}
            - name: tls
              mountPath: {{ $tlsDir }}
              {{- if eq .Values.tls.mode "secret" }}
              readOnly: true
              {{- end }}
            {{- include "imas-farmer.openbaoVolumeMounts" . | trim | nindent 12 }}
            {{- with .Values.farmer.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "imas-farmer.fullname" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nats-seeds
          secret:
            secretName: {{ .Values.natsSeeds.secretName }}
            defaultMode: 0440
            # Only the listed keys, even if the Secret carries others.
            items:
              {{- range $name, $key := $seeds }}
              - key: {{ $key | quote }}
                path: {{ $key | quote }}
              {{- end }}
        # farmer's NKey seed, shared by every replica; only its key.
        - name: farmer-nkey
          secret:
            secretName: {{ .Values.farmer.nkeySecret.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.farmer.nkeySecret.key | quote }}
                path: {{ .Values.farmer.nkeySecret.key | quote }}
        # Public trust only; written by the bootstrap Job.
        {{- include "imas-farmer.natsTrustVolume" . | nindent 8 }}
        {{- if eq .Values.tls.mode "secret" }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
              - { key: ca.crt, path: ca.crt }
        {{- else }}
        # Issued from OpenBao PKI at every start (internal/certs.GenCert);
        # nothing rotates it while farmer runs, so a restart is the
        # rotation.
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- include "imas-farmer.openbaoVolumes" . | trim | nindent 8 }}
        {{- with .Values.farmer.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
