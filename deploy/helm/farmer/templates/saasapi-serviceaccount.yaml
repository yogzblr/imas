{{- if and .Values.saasapi.enabled .Values.saasapi.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "imas-farmer.saasapi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi
  {{- with .Values.saasapi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC. With fleet update dispatch on, its projected token logs in to
# the verify-only role (imas-saasapi-fleet-verify) and nothing else.
automountServiceAccountToken: false
{{- end }}
