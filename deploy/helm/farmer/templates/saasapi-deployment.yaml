{{- if .Values.saasapi.enabled }}
{{- include "imas-farmer.validate" . -}}
{{- $s := .Values.saasapi -}}
{{- $fetchCA := include "imas-farmer.saasapi.fetchCA" . -}}
{{- $fleetVerify := include "imas-farmer.saasapi.fleetVerify" . -}}
{{- $op := $s.operator -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imas-farmer.saasapi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi
spec:
  replicas: {{ $s.replicaCount }}
  selector:
    matchLabels:
      {{- include "imas-farmer.saasapi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "imas-farmer.labels" . | nindent 8 }}
        app.kubernetes.io/component: saasapi
        {{- with $s.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $s.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "imas-farmer.saasapi.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $s.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $s.terminationGracePeriodSeconds }}
      {{- with $s.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if $s.affinity }}
        {{- toYaml $s.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "imas-farmer.saasapi.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with $s.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $fetchCA }}
      initContainers:
        # tls.mode=openbao: the bus certificate is issued from OpenBao PKI,
        # and farmer fetches that CA itself at boot. saasapi needs the same
        # CA as a file, so fetch it here (an unauthenticated read of
        # <pki>/cert/ca, verified against openbaoClient.caConfigMap when set).
        - name: fetch-bus-ca
          image: {{ include "imas-farmer.image" (dict "image" .Values.openbaoTools.image "appVersion" "") | quote }}
          imagePullPolicy: {{ .Values.openbaoTools.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - bao read -field=certificate "$PKI_MOUNT/cert/ca" > /var/run/imas/bus-ca/ca.crt
          env:
            - name: BAO_ADDR
              value: {{ include "imas-farmer.openbaoAddr" . | quote }}
            {{- if .Values.openbaoClient.caConfigMap }}
            - name: BAO_CACERT
              value: /var/run/secrets/openbao-ca/{{ .Values.openbaoClient.caKey }}
            {{- end }}
            - name: PKI_MOUNT
              value: {{ .Values.tls.openbao.pkiMount | quote }}
            - name: HOME
              value: /tmp
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          {{- with $s.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: bus-ca
              mountPath: /var/run/imas/bus-ca
            - name: tmp
              mountPath: /tmp
            {{- if .Values.openbaoClient.caConfigMap }}
            - name: openbao-ca
              mountPath: /var/run/secrets/openbao-ca
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: saasapi
          image: {{ include "imas-farmer.image" (dict "image" $s.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $s.image.pullPolicy }}
          {{- with $s.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
              protocol: TCP
            {{- if $op.enabled }}
            - name: operator
              containerPort: {{ $op.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: SAASAPI_LISTEN_ADDR
              value: {{ printf ":%v" $s.port | quote }}
            # The saas schema; same PXC as farmer.
            - name: SAASAPI_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "imas-farmer.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretKeys.saasapiDSN }}
            - name: INTERNAL_AUTH_SECRET_CURRENT
              valueFrom:
                secretKeyRef:
                  name: {{ $s.internalAuthSecret.secretName }}
                  key: {{ $s.internalAuthSecret.currentKey }}
            - name: INTERNAL_AUTH_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ $s.internalAuthSecret.secretName }}
                  key: {{ $s.internalAuthSecret.previousKey }}
                  optional: true
            - name: SAASAPI_KEYCLOAK_JWKS_URL
              value: {{ $s.jwt.keycloakJWKSURL | quote }}
            - name: SAASAPI_JWT_ISSUER
              value: {{ $s.jwt.issuer | quote }}
            - name: SAASAPI_JWT_AUDIENCE
              value: {{ $s.jwt.audience | quote }}
            # The same URL as farmer's farmerbusurl. saasapi verifies the
            # bus certificate against its host, the Service FQDN (a SAN on
            # the nats chart's default bus certificate).
            - name: SAASAPI_NATS_URL
              value: {{ include "imas-farmer.busURL" . | quote }}
            - name: SAASAPI_NATS_CA_FILE
              value: /var/run/imas/bus-ca/ca.crt
            # Its NATS identity (deploy/farmer/externalsecrets.yaml,
            # imas-saasapi-nats): the seed as a file only, the JWT (not
            # secret, but it travels with the seed) as a value.
            - name: SAASAPI_NATS_NKEY_SEED_FILE
              value: /var/run/secrets/imas/nats/{{ $s.natsCredentials.seedKey }}
            - name: SAASAPI_NATS_USER_JWT
              valueFrom:
                secretKeyRef:
                  name: {{ $s.natsCredentials.secretName }}
                  key: {{ $s.natsCredentials.jwtKey }}
            # Sealed internal.* (J.4): its box private key as a file only,
            # and the platform public key it pins (not secret) as a value,
            # both from saasapi.controlPlaneBox's Secret. No fallback:
            # saasapi refuses to start without them.
            - name: SAASAPI_BOX_PRIV_FILE
              value: /var/run/secrets/imas/saasapi-box/{{ $s.controlPlaneBox.privKey }}
            - name: SAASAPI_PLATFORM_BOX_PUB
              valueFrom:
                secretKeyRef:
                  name: {{ $s.controlPlaneBox.secretName }}
                  key: {{ $s.controlPlaneBox.platformPubKey }}
            {{- /*
            deploy/saasapi/deployment.env.rate-limit.yaml, with the same
            semantics: null emits nothing (the compiled-in default), burst
            goes through int so 1000000 isn't "1e+06" (a fractional burst
            fails the render in validate), perSecond doesn't (0.5 must stay
            0.5). SAASAPI_VALKEY_ADDRS names the same Valkey farmer writes
            heartbeats to: saasapi reads them for `connected`.
            */}}
            {{- with include "imas-farmer.valkeyAddrs" . }}
            - name: SAASAPI_VALKEY_ADDRS
              value: {{ . | quote }}
            {{- end }}
            {{- with $s.enrollmentKeys.rateLimit }}
            {{- if not (kindIs "invalid" .perSecond) }}
            - name: SAASAPI_ENROLLMENT_KEY_RATE_LIMIT
              value: {{ .perSecond | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .burst) }}
            - name: SAASAPI_ENROLLMENT_KEY_RATE_BURST
              value: {{ .burst | int | quote }}
            {{- end }}
            {{- end }}
            - name: SAASAPI_FLEET_UPDATE_DISPATCH_ENABLED
              value: {{ $s.fleetUpdateDispatch.enabled | toString | quote }}
            {{- with $s.fleetUpdateDispatch.clockSkew }}
            - name: SAASAPI_FLEET_UPDATE_CLOCK_SKEW
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with $s.actionDispatch }}
            {{- if not (kindIs "invalid" .concurrency) }}
            - name: SAASAPI_ACTION_DISPATCH_CONCURRENCY
              value: {{ .concurrency | int | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .selfUpdateConcurrency) }}
            - name: SAASAPI_SELF_UPDATE_DISPATCH_CONCURRENCY
              value: {{ .selfUpdateConcurrency | int | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .tenantConcurrency) }}
            - name: SAASAPI_ACTION_DISPATCH_TENANT_CONCURRENCY
              value: {{ .tenantConcurrency | int | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.outboxSweeper }}
            - name: SAASAPI_OUTBOX_SWEEPER_ENABLED
              value: {{ .enabled | toString | quote }}
            {{- with .interval }}
            - name: SAASAPI_OUTBOX_SWEEP_INTERVAL
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .provisioningStaleAfter }}
            - name: SAASAPI_OUTBOX_PROVISIONING_STALE_AFTER
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .actionStaleAfter }}
            - name: SAASAPI_OUTBOX_ACTION_STALE_AFTER
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with .actionMaxAge }}
            - name: SAASAPI_OUTBOX_ACTION_MAX_AGE
              value: {{ . | toString | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .maxAttempts) }}
            - name: SAASAPI_OUTBOX_MAX_ATTEMPTS
              value: {{ .maxAttempts | int | quote }}
            {{- end }}
            {{- with .leaseTTL }}
            - name: SAASAPI_OUTBOX_LEASE_TTL
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            {{- /* Recipe template render limits: the same values farmer
            renders under, so an upload is validated as it will be cooked.
            Types checked in validate, ranges by saasapi at startup. */}}
            {{- with .Values.farmer.recipes.templateLimits }}
            - name: IMAS_RECIPE_MAX_SOURCE_BYTES
              value: {{ .maxSourceBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_MAX_RENDERED_BYTES
              value: {{ .maxRenderedBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_MAX_VALUE_BYTES
              value: {{ .maxValueBytes | int64 | toString | quote }}
            - name: IMAS_RECIPE_RENDER_TIMEOUT
              value: {{ .renderTimeout | quote }}
            - name: IMAS_RECIPE_MAX_RANGE_ITERATIONS
              value: {{ .maxRangeIterations | int64 | toString | quote }}
            {{- end }}
            {{- with $s.recipes }}
            - name: SAASAPI_RECIPES_READ_ROLE
              value: {{ .readRole | quote }}
            - name: SAASAPI_RECIPES_WRITE_ROLE
              value: {{ .writeRole | quote }}
            - name: SAASAPI_RECIPES_MAX_COUNT
              value: {{ .maxCount | int64 | toString | quote }}
            - name: SAASAPI_RECIPES_MAX_TOTAL_BYTES
              value: {{ .maxTotalBytes | int64 | toString | quote }}
            - name: SAASAPI_RECIPES_WRITE_RATE_LIMIT
              value: {{ .writeRateLimit.perSecond | quote }}
            - name: SAASAPI_RECIPES_WRITE_RATE_BURST
              value: {{ .writeRateLimit.burst | int | quote }}
            {{- if .enabled }}
            # Recipe upload (REC.1): saasapi's OWN object-store credential,
            # limited by its policy to tenants/*/recipes/* (and PutObject on
            # tenants/*/recipe-audit/*). The secret key only as a file.
            - name: SAASAPI_RECIPES_S3_ENDPOINT
              value: {{ $.Values.objectStore.endpoint | quote }}
            - name: SAASAPI_RECIPES_S3_BUCKET
              value: {{ $.Values.objectStore.bucket | quote }}
            - name: SAASAPI_RECIPES_S3_USE_SSL
              value: {{ $.Values.objectStore.useSSL | toString | quote }}
            - name: SAASAPI_RECIPES_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: {{ .accessKeyIdKey }}
            - name: SAASAPI_RECIPES_S3_SECRET_ACCESS_KEY_FILE
              value: /var/run/secrets/imas/recipes-s3/secret-access-key
            # FIX.3: refuse to start unless the object store denies this
            # credential outside tenants/ and under sprouts/
            # (internal/saasapi recipes_credcheck.go). FIX.5: and under the
            # platform recipe prefix (farmer's default recipedir, which is
            # saasapi's default too), and everything in the job bucket.
            - name: SAASAPI_RECIPES_CREDENTIAL_CHECK
              value: {{ .credentialCheck | toString | quote }}
            {{- with $.Values.objectStore.jobBucket }}
            - name: SAASAPI_RECIPES_JOB_BUCKET
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $fleetVerify }}
            # Fleet signing key, READ-ONLY (imas-fleet-verify). saasapi
            # writes saas.fleet_versions, so it must never hold sign. Fleet
            # dispatch and the operator plane both refuse to start without it.
            {{- include "imas-farmer.openbaoEnv" (dict "root" $ "prefix" "IMAS_FLEETSIGN_OPENBAO" "k8sRole" $s.openbao.fleetSign.k8sRole "tokenKey" $s.openbao.fleetSign.tokenSecretKey) | nindent 12 }}
            - name: IMAS_FLEETSIGN_OPENBAO_TRANSIT_MOUNT
              value: {{ $s.openbao.fleetSign.transitMount | quote }}
            - name: IMAS_FLEETSIGN_TRANSIT_KEY
              value: {{ $s.openbao.fleetSign.keyName | quote }}
            {{- end }}
            {{- if $op.enabled }}
            # The operator plane (fleet_releases.go): its own HTTPS listener
            # and bearer token. Every secret is a file, read once at start.
            - name: SAASAPI_OPERATOR_LISTEN_ADDR
              value: {{ printf ":%v" $op.port | quote }}
            - name: SAASAPI_OPERATOR_TLS_CERT_FILE
              value: /var/run/secrets/imas/operator-tls/tls.crt
            - name: SAASAPI_OPERATOR_TLS_KEY_FILE
              value: /var/run/secrets/imas/operator-tls/tls.key
            - name: SAASAPI_OPERATOR_TOKEN_FILE
              value: /var/run/secrets/imas/operator-token/current
            {{- if $op.token.previousKey }}
            - name: SAASAPI_OPERATOR_TOKEN_PREVIOUS_FILE
              value: /var/run/secrets/imas/operator-token/previous
            {{- end }}
            - name: SAASAPI_FLEETRELEASER_URL
              value: {{ $op.fleetReleaser.url | quote }}
            - name: SAASAPI_FLEETRELEASER_TOKEN_FILE
              value: /var/run/secrets/imas/fleetreleaser/token
            {{- if $op.fleetReleaser.caConfigMap }}
            - name: SAASAPI_FLEETRELEASER_CA_FILE
              value: /var/run/secrets/imas/fleetreleaser-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- with $s.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $s.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nats-credentials
              mountPath: /var/run/secrets/imas/nats
              readOnly: true
            - name: saasapi-box
              mountPath: /var/run/secrets/imas/saasapi-box
              readOnly: true
            - name: bus-ca
              mountPath: /var/run/imas/bus-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $s.recipes.enabled }}
            - name: recipes-s3
              mountPath: /var/run/secrets/imas/recipes-s3
              readOnly: true
            {{- end }}
            {{- if $fleetVerify }}
            {{- include "imas-farmer.openbaoVolumeMounts" . | trim | nindent 12 }}
            {{- end }}
            {{- if $op.enabled }}
            - name: operator-tls
              mountPath: /var/run/secrets/imas/operator-tls
              readOnly: true
            - name: operator-token
              mountPath: /var/run/secrets/imas/operator-token
              readOnly: true
            - name: fleetreleaser-token
              mountPath: /var/run/secrets/imas/fleetreleaser
              readOnly: true
            {{- if $op.fleetReleaser.caConfigMap }}
            - name: fleetreleaser-ca
              mountPath: /var/run/secrets/imas/fleetreleaser-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with $s.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # Only the seed: the JWT arrives as an env var from the same Secret.
        - name: nats-credentials
          secret:
            secretName: {{ $s.natsCredentials.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $s.natsCredentials.seedKey | quote }}
                path: {{ $s.natsCredentials.seedKey | quote }}
        # Only the box private key, as the nats seed: owner root, group the
        # pod's fsGroup (saasapi's), 0440, nothing for others; mounted by
        # the saasapi container alone, never by the init container. The
        # platform public key reaches the container as SAASAPI_PLATFORM_BOX_PUB.
        # Until the Secret exists (the keygen Job hasn't run, or ESO hasn't
        # synced yet) the kubelet doesn't start the pod: it waits, it
        # doesn't crash-loop.
        - name: saasapi-box
          secret:
            secretName: {{ $s.controlPlaneBox.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $s.controlPlaneBox.privKey | quote }}
                path: {{ $s.controlPlaneBox.privKey | quote }}
        - name: bus-ca
          {{- if .Values.bus.ca.secretName }}
          secret:
            secretName: {{ .Values.bus.ca.secretName }}
            items:
              - { key: {{ .Values.bus.ca.key | quote }}, path: ca.crt }
          {{- else if .Values.bus.ca.configMapName }}
          configMap:
            name: {{ .Values.bus.ca.configMapName }}
            items:
              - { key: {{ .Values.bus.ca.key | quote }}, path: ca.crt }
          {{- else if eq .Values.tls.mode "secret" }}
          # tls.secretName's ca.crt only; saasapi gets none of farmer's key.
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - { key: ca.crt, path: ca.crt }
          {{- else }}
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if $s.recipes.enabled }}
        # Only the secret key of saasapi's own recipe credential.
        - name: recipes-s3
          secret:
            secretName: {{ $s.recipes.credentialsSecret }}
            defaultMode: 0440
            items:
              - { key: {{ $s.recipes.secretAccessKeyKey | quote }}, path: secret-access-key }
        {{- end }}
        {{- if or $fleetVerify (and $fetchCA .Values.openbaoClient.caConfigMap) }}
        {{- if $fleetVerify }}
        {{- include "imas-farmer.openbaoVolumes" . | trim | nindent 8 }}
        {{- else }}
        - name: openbao-ca
          configMap:
            name: {{ .Values.openbaoClient.caConfigMap }}
        {{- end }}
        {{- end }}
        {{- if $op.enabled }}
        # The listener's certificate and key; not ca.crt, which is the hook
        # Job's.
        - name: operator-tls
          secret:
            secretName: {{ $op.tls.secretName }}
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        - name: operator-token
          secret:
            secretName: {{ $op.token.secretName }}
            defaultMode: 0440
            items:
              - { key: {{ $op.token.currentKey | quote }}, path: current }
              {{- if $op.token.previousKey }}
              - { key: {{ $op.token.previousKey | quote }}, path: previous }
              {{- end }}
        - name: fleetreleaser-token
          secret:
            secretName: {{ $op.fleetReleaser.tokenSecretName }}
            defaultMode: 0440
            items:
              - { key: {{ $op.fleetReleaser.tokenKey | quote }}, path: token }
        {{- if $op.fleetReleaser.caConfigMap }}
        - name: fleetreleaser-ca
          configMap:
            name: {{ $op.fleetReleaser.caConfigMap }}
            items:
              - { key: {{ $op.fleetReleaser.caKey | quote }}, path: ca.crt }
        {{- end }}
        {{- end }}
        {{- with $s.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
