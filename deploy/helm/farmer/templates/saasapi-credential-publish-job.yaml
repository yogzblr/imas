{{- if .Values.credentialPublisher.enabled }}
{{- include "imas-farmer.validate" . -}}
{{- $p := .Values.credentialPublisher -}}
{{- $seeds := fromYaml (include "imas-farmer.seeds" .) -}}
{{- /*
`farmer publish-saasapi-credential` (internal/saasapicred), from the
reviewed reference deploy/farmer/saasapi-credential-publish-job.yaml. Read
deploy/farmer/README.md first.

FLAG FOR SECURITY REVIEW: the ServiceAccount below is the ONLY identity
that may authenticate to OpenBao's publisher role, the one role with
write access to the published-JWT path. farmer's own ServiceAccount must
not be bound to that role, and nothing that runs as farmer may be able to
create pods/Jobs as this ServiceAccount. _helpers.tpl refuses a render
that names farmer's or saasapi's ServiceAccount or one of farmer's
OpenBao roles here.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $p.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi-cred-publisher
# No RBAC Role/RoleBinding: the Job needs no Kubernetes API access at all.
# Its token is used only to log in to OpenBao (see the projected volume).
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-saasapi-credential-publish" (include "imas-farmer.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi-cred-publisher
  annotations:
    # After every farmer deployment (deploy/farmer/README.md, "When to run
    # it"). A seed rotation is not a deployment: the runbook re-runs this
    # with a no-op `helm upgrade`. A failed run fails the release on
    # purpose (saasapi may be on a stale JWT); don't combine with
    # --atomic unless a farmer rollback is what you want.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- if $p.argoCDHooks }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- end }}
spec:
  backoffLimit: {{ $p.backoffLimit }}
  activeDeadlineSeconds: {{ $p.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $p.ttlSecondsAfterFinished }}
  template:
    {{- include "imas-farmer.publisher.podTemplate" . | nindent 4 }}
---
# The same run on a schedule (security review 2026-10, L14): the SaaS API
# User JWT expires (credentialPublisher.userJWTTTL, default 24h), and a
# run writes a new one once a third of its lifetime is left; otherwise it
# is one KV read and writes nothing. ESO and Reloader then hand the new
# JWT to saasapi, as after a deployment. Same ServiceAccount, pod and
# NetworkPolicy as the Job above.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-saasapi-credential-refresh" (include "imas-farmer.fullname" .) | trunc 52 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi-cred-publisher
spec:
  schedule: {{ printf "%d */%d * * *" (int $p.refresh.minute) (int $p.refresh.everyHours) | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $p.refresh.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ $p.backoffLimit }}
      activeDeadlineSeconds: {{ $p.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $p.ttlSecondsAfterFinished }}
      template:
        {{- include "imas-farmer.publisher.podTemplate" . | nindent 8 }}
---
# The Job and the CronJob's runs talk to OpenBao and DNS, nothing else. In particular not the
# NATS bus: with an emptyDir PKI directory it never pushes to the
# resolver. Rendered with the Job whatever networkPolicy.enabled says:
# it is part of the reviewed boundary, not an optional hardening.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $p.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi-cred-publisher
spec:
  podSelector:
    matchLabels:
      {{- include "imas-farmer.publisher.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    {{- include "imas-farmer.openbaoEgress" . | nindent 4 }}
    {{- include "imas-farmer.dnsEgress" . | nindent 4 }}
{{- end }}

{{- /*
The publisher's pod: the post-deploy Job's and the refresh CronJob's.
*/}}
{{- define "imas-farmer.publisher.podTemplate" -}}
{{- $p := .Values.credentialPublisher -}}
{{- $seeds := fromYaml (include "imas-farmer.seeds" .) -}}
metadata:
  labels:
    {{- include "imas-farmer.publisher.selectorLabels" . | nindent 4 }}
spec:
  restartPolicy: Never
  serviceAccountName: {{ $p.serviceAccountName }}
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.farmer.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: publish
      # The same image, same tag, as the farmer Deployment.
      image: {{ include "imas-farmer.farmer.image" . | quote }}
      imagePullPolicy: {{ .Values.farmer.image.pullPolicy }}
      args: ["publish-saasapi-credential"] # ENTRYPOINT is /farmer
      env:
        # NATS key material: the SaaS API's user seed from the same
        # Secret, and env var, as farmer's Deployment (required: the
        # subcommand refuses to generate it). The SYS account key that
        # signs its JWT is a Transit key, reached as the
        # imas-natssign-publisher role (sign with nats-sys-account
        # only), with the public trust from natsTrust.configMapName.
        - name: IMAS_NATS_SAASAPI_USER_SEED_FILE
          value: {{ printf "%s/%s" .Values.natsSeeds.mountPath $seeds.SAASAPI_USER | quote }}
        {{- include "imas-farmer.natsSignEnv" (dict "root" $ "k8sRole" $p.natsSign.k8sRole "tokenKey" $p.natsSign.tokenSecretKey "tokenSecret" $p.tokenSecretName) | nindent 8 }}
        # OpenBao KV-write identity (internal/openbaokv). Distinct env
        # prefix from farmer's IMAS_CERTS_OPENBAO_*/IMAS_GATEWAY_OPENBAO_*.
        {{- include "imas-farmer.openbaoEnv" (dict "root" $ "prefix" "IMAS_SAASAPI_CRED_OPENBAO" "k8sRole" $p.k8sRole "tokenKey" $p.tokenSecretKey "tokenSecret" $p.tokenSecretName) | nindent 8 }}
        - name: IMAS_SAASAPI_CRED_OPENBAO_KV_MOUNT
          value: {{ $p.kvMount | quote }}
        - name: IMAS_SAASAPI_CRED_OPENBAO_KV_PATH
          value: {{ $p.kvPath | quote }}
        # The JWT's lifetime (its exp). A run writes a new JWT once a
        # third of it is left, so the refresh CronJob must run more often
        # than that.
        - name: IMAS_SAASAPI_USER_JWT_TTL
          value: {{ $p.userJWTTTL | quote }}
        {{- with $p.extraEnv }}
        {{- range . }}
        {{- if and (hasPrefix "IMAS_" (toString .name)) (ne (toString .name) "IMAS_SAASAPI_CRED_OPENBAO_NAMESPACE") }}
        {{- fail (printf "credentialPublisher.extraEnv may not set %s: the chart sets the publisher's own IMAS_* variables (its identity, key and path), and only IMAS_SAASAPI_CRED_OPENBAO_NAMESPACE may be added" .name) }}
        {{- end }}
        {{- end }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      {{- with $p.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeMounts:
        - name: nats-seeds
          mountPath: {{ .Values.natsSeeds.mountPath }}
          readOnly: true
        {{- include "imas-farmer.natsTrustVolumeMount" . | nindent 8 }}
        {{- include "imas-farmer.openbaoVolumeMounts" . | trim | nindent 8 }}
        # farmer's config root, where config.LoadConfig creates its
        # config file. An emptyDir: the Job signs the credential and
        # writes no JWT or key (deploy/farmer/README.md, "Why an
        # emptyDir").
        - name: imas-config
          mountPath: /etc/imas
  volumes:
    - name: nats-seeds
      secret:
        secretName: {{ .Values.natsSeeds.secretName }}
        defaultMode: 0440
        # Only the SaaS API's own seed, even though the Secret carries
        # farmer's SYS user seed too.
        items:
          - key: {{ $seeds.SAASAPI_USER | quote }}
            path: {{ $seeds.SAASAPI_USER | quote }}
    {{- include "imas-farmer.natsTrustVolume" . | nindent 4 }}
    {{- include "imas-farmer.openbaoVolumes" . | trim | nindent 4 }}
    - name: imas-config
      emptyDir:
        sizeLimit: 16Mi
{{- end }}
