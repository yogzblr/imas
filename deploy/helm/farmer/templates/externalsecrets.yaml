{{- if .Values.externalSecrets.enabled }}
{{- include "imas-farmer.validate" . -}}
{{- $es := .Values.externalSecrets -}}
{{- $seeds := fromYaml (include "imas-farmer.seeds" .) -}}
{{- /*
deploy/farmer/externalsecrets.yaml, as values. The line that matters for
security review: the seed path and the publisher's KV path are
different, and neither is a prefix of the other (checked in
imas-farmer.publisher.validate). It syncs every natsSeeds entry: since P21
slice 1 only the user seeds, SYS_USER and SAASAPI_USER (properties
sys_user and saasapi_user, the NAME lowercased). The trust chain keys are
OpenBao Transit keys and never leave OpenBao.
*/}}
# farmer's (and the publish Job's) user NKey seeds. Ops generates the
# seeds into OpenBao; imas writes no seed in this path (the bootstrap Job
# adds only property valkey_password, below).
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.natsSeeds.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: farmer
spec:
  refreshInterval: {{ $es.seedsRefreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.natsSeeds.secretName }}
  data:
    {{- range $name, $key := $seeds }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $es.seedPath }}
        property: {{ lower $name }}
    {{- end }}
---
# farmer's NKey seed, one for every replica (IMAS_FARMER_NKEY_SEED_FILE).
# Ops generates it into the seed path, property farmer_nkey; nothing in
# imas writes it. Its own Secret, mounted only in farmer's pods.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.farmer.nkeySecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: farmer
spec:
  refreshInterval: {{ $es.seedsRefreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.farmer.nkeySecret.secretName }}
  data:
    - secretKey: {{ .Values.farmer.nkeySecret.key | quote }}
      remoteRef:
        key: {{ $es.seedPath }}
        property: farmer_nkey
{{- if .Values.valkey.auth.enabled }}
---
# Valkey's password (unit S5; IMAS_VALKEY_PASSWORD_FILE and
# SAASAPI_VALKEY_PASSWORD_FILE, and the bundled Valkey's own). Property
# valkey_password of the seed path, which the OpenBao bootstrap Job
# generates once and never overwrites. Mounted as a file in farmer's and
# saasapi's pods (and the bundled Valkey's init step), never an env var.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.valkey.auth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  refreshInterval: {{ $es.seedsRefreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.valkey.auth.secretName }}
  data:
    - secretKey: {{ .Values.valkey.auth.key | quote }}
      remoteRef:
        key: {{ $es.seedPath }}
        property: valkey_password
{{- end }}
{{- if and .Values.saasapi.enabled $es.saasapi.enabled }}
---
# saasapi's NATS credential: its seed from the seed path, and the JWT the
# publish Job writes (field "jwt": pki.SaaSAPICredentialJWTField).
# Reloader rolls saasapi when either changes; saasapi reads both once at
# startup.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.saasapi.natsCredentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi
spec:
  # Short: this is the tail of the rotation window (deploy/farmer/README.md).
  refreshInterval: {{ $es.saasapi.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.saasapi.natsCredentials.secretName }}
  data:
    - secretKey: {{ .Values.saasapi.natsCredentials.seedKey | quote }}
      remoteRef:
        key: {{ $es.seedPath }}
        property: saasapi_user
    - secretKey: {{ .Values.saasapi.natsCredentials.jwtKey | quote }}
      remoteRef:
        key: {{ .Values.credentialPublisher.kvPath }}
        property: jwt
{{- $box := .Values.saasapi.controlPlaneBox }}
{{- $t := .Values.farmer.openbao.tenantBox }}
---
# saasapi's half of sealed internal.* (J.4; FLAG FOR SECURITY REVIEW): its
# box PRIVATE key and the platform PUBLIC key it pins, both written by the
# control-plane keygen Job. Exactly these two fields: never <base>/platform
# (the platform private key is farmer's alone), and the Secret is mounted
# only in saasapi's pods. Until the keygen Job has run the remote keys
# don't exist, ESO creates no Secret, and saasapi's pods wait for it.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $box.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi
spec:
  refreshInterval: {{ $es.saasapi.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ $box.secretName }}
  data:
    - secretKey: {{ $box.privKey | quote }}
      remoteRef:
        key: {{ printf "%s/saasapi-box" $t.kvPath }}
        property: priv
    - secretKey: {{ $box.platformPubKey | quote }}
      remoteRef:
        key: {{ printf "%s/controlplane-pub" $t.kvPath }}
        property: platform_pub
{{- end }}
{{- end }}
