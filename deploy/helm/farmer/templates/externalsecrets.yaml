{{- if .Values.externalSecrets.enabled }}
{{- include "imas-farmer.validate" . -}}
{{- $es := .Values.externalSecrets -}}
{{- $seeds := fromYaml (include "imas-farmer.seeds" .) -}}
{{- /*
deploy/farmer/externalsecrets.yaml, as values. The line that matters for
security review: the seed path and the publisher's KV path are
different, and neither is a prefix of the other (checked in
imas-farmer.publisher.validate). The reference synced two seeds; this
syncs every natsSeeds entry, since farmer and the nats chart's bus need
the Operator and tenant seeds too (deploy/helm/nats/README.md, "Seeds").
Each seed's property is its NAME lowercased: sys_account, saasapi_user,
operator, operator_signing, tenant, tenant_signing.
*/}}
# farmer's (and the publish Job's) NKey seeds. Ops generates or imports
# the seeds into OpenBao; nothing in imas writes this path.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.natsSeeds.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: farmer
spec:
  refreshInterval: {{ $es.seedsRefreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.natsSeeds.secretName }}
  data:
    {{- range $name, $key := $seeds }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $es.seedPath }}
        property: {{ lower $name }}
    {{- end }}
{{- if and .Values.saasapi.enabled $es.saasapi.enabled }}
---
# saasapi's NATS credential: its seed from the seed path, and the JWT the
# publish Job writes (field "jwt": pki.SaaSAPICredentialJWTField).
# Reloader rolls saasapi when either changes; saasapi reads both once at
# startup.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.saasapi.natsCredentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi
spec:
  # Short: this is the tail of the rotation window (deploy/farmer/README.md).
  refreshInterval: {{ $es.saasapi.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.saasapi.natsCredentials.secretName }}
  data:
    - secretKey: {{ .Values.saasapi.natsCredentials.seedKey | quote }}
      remoteRef:
        key: {{ $es.seedPath }}
        property: saasapi_user
    - secretKey: {{ .Values.saasapi.natsCredentials.jwtKey | quote }}
      remoteRef:
        key: {{ .Values.credentialPublisher.kvPath }}
        property: jwt
{{- $box := .Values.saasapi.controlPlaneBox }}
{{- $t := .Values.farmer.openbao.tenantBox }}
---
# saasapi's half of sealed internal.* (J.4; FLAG FOR SECURITY REVIEW): its
# box PRIVATE key and the platform PUBLIC key it pins, both written by the
# control-plane keygen Job. Exactly these two fields: never <base>/platform
# (the platform private key is farmer's alone), and the Secret is mounted
# only in saasapi's pods. Until the keygen Job has run the remote keys
# don't exist, ESO creates no Secret, and saasapi's pods wait for it.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $box.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-farmer.labels" . | nindent 4 }}
    app.kubernetes.io/component: saasapi
spec:
  refreshInterval: {{ $es.saasapi.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ $box.secretName }}
  data:
    - secretKey: {{ $box.privKey | quote }}
      remoteRef:
        key: {{ printf "%s/saasapi-box" $t.kvPath }}
        property: priv
    - secretKey: {{ $box.platformPubKey | quote }}
      remoteRef:
        key: {{ printf "%s/controlplane-pub" $t.kvPath }}
        property: platform_pub
{{- end }}
{{- end }}
