apiVersion: v2
name: nats
description: >-
  imas's DMZ-facing NATS bus (cmd/farmerbus, RunNATSServer()) as a
  StatefulSet, plus the Envoy jwt_authn-gated gateway in front of it
  (deploy/envoy/envoy.yaml). Decentralized JWT auth: Operator ->
  Account-per-tenant -> User-per-sprout. Seeds are consumed from an
  existing Secret, never generated by the chart.
type: application
version: 0.1.0
# The farmerbus image tag defaults to this when bus.image.tag is empty.
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/yogzblr/imas
sources:
  - https://github.com/yogzblr/imas
keywords:
  - imas
  - nats
  - envoy
  - dmz
annotations:
  # FLAG FOR SECURITY REVIEW: this chart deploys the literal front door of
  # imas's trust chain. See README.md, "Security review notes".
  imas.io/security-review: required
