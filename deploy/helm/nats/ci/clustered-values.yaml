# chart-testing: 3-node bus with authenticated routes. The route password
# Secret must exist in the test namespace (see README.md, "Clustering").
bus:
  replicaCount: 3
  cluster:
    auth:
      secretName: farmerbus-route-auth
  tls:
    mode: openbao
    openbao:
      authMethod: token
      tokenSecretName: farmerbus-openbao-token
