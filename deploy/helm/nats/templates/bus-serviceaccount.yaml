{{- if .Values.bus.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "imas-nats.bus.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: bus
  {{- with .Values.bus.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The bus needs no Kubernetes API access. In openbao/kubernetes mode it
# gets an audience-scoped projected token instead (see the StatefulSet).
automountServiceAccountToken: false
{{- end }}
