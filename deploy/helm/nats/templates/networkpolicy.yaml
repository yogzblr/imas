{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $clustered := gt (int .Values.bus.replicaCount) 1 -}}
# DMZ bus. Allowed, and nothing else:
#   in:  core (cmd/farmer)  -> client port   (NATS over TLS; core dials out)
#   in:  this chart's Envoy -> websocket port (sprouts' wss://, post-jwt_authn)
#   out: DNS; OpenBao only in bus.tls.mode=openbao
# The route port is opened only by the "-routes" policy below, and only
# between bus pods. The bus never opens a connection into the core network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imas-nats.bus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: bus
spec:
  podSelector:
    matchLabels:
      {{- include "imas-nats.bus.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml $np.core.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.core.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ .Values.bus.ports.client }} }
    {{- if .Values.envoy.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "imas-nats.envoy.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.bus.ports.websocket }} }
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml $np.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.dns.podSelector | nindent 12 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if eq .Values.bus.tls.mode "openbao" }}
    - to:
        - namespaceSelector:
            {{- toYaml $np.openbao.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.openbao.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: {{ $np.openbao.port }} }
    {{- end }}
    {{- with $np.busExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if $clustered }}
---
# Bus routes (FLAG FOR SECURITY REVIEW). The route port carries every
# tenant's messages and the SYS account's claims updates between nodes.
# Allowed, and nothing else:
#   in:  other pods of this bus StatefulSet -> route port
#   out: other pods of this bus StatefulSet -> route port
# Same namespace only (a bare podSelector), so neither Envoy, core, nor
# anything reaching the DMZ edge can open a route. The listener itself
# still demands mutual TLS and the route password (cmd/farmerbus/cluster.go).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imas-nats.bus.fullname" . }}-routes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: bus
spec:
  podSelector:
    matchLabels:
      {{- include "imas-nats.bus.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "imas-nats.bus.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.bus.cluster.port }} }
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "imas-nats.bus.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.bus.cluster.port }} }
{{- end }}
{{- if .Values.envoy.enabled }}
{{- $e := .Values.envoy -}}
{{- $corePorts := list (int $e.upstreams.farmerAPI.port) -}}
{{- if not (has (int $e.upstreams.recipeService.port) $corePorts) }}
{{- $corePorts = append $corePorts (int $e.upstreams.recipeService.port) -}}
{{- end }}
---
# Envoy (DMZ edge). Allowed, and nothing else:
#   in:  envoyIngress.from (default: anyone) -> listener port
#   out: bus pods  -> websocket port
#   out: core (cmd/farmer) -> farmer API port(s): /v1/enroll, /v1/refresh, /files/,
#        and the remote JWKS fetch
#   out: DNS
# The admin port is bound to 127.0.0.1 and needs no rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "imas-nats.envoy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
spec:
  podSelector:
    matchLabels:
      {{- include "imas-nats.envoy.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $e.listenerPort }} }
      {{- with $np.envoyIngress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "imas-nats.bus.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.bus.ports.websocket }} }
    - to:
        - namespaceSelector:
            {{- toYaml $np.core.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.core.podSelector | nindent 12 }}
      ports:
        {{- range $corePorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    - to:
        - namespaceSelector:
            {{- toYaml $np.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.dns.podSelector | nindent 12 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with $np.envoyExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
