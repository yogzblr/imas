{{- include "imas-nats.validate" . -}}
{{- $seeds := fromYaml (include "imas-nats.seeds" .) | default (dict) -}}
{{- $tlsDir := include "imas-nats.bus.tlsDir" . -}}
{{- $ob := .Values.bus.tls.openbao -}}
{{- $clustered := gt (int .Values.bus.replicaCount) 1 -}}
{{- $cl := .Values.bus.cluster -}}
{{- $as := .Values.accountStore -}}
{{- $ld := .Values.loader -}}
{{- $trustDir := "/var/run/imas/nats-trust" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "imas-nats.bus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: bus
spec:
  serviceName: {{ include "imas-nats.bus.headless" . }}
  replicas: {{ .Values.bus.replicaCount }}
  podManagementPolicy: {{ .Values.bus.podManagementPolicy }}
  {{- with .Values.bus.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "imas-nats.bus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "imas-nats.labels" . | nindent 8 }}
        app.kubernetes.io/component: bus
        {{- with .Values.bus.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/bus-configmap.yaml") . | sha256sum }}
        {{- with .Values.bus.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "imas-nats.bus.serviceAccountName" . }}
      automountServiceAccountToken: false
      # config.LoadConfig folds every env var into the config; don't let
      # Kubernetes inject one per Service in the namespace.
      enableServiceLinks: false
      {{- with .Values.bus.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bus.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.bus.terminationGracePeriodSeconds }}
      {{- with .Values.bus.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bus.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bus.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.bus.affinity }}
        {{- toYaml .Values.bus.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "imas-nats.bus.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.bus.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: farmerbus
          image: {{ include "imas-nats.image" (dict "image" .Values.bus.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.bus.image.pullPolicy }}
          {{- with .Values.bus.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bus.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # ConfigureNats sets LogFile: "nats.log" (relative); keep the
          # working directory on writable storage.
          workingDir: /var/lib/imas/farmerbus
          ports:
            - name: client
              containerPort: {{ .Values.bus.ports.client }}
              protocol: TCP
            - name: websocket
              containerPort: {{ .Values.bus.ports.websocket }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.bus.ports.health }}
              protocol: TCP
            {{- if $clustered }}
            - name: cluster
              containerPort: {{ .Values.bus.cluster.port }}
              protocol: TCP
            {{- end }}
          env:
            # The public trust (pki.ConfigureBusNats): the operator JWT,
            # SYS account and, clustered, the fence user's JWT.
            - name: IMAS_NATS_TRUST_DIR
              value: {{ $trustDir }}
            # Seeds (BUS_FENCE_USER only): one IMAS_NATS_<NAME>_SEED_FILE
            # per mounted key. The _FILE form only: a raw
            # IMAS_NATS_<NAME>_SEED env var would be folded into the jety
            # config and is inherited by children.
            {{- range $name, $key := $seeds }}
            - name: IMAS_NATS_{{ $name }}_SEED_FILE
              value: {{ printf "%s/%s" $.Values.natsSeeds.mountPath $key | quote }}
            {{- end }}
            - name: IMAS_BUS_HEALTH_PORT
              value: {{ .Values.bus.ports.health | quote }}
            {{- if not $clustered }}
            # A single node serves no client but its loader until the
            # loader has loaded the SYS account (cmd/farmerbus sysgate.go):
            # the loader's /readyz, over the pod's loopback.
            - name: IMAS_BUS_LOADER_READY_URL
              value: {{ printf "http://127.0.0.1:%d/readyz" (int .Values.loader.healthPort) | quote }}
            {{- end }}
            {{- if $clustered }}
            # Routes (cmd/farmerbus/cluster.go): mutual TLS with the node
            # cert against the same root CA as the client port, plus the
            # route password from a mounted file. Every node is listed,
            # this one included; the list's length is the cluster size the
            # fence's majority check uses.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: IMAS_BUS_SERVER_NAME
              value: "$(POD_NAME)"
            - name: IMAS_BUS_CLUSTER_NAME
              value: {{ $cl.name | quote }}
            - name: IMAS_BUS_CLUSTER_PORT
              value: {{ $cl.port | quote }}
            - name: IMAS_BUS_CLUSTER_ROUTES
              value: {{ include "imas-nats.bus.routes" . | quote }}
            # Announced to peers for implicit routes: the per-pod headless
            # name the cert carries, not the pod IP it doesn't.
            - name: IMAS_BUS_CLUSTER_ADVERTISE
              value: {{ printf "$(POD_NAME).%s.%s.svc.%s:%d" (include "imas-nats.bus.headless" .) .Release.Namespace (include "imas-nats.clusterDomain" .) (int $cl.port) | quote }}
            - name: IMAS_BUS_CLUSTER_ROUTE_USER
              value: {{ $cl.auth.user | quote }}
            - name: IMAS_BUS_CLUSTER_ROUTE_PASSWORD_FILE
              value: {{ printf "%s/%s" $cl.auth.mountPath $cl.auth.passwordKey | quote }}
            # The fence's cluster size: key "replicas" of the topology
            # ConfigMap, never below the route count.
            - name: IMAS_BUS_CLUSTER_SIZE_FILE
              value: /var/run/imas/bus-topology/replicas
            {{- end }}
            {{- if eq .Values.bus.tls.mode "openbao" }}
            - name: IMAS_CERTS_OPENBAO_ADDR
              value: {{ $ob.addr | quote }}
            - name: IMAS_CERTS_OPENBAO_PKI_MOUNT
              value: {{ $ob.pkiMount | quote }}
            - name: IMAS_CERTS_OPENBAO_ROLE
              value: {{ $ob.role | quote }}
            - name: IMAS_CERTS_OPENBAO_AUTH_METHOD
              value: {{ $ob.authMethod | quote }}
            {{- if $ob.caConfigMap }}
            - name: IMAS_CERTS_OPENBAO_CACERT
              value: /var/run/secrets/openbao-ca/ca.crt
            {{- end }}
            {{- if eq $ob.authMethod "kubernetes" }}
            - name: IMAS_CERTS_OPENBAO_K8S_ROLE
              value: {{ $ob.k8sRole | quote }}
            - name: IMAS_CERTS_OPENBAO_K8S_MOUNT
              value: {{ $ob.k8sMount | quote }}
            - name: IMAS_CERTS_OPENBAO_K8S_JWT_PATH
              value: /var/run/secrets/openbao-auth/token
            {{- else }}
            - name: IMAS_CERTS_OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $ob.tokenSecretName }}
                  key: {{ $ob.tokenSecretKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.bus.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.bus.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bus.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bus.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bus.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/imas/farmer
              subPath: farmer
              readOnly: true
            - name: data
              mountPath: /var/lib/imas/farmerbus
            - name: nats-trust
              mountPath: {{ $trustDir }}
              readOnly: true
            {{- if $seeds }}
            - name: nats-seeds
              mountPath: {{ .Values.natsSeeds.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $clustered }}
            - name: route-auth
              mountPath: {{ $cl.auth.mountPath }}
              readOnly: true
            - name: bus-topology
              mountPath: /var/run/imas/bus-topology
              readOnly: true
            {{- end }}
            {{- if eq .Values.bus.tls.mode "secret" }}
            - name: tls
              mountPath: {{ $tlsDir }}
              readOnly: true
            {{- else }}
            - name: tls
              mountPath: {{ $tlsDir }}
            {{- if $ob.caConfigMap }}
            - name: openbao-ca
              mountPath: /var/run/secrets/openbao-ca
              readOnly: true
            {{- end }}
            {{- if eq $ob.authMethod "kubernetes" }}
            - name: openbao-auth
              mountPath: /var/run/secrets/openbao-auth
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.bus.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        # The account loader (cmd/farmerbus-loader, P21 slice 2): reads
        # every Account JWT from the accounts bucket and pushes it into
        # this pod's node over 127.0.0.1. A regular container, not an init
        # or native sidecar: it pushes through the running server. The pod
        # is Ready only once this container is, i.e. once the node holds
        # every Account in the bucket. Only this container holds the S3
        # read credential and the loader's SYS user seed; farmerbus has
        # neither.
        - name: loader
          image: {{ include "imas-nats.loader.image" . | quote }}
          imagePullPolicy: {{ default .Values.bus.image.pullPolicy $ld.image.pullPolicy }}
          command: ["/farmerbus-loader"]
          ports:
            - name: loader-health
              containerPort: {{ $ld.healthPort }}
              protocol: TCP
          env:
            - name: IMAS_LOADER_S3_ENDPOINT
              value: {{ $as.endpoint | quote }}
            - name: IMAS_LOADER_S3_USE_SSL
              value: {{ $as.useSSL | toString | quote }}
            - name: IMAS_LOADER_S3_BUCKET
              value: {{ $as.bucket | quote }}
            - name: IMAS_LOADER_S3_ACCESS_KEY_ID_FILE
              value: {{ printf "/var/run/secrets/imas/accounts-reader/%s" $as.accessKeyIdKey | quote }}
            - name: IMAS_LOADER_S3_SECRET_ACCESS_KEY_FILE
              value: {{ printf "/var/run/secrets/imas/accounts-reader/%s" $as.secretAccessKeyKey | quote }}
            # Its own node only, never the Service. The TLS name is the
            # bus Service's, which the bus certificate carries.
            - name: IMAS_LOADER_NATS_URL
              value: {{ printf "tls://127.0.0.1:%d" (int .Values.bus.ports.client) | quote }}
            - name: IMAS_LOADER_NATS_SERVER_NAME
              value: {{ include "imas-nats.bus.serviceFQDN" . | quote }}
            # loader-ca: ca.crt alone, in either TLS mode.
            - name: IMAS_LOADER_CA_FILE
              value: /var/run/imas/loader-ca/ca.crt
            # The SYS user JWT the core bootstrap mints (bus-loader-user.jwt
            # in the trust); the seed from loader.sysUserSecret.
            - name: IMAS_NATS_TRUST_DIR
              value: {{ $trustDir }}
            - name: IMAS_LOADER_SYS_USER_JWT_FILE
              value: {{ printf "%s/bus-loader-user.jwt" $trustDir }}
            - name: IMAS_LOADER_SYS_USER_SEED_FILE
              value: {{ printf "/var/run/secrets/imas/loader/%s" $ld.sysUserSeedKey | quote }}
            - name: IMAS_LOADER_EVENT_SUBJECT
              value: {{ $as.eventSubject | quote }}
            - name: IMAS_LOADER_RECONCILE_INTERVAL
              value: {{ $as.reconcileInterval | quote }}
            - name: IMAS_LOADER_FULL_RESYNC_INTERVAL
              value: {{ $as.fullResyncInterval | quote }}
            - name: IMAS_LOADER_HEALTH_PORT
              value: {{ $ld.healthPort | quote }}
            {{- with $ld.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $ld.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ld.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ld.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ld.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ld.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nats-trust
              mountPath: {{ $trustDir }}
              readOnly: true
            - name: loader-sys-user
              mountPath: /var/run/secrets/imas/loader
              readOnly: true
            - name: accounts-reader
              mountPath: /var/run/secrets/imas/accounts-reader
              readOnly: true
            # The bus CA alone, never the tls volume (the bus key): a
            # directory mount, not subPath, so a CA update reaches it.
            - name: loader-ca
              mountPath: /var/run/imas/loader-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "imas-nats.bus.fullname" . }}
        # Public data only. Copied into this namespace from the core
        # release's (README.md, "NATS trust"); the pod waits for it.
        - name: nats-trust
          configMap:
            name: {{ .Values.natsTrust.configMapName }}
        {{- if $seeds }}
        - name: nats-seeds
          secret:
            secretName: {{ .Values.natsSeeds.secretName }}
            defaultMode: 0440
            # Only the listed keys, even if the Secret carries others.
            items:
              {{- range $name, $key := $seeds }}
              - key: {{ $key | quote }}
                path: {{ $key | quote }}
              {{- end }}
        {{- end }}
        {{- if $clustered }}
        - name: route-auth
          secret:
            secretName: {{ $cl.auth.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $cl.auth.passwordKey | quote }}
                path: {{ $cl.auth.passwordKey | quote }}
        - name: bus-topology
          configMap:
            name: {{ include "imas-nats.bus.fullname" . }}-topology
        {{- end }}
        # The loader's secrets: only the listed keys of each.
        - name: loader-sys-user
          secret:
            secretName: {{ $ld.sysUserSecret }}
            defaultMode: 0440
            items:
              - key: {{ $ld.sysUserSeedKey | quote }}
                path: {{ $ld.sysUserSeedKey | quote }}
        - name: accounts-reader
          secret:
            secretName: {{ $as.credentialsSecret }}
            defaultMode: 0440
            items:
              - key: {{ $as.accessKeyIdKey | quote }}
                path: {{ $as.accessKeyIdKey | quote }}
              - key: {{ $as.secretAccessKeyKey | quote }}
                path: {{ $as.secretAccessKeyKey | quote }}
        {{- if eq .Values.bus.tls.mode "secret" }}
        - name: tls
          secret:
            secretName: {{ .Values.bus.tls.secretName }}
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
              - { key: ca.crt, path: ca.crt }
        # The same Secret's CA alone, for the loader: it never sees the
        # bus key.
        - name: loader-ca
          secret:
            secretName: {{ .Values.bus.tls.secretName }}
            defaultMode: 0440
            items:
              - { key: ca.crt, path: ca.crt }
        {{- else }}
        # Issued from OpenBao PKI at every start (internal/certs.GenCert);
        # nothing in farmerbus rotates it while running, so a restart is
        # the rotation. See README.md.
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # The CA the bus certificate is issued from, for the loader: public
        # data, copied into this namespace from the core release's
        # natsTrust.busCAConfigMapName (README.md, "NATS trust"); the pod
        # waits for it. The bus key stays in farmerbus's tls volume.
        - name: loader-ca
          configMap:
            name: {{ $ld.caConfigMap }}
            items:
              - { key: ca.crt, path: ca.crt }
        {{- if $ob.caConfigMap }}
        - name: openbao-ca
          configMap:
            name: {{ $ob.caConfigMap }}
        {{- end }}
        {{- if eq $ob.authMethod "kubernetes" }}
        - name: openbao-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $ob.k8sAudience | quote }}
                  expirationSeconds: 600
        {{- end }}
        {{- end }}
        # The resolver's JWT store (FarmerPKI) and nats.log. No PVC: the
        # loader rebuilds the store from the accounts bucket at every start.
        - name: data
          emptyDir: {}
        {{- with .Values.bus.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
