# Client Service: core (cmd/farmer) dials the TCP port, Envoy dials the
# websocket port. Sprouts never reach this Service directly.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "imas-nats.bus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: bus
  {{- with .Values.bus.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.bus.service.type }}
  selector:
    {{- include "imas-nats.bus.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.bus.ports.client }}
      targetPort: client
      protocol: TCP
    - name: websocket
      port: {{ .Values.bus.ports.websocket }}
      targetPort: websocket
      protocol: TCP
---
# Headless Service: the StatefulSet's governing Service, so every pod gets
# a stable <pod>.<this>.<ns>.svc name. Clustered nodes dial each other's
# route port by those names (IMAS_BUS_CLUSTER_ROUTES) and the bus cert
# carries them. It allocates no virtual IP and is never a client entry
# point: core and Envoy use the client Service above, which has no route
# port. Who may reach the route port is the "-routes" NetworkPolicy's job.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "imas-nats.bus.headless" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "imas-nats.labels" . | nindent 4 }}
    app.kubernetes.io/component: bus
spec:
  clusterIP: None
  # Routes must resolve before a peer is Ready, or a fresh cluster can't
  # form.
  publishNotReadyAddresses: true
  selector:
    {{- include "imas-nats.bus.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.bus.ports.client }}
      targetPort: client
    {{- if gt (int .Values.bus.replicaCount) 1 }}
    - name: cluster
      port: {{ .Values.bus.cluster.port }}
      targetPort: cluster
    {{- end }}
