# Reference Helm values for saasapi's per-tenant enrollment-key rate
# limit. deploy/helm/farmer takes this block under saasapi.
# (saasapi.enrollmentKeys; valkey.addrs as is) and ports
# deployment.env.rate-limit.yaml into its saasapi Deployment
# (TestSaasapiRateLimitEnv in its chart_test.go).
#
# These are the compiled-in defaults (internal/saasapi/router.go). Setting
# a value to null (or leaving the block out) emits no env var, which also
# gives the default. See README.md: the limit is shared across pods only
# when valkey.addrs is set.
valkey:
  # Valkey nodes (host:port) holding the shared rate-limit state. Set this
  # in any deployment with more than one replica. Empty: each pod enforces
  # the limit on its own. Set but unreachable: saasapi won't start.
  addrs: []
  # e.g.
  # addrs:
  #   - valkey-0.valkey:6379
  #   - valkey-1.valkey:6379

enrollmentKeys:
  rateLimit:
    # Sustained POST .../enrollment-keys requests per second, per tenant.
    # A decimal > 0: 0.5 means one every two seconds.
    perSecond: 1
    # Requests a tenant may make back to back before perSecond applies.
    # An integer >= 1.
    burst: 5
