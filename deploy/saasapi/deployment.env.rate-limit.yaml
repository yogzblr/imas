{{- /*
Reference Helm template fragment: env entries for the saasapi container,
reading the values block in values.rate-limit.yaml. NOT rendered by
anything in this repo; paste it under the container's `env:` list in the
ops repo's Deployment template. See README.md.

- A value that is absent or null emits no env var at all, so saasapi uses
  its compiled-in default. (Emitting `int` of a null burst would give "0",
  which saasapi rejects at startup.)
- `quote`: env values must be strings.
- `int` on burst: Helm parses YAML numbers as float64, so a burst of
  1000000 would otherwise render as "1e+06", which saasapi's integer
  parser rejects. The render fails on a fractional burst instead of
  letting `int` silently truncate it. perSecond takes no `int` (0.5 would
  become 0); Go's float parser accepts exponent notation.
- Anything else invalid (0, negative) renders and then stops saasapi at
  startup with an error naming the variable.
- valkey.addrs is a list, joined into the comma-separated form saasapi
  (like farmer's IMAS_VALKEY_ADDRS) expects. An empty list emits nothing.
*/ -}}
{{- with (dig "valkey" "addrs" (list) .Values.AsMap) }}
            - name: SAASAPI_VALKEY_ADDRS
              value: {{ join "," . | quote }}
{{- end }}
{{- with (dig "enrollmentKeys" "rateLimit" (dict) .Values.AsMap) }}
{{- if not (kindIs "invalid" .perSecond) }}
            - name: SAASAPI_ENROLLMENT_KEY_RATE_LIMIT
              value: {{ .perSecond | quote }}
{{- end }}
{{- if not (kindIs "invalid" .burst) }}
{{- if ne (float64 .burst) (float64 (int .burst)) }}
{{- fail (printf "enrollmentKeys.rateLimit.burst must be a whole number, got %v" .burst) }}
{{- end }}
            - name: SAASAPI_ENROLLMENT_KEY_RATE_BURST
              value: {{ .burst | int | quote }}
{{- end }}
{{- end }}
