# Reference Helm values for farmer's job reconcile window.
# deploy/helm/farmer has this block as farmer.jobs.reconcileWindow and
# renders deployment.env.job-reconcile.yaml's logic in its farmer
# Deployment (TestReconcileWindow in its chart_test.go).
jobs:
  # How long after dispatch a job may start on its sprout and still be
  # recorded (IMAS_JOB_RECONCILE_WINDOW). A job whose start is reported
  # later, e.g. a sprout that missed the push and cooked the staged copy
  # long afterwards, is not reconciled: farmer drops its events and marks
  # it "expired" in job listings and in farmer.job_status.
  #
  # A quoted Go duration string: "2h", "90m". null or "" emits no env var,
  # which falls back to farmer's compiled-in default of recording every
  # job whenever it starts.
  #
  # Keep it at least the largest stagedrecipemaxage any sprout uses
  # (sprout default 1h). Otherwise sprouts will run late jobs that farmer
  # marks expired instead of recording.
  reconcileWindow: "2h"
