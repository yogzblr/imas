# Reference Helm values for farmer's job reconcile window. NOT used by
# anything in this repo: farmer's real Deployment and Helm chart live in
# the separate ops repo (see README.md). Merge this block into that
# chart's values.yaml, and deployment.env.job-reconcile.yaml into its
# Deployment template.
jobs:
  # How long after dispatch a job may start on its sprout and still be
  # recorded (IMAS_JOB_RECONCILE_WINDOW). A job whose start is reported
  # later, e.g. a sprout that missed the push and cooked the staged copy
  # long afterwards, is not reconciled: farmer drops all of its events, so
  # it stays "pending" in job listings.
  #
  # A Go duration string: "2h", "90m". null or "" emits no env var, which
  # keeps farmer's default of recording every job whenever it starts.
  #
  # Set it to at least the largest stagedrecipemaxage any sprout uses
  # (sprout default 1h). Otherwise sprouts will run late jobs that farmer
  # never records.
  reconcileWindow: null
  # e.g.
  # reconcileWindow: "2h"
