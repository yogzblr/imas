# Reference External Secrets Operator wiring for the SaaS API credential
# hand-off. deploy/helm/farmer renders it with externalSecrets.enabled
# (extended to every seed farmer mounts); its chart_test.go
# (TestExternalSecretsMatchReference) checks it against this file. Paths
# below are placeholders; the one that matters for
# security review is that SEED_PATH and PUBLISHED_JWT_PATH are DIFFERENT,
# and neither is a prefix of the other (the Job's write policy is scoped to
# PUBLISHED_JWT_PATH alone and must not reach any seed).
#
#   SEED_PATH           = platform/imas/nats-seeds          (ops-written seeds, plus valkey_password,
#                                                            which the OpenBao bootstrap Job generates
#                                                            once and never overwrites; read by ESO only)
#   PUBLISHED_JWT_PATH  = platform/imas/saasapi-nats-user   (written only by the publish Job)
---
# farmer's (and the publish Job's) user NKey seeds: farmer's SYS user and
# the SaaS API's user (P21 slice 1: the trust chain keys are Transit keys
# and never leave OpenBao). Ops generates the seeds into OpenBao; imas
# writes no seed (only the valkey_password property below).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imas-farmer-nats-seeds
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao # read-only ESO role for the farmer namespace
  target:
    name: imas-farmer-nats-seeds
  data:
    - secretKey: sys-user.nk
      remoteRef:
        key: platform/imas/nats-seeds
        property: sys_user
    - secretKey: saasapi-user.nk
      remoteRef:
        key: platform/imas/nats-seeds
        property: saasapi_user
---
# farmer's NKey (IMAS_FARMER_NKEY_SEED_FILE): one user seed every farmer
# replica mounts read-only, so all of them are the same NATS user. Ops
# generates it into SEED_PATH, property farmer_nkey; nothing in imas
# writes it. A Secret of its own: saasapi and the Jobs never mount it
# (deploy/helm/farmer farmer.nkeySecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imas-farmer-nkey
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao # read-only ESO role for the farmer namespace
  target:
    name: imas-farmer-nkey
  data:
    - secretKey: farmer.nk
      remoteRef:
        key: platform/imas/nats-seeds
        property: farmer_nkey
---
# Valkey's password (unit S5): IMAS_VALKEY_PASSWORD_FILE and
# SAASAPI_VALKEY_PASSWORD_FILE point at key "password" of this Secret,
# mounted as a file (never an env var); the bundled Valkey reads the same
# Secret. Property valkey_password of SEED_PATH, which the OpenBao bootstrap
# Job generates when absent and never overwrites (with an external OpenBao,
# ops writes it; docs/OPENBAO-RUNBOOK.md). deploy/helm/farmer
# valkey.auth.secretName/key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imas-valkey-auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao # read-only ESO role for the farmer namespace
  target:
    name: imas-valkey-auth
  data:
    - secretKey: password
      remoteRef:
        key: platform/imas/nats-seeds
        property: valkey_password
---
# saasapi's NATS credential: its seed from SEED_PATH, and the JWT the
# publish Job writes to PUBLISHED_JWT_PATH (field "jwt" — see
# pki.SaaSAPICredentialJWTField). Reloader rolls saasapi when either
# changes; saasapi reads both once at startup (internal/saasapi/config.go).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imas-saasapi-nats
  namespace: saasapi
spec:
  refreshInterval: 1m # short: this is the tail of the rotation window, see README.md
  secretStoreRef:
    kind: SecretStore
    name: openbao # read-only ESO role for the saasapi namespace
  target:
    name: imas-saasapi-nats
  data:
    - secretKey: nats-user.nk # mounted as a file; SAASAPI_NATS_NKEY_SEED_FILE points at it
      remoteRef:
        key: platform/imas/nats-seeds
        property: saasapi_user
    - secretKey: SAASAPI_NATS_USER_JWT # consumed via envFrom/secretKeyRef
      remoteRef:
        key: platform/imas/saasapi-nats-user
        property: jwt
