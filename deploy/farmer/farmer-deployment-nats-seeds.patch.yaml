# Reference strategic-merge patch for farmer's Deployment. Not applied as
# is: deploy/helm/farmer renders the same volume / mount / env-var set from
# natsSeeds, natsTrust and farmer.openbao.natsSign, and its chart_test.go
# (TestFarmerMatchesSeedPatch) fails if the two drift. Apply this by hand
# only outside that chart.
#
# What it does (P21 slice 1): hands farmer its two user-kind NKey seeds
# from OpenBao, via the Kubernetes Secret External Secrets Operator keeps
# in sync (externalsecrets.yaml, "imas-farmer-nats-seeds"):
#   SYS_USER      farmer's SYS account user (its resolver connection);
#                 required, never generated.
#   SAASAPI_USER  the SaaS API's User key, whose JWT farmer mints.
# and farmer's own NKey (P21 slice 3) from its own Secret, which ESO keeps
# in sync too (externalsecrets.yaml, "imas-farmer-nkey"): one user seed
# that every replica mounts read-only (IMAS_FARMER_NKEY_SEED_FILE), so all
# of them are the same NATS user; never generated by farmer.
# and the public NATS trust (operator JWT, operator, operator-signing and
# SYS account public keys, SYS account JWT) from the ConfigMap the OpenBao
# bootstrap Job writes. The operator-signing, SYS account and tenant keys
# farmer signs with are OpenBao Transit keys (IMAS_NATSSIGN_*, role
# imas-farmer-natssign); no OPERATOR, OPERATOR_SIGNING, SYS_ACCOUNT,
# TENANT or TENANT_SIGNING seed exists or is read any more.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imas-farmer
spec:
  template:
    spec:
      containers:
        - name: farmer
          env:
            - name: IMAS_NATS_SYS_USER_SEED_FILE
              value: /var/run/secrets/imas/nats/sys-user.nk
            - name: IMAS_NATS_SAASAPI_USER_SEED_FILE
              value: /var/run/secrets/imas/nats/saasapi-user.nk
            - name: IMAS_FARMER_NKEY_SEED_FILE
              value: /var/run/secrets/imas/farmer-nkey/farmer.nk
            - name: IMAS_NATS_TRUST_DIR
              value: /var/run/imas/nats-trust
            - name: IMAS_NATSSIGN_OPENBAO_AUTH_METHOD
              value: kubernetes
            - name: IMAS_NATSSIGN_OPENBAO_K8S_ROLE
              value: imas-farmer-natssign
            - name: IMAS_NATSSIGN_OPENBAO_K8S_JWT_PATH
              value: /var/run/secrets/openbao-auth/token
            - name: IMAS_NATSSIGN_OPENBAO_TRANSIT_MOUNT
              value: transit
            # Deliberately absent: every IMAS_SAASAPI_CRED_OPENBAO_* var.
            # farmer's long-running process must never be configured with
            # (or able to log in as) the KV-write identity — see README.md.
          volumeMounts:
            - name: nats-seeds
              mountPath: /var/run/secrets/imas/nats
              readOnly: true
            - name: farmer-nkey
              mountPath: /var/run/secrets/imas/farmer-nkey
              readOnly: true
            - name: nats-trust
              mountPath: /var/run/imas/nats-trust
              readOnly: true
      volumes:
        - name: nats-seeds
          secret:
            secretName: imas-farmer-nats-seeds
            defaultMode: 0440
            items:
              - key: sys-user.nk
                path: sys-user.nk
              - key: saasapi-user.nk
                path: saasapi-user.nk
        - name: farmer-nkey
          secret:
            secretName: imas-farmer-nkey
            defaultMode: 0440
            items:
              - key: farmer.nk
                path: farmer.nk
        - name: nats-trust
          configMap:
            name: imas-nats-trust
