# Reference Kubernetes Job for `farmer publish-saasapi-credential`
# (internal/saasapicred): mints the SaaS API's NATS User JWT with farmer's
# own PKI code and writes it to OpenBao KV v2 for External Secrets Operator
# to deliver to the saasapi Deployment. Same precedent as deploy/envoy/:
# reviewed reference config, while real deployment wiring lives in the ops
# repo. Read README.md in this directory first.
#
# FLAG FOR SECURITY REVIEW: the ServiceAccount below is the ONLY identity
# that may authenticate to OpenBao's imas-saasapi-cred-publisher role — the
# one role with write access to the published-JWT path. farmer's own
# ServiceAccount must not be bound to that role, and nothing that runs as
# farmer may be able to create pods/Jobs as this ServiceAccount.
#
# Placeholders: REPLACE_WITH_FARMER_IMAGE, OpenBao address, KV mount/path,
# namespace-specific names.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imas-saasapi-cred-publisher
# No RBAC Role/RoleBinding: the Job needs no Kubernetes API access at all.
# Its token is used only to log in to OpenBao (see the projected volume).
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: imas-saasapi-credential-publish
  annotations:
    # Recommended trigger: after every farmer deployment (README.md,
    # "When to run it"). Keep whichever of these matches the deploy tool.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imas-saasapi-cred-publisher
    spec:
      restartPolicy: Never
      serviceAccountName: imas-saasapi-cred-publisher
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          image: REPLACE_WITH_FARMER_IMAGE # the same image, same tag, as the farmer Deployment
          args: ["publish-saasapi-credential"] # ENTRYPOINT is /farmer
          env:
            # NATS key material — the same Secret, and the same env vars,
            # as farmer's Deployment (farmer-deployment-nats-seeds.patch.yaml).
            # Both are required: the subcommand refuses to generate either.
            - name: IMAS_NATS_SYS_ACCOUNT_SEED_FILE
              value: /var/run/secrets/imas/nats/sys-account.nk
            - name: IMAS_NATS_SAASAPI_USER_SEED_FILE
              value: /var/run/secrets/imas/nats/saasapi-user.nk

            # OpenBao KV-write identity (internal/openbaokv). Distinct env
            # prefix from farmer's IMAS_CERTS_OPENBAO_*/IMAS_GATEWAY_OPENBAO_*.
            - name: IMAS_SAASAPI_CRED_OPENBAO_ADDR
              value: https://openbao.openbao.svc:8200
            - name: IMAS_SAASAPI_CRED_OPENBAO_CACERT
              value: /var/run/secrets/openbao-ca/ca.crt
            - name: IMAS_SAASAPI_CRED_OPENBAO_AUTH_METHOD
              value: kubernetes
            - name: IMAS_SAASAPI_CRED_OPENBAO_K8S_ROLE
              value: imas-saasapi-cred-publisher
            - name: IMAS_SAASAPI_CRED_OPENBAO_K8S_JWT_PATH
              value: /var/run/secrets/openbao-auth/token
            - name: IMAS_SAASAPI_CRED_OPENBAO_KV_MOUNT
              value: secret
            - name: IMAS_SAASAPI_CRED_OPENBAO_KV_PATH
              value: platform/imas/saasapi-nats-user
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: nats-seeds
              mountPath: /var/run/secrets/imas/nats
              readOnly: true
            - name: openbao-auth
              mountPath: /var/run/secrets/openbao-auth
              readOnly: true
            - name: openbao-ca
              mountPath: /var/run/secrets/openbao-ca
              readOnly: true
            # farmer's config root (config file + FarmerPKI). An emptyDir,
            # deliberately NOT farmer's persistent PKI volume — see
            # README.md, "Why an emptyDir".
            - name: imas-config
              mountPath: /etc/imas
      volumes:
        - name: nats-seeds
          secret:
            secretName: imas-farmer-nats-seeds
            defaultMode: 0440
            # Only the two keys the JWT depends on, even if the Secret
            # carries others (e.g. the Operator seeds).
            items:
              - key: sys-account.nk
                path: sys-account.nk
              - key: saasapi-user.nk
                path: saasapi-user.nk
        - name: openbao-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao # must match the OpenBao role's `audience`
                  expirationSeconds: 600
        - name: openbao-ca
          configMap:
            name: openbao-ca
        - name: imas-config
          emptyDir:
            sizeLimit: 16Mi
---
# The Job talks to OpenBao and DNS, nothing else — in particular not the
# NATS bus: with an emptyDir PKI directory it never pushes to the resolver
# (README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imas-saasapi-cred-publisher
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: imas-saasapi-cred-publisher
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - { protocol: TCP, port: 8200 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
