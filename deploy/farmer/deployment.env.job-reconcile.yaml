{{- /*
Reference Helm template fragment: the env entry for the farmer container,
reading jobs.reconcileWindow from values.job-reconcile.yaml. Not rendered
as is: deploy/helm/farmer carries the same logic (on
farmer.jobs.reconcileWindow) in its farmer Deployment. See README.md.

- Absent, null or "": no env var, so farmer records every job (its
  default).
- The value must be a quoted duration string. A bare YAML number (7200)
  has no unit, which farmer would reject at startup, so the render fails
  on it instead.
- Any other invalid string ("soon", "-1h") renders, then stops farmer at
  startup with an error naming IMAS_JOB_RECONCILE_WINDOW.
*/ -}}
{{- with (dig "jobs" "reconcileWindow" "" .Values.AsMap) }}
{{- if not (kindIs "string" .) }}
{{- fail (printf "jobs.reconcileWindow must be a quoted duration such as \"2h\", got %v" .) }}
{{- end }}
            - name: IMAS_JOB_RECONCILE_WINDOW
              value: {{ . | quote }}
{{- end }}
