# Envoy DMZ gateway — docs/design/imas-envoy-enrollment-design.md
# (workstream H, docs/design/imas-fork-roadmap.md).
#
# FLAG FOR SECURITY REVIEW per the task brief that produced this file —
# this is the literal front door of the trust chain. Everything downstream
# (nats-server's own decentralized-JWT auth, every later workstream) trusts
# whatever this config lets through.
#
# Five routes, per the design doc's "Two gates, checking different
# things, not redundant with each other":
#
#   1. /v1/enroll        — NOT jwt_authn-gated (a sprout enrolling has no
#                           JWT yet). Rate-limited instead, on a small
#                           budget of its own: the only credential here is
#                           the join token, so this bucket is what bounds
#                           join-token guessing (design doc's open item,
#                           cloudxp-machine-manager-api-design.md §3.2).
#                           Proxies straight to farmer's existing HTTPS API
#                           (internal/api/handlers/enroll.go).
#   1b. /v1/refresh      — NOT jwt_authn-gated either: an enrolled sprout
#                           renews its gateway JWT here, possibly after it
#                           has expired. Authenticated by farmer instead:
#                           a payloadbox request sealed with the sprout's
#                           box key, answered with a reply sealed back to
#                           it (internal/pki/refreshsealed.go). No NKey
#                           signature (the bus can get one over a CONNECT
#                           nonce) and no join token.
#                           Legitimately high-volume at fleet scale, so it
#                           has its own, much larger rate-limit bucket,
#                           sized from fleet size / gateway JWT TTL (see
#                           README.md, "Sizing the /v1/refresh bucket").
#                           Never shares /v1/enroll's bucket, in either
#                           direction.
#   2. /files/*           — jwt_authn-gated, proxied unmodified (no
#                           prefix_rewrite — the path matches farmer's own
#                           route exactly) to farmer's sprout-facing
#                           recipe download, GET /files/<key>
#                           (internal/api/handlers/recipes.go's GetFile,
#                           the farmer:// scheme's read path), which reads
#                           through object storage rather than local disk
#                           — workstream I ("Recipe storage migration").
#                           Farmer re-verifies the forwarded gateway JWT
#                           itself (internal/api/middleware.go's Auth)
#                           and serves only keys under that sprout's own
#                           sprouts/<tenant_id>/<sprout_id>/ prefix. See
#                           the recipe_service cluster below.
#
#                           Deliberately NOT /v1/recipes: ListRecipes/
#                           GetRecipe are the imas CLI's and web UI's
#                           browse endpoints, authenticated with the
#                           CLI's NKey-signed RBAC token only, which a
#                           sprout doesn't hold — a gateway JWT there is
#                           always rejected. Requests for /v1/recipes fall
#                           through to route 3 and never reach farmer's
#                           HTTP API.
#   2b. /v1/sprout/update-manifest
#                         — jwt_authn-gated, exact path, proxied unmodified
#                           to farmer's GET /v1/sprout/update-manifest
#                           (internal/api/handlers/update_manifest.go,
#                           cloudxp-machine-manager-api-design.md §2.6):
#                           the signed manifest of the sprout's tenant's
#                           approved sprout version. Same recipe_service
#                           cluster and same gate as /files/; farmer
#                           re-verifies the gateway JWT and takes the
#                           tenant from it, never from the query.
#   3. everything else    — the sprout's wss:// NATS connection, jwt_authn-
#                           gated, proxied to nats-server's websocket
#                           listener (internal/pki/nats.go's
#                           NatsConfig.Websocket, config.FarmerWSPort).
#
# JWT: NOT the native NATS User JWT. That token's JOSE header is
# "alg":"ed25519-nkey" (github.com/nats-io/jwt/v2's AlgorithmNkey) — a
# NATS-specific value no standard JOSE library, Envoy's jwt_authn
# included, recognizes, and relabeling it after signing isn't possible
# (the JWS signature covers the header bytes). Envoy instead validates a
# separate "gateway JWT" (internal/gatewayjwt): same subject/tenant/
# sprout claims, same underlying trust chain's sprout identity, but a
# genuinely standard alg:EdDSA JWS, signed by a single platform-wide
# OpenBao Transit key (never a tenant Account key — see
# internal/gatewayjwt's package doc for why that split is deliberate).
# nats-server's own decentralized-JWT auth is entirely unaffected: it
# keeps validating the native NATS User JWT exactly as workstream B built
# it, over the same wss:// connection this config merely proxies (the
# "two gates, checking different things" design).
#
# Verify EdDSA support in the Envoy build being deployed — jwt_authn
# added Ed25519/EdDSA support in a relatively recent Envoy release; pin a
# version known to have it.

static_resources:
  listeners:
    - name: dmz_gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: "/etc/envoy/tls/dmz-cert.pem" }
                    private_key: { filename: "/etc/envoy/tls/dmz-key.pem" }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: dmz_gateway
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: imas_dmz
                      domains: ["*"]
                      routes:
                        # Route 1: enrollment. No JWT gate (design doc
                        # §3.2/"Why this is safe" — only public keys
                        # transit the bus at this stage). Per-route
                        # local_ratelimit stands in for the JWT gate every
                        # other route gets, since this is otherwise the
                        # one unauthenticated DMZ-facing surface.
                        - match: { prefix: "/v1/enroll" }
                          route:
                            cluster: farmer_api
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: enroll_rate_limiter
                              token_bucket:
                                # Sized for a bulk-onboarding Ansible run,
                                # not a steady-state rate. This bucket is
                                # local to one Envoy process: shared by
                                # all of its worker threads (Envoy's
                                # default; local_rate_limit_per_downstream_connection
                                # is unset), and separate from every other
                                # route's bucket, /v1/refresh's included.
                                # With N Envoy replicas the fleet-wide
                                # budget is N x this. It is a coarse bound
                                # (design doc's open item: "Rate-limiting
                                # the enrollment endpoint itself"), not a
                                # substitute for a shared/global rate
                                # limit service.
                                max_tokens: 20
                                tokens_per_fill: 20
                                fill_interval: 60s
                              filter_enabled:
                                runtime_key: enroll_rate_limit_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: enroll_rate_limit_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }

                        # Route 1b: gateway JWT refresh. No JWT gate: a
                        # sprout whose gateway JWT has already expired
                        # (powered off past its TTL) must still be able to
                        # renew it. Farmer authenticates the request by
                        # opening it under the sprout's box key and seals
                        # the new gateway JWT back to it, so nothing here
                        # sees one in the clear
                        # (internal/api/handlers/refresh.go), and only ever
                        # re-issues an existing, accepted identity. Its
                        # own local_ratelimit config, so its own token
                        # bucket (Envoy builds one per route-level config),
                        # sized for the fleet's refresh volume rather than
                        # enrollment's anti-guessing budget. Exact path
                        # match, so nothing else lands in this bucket.
                        - match: { path: "/v1/refresh" }
                          route:
                            cluster: farmer_api
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: refresh_rate_limiter
                              token_bucket:
                                # Per Envoy process, like /v1/enroll's.
                                # These defaults are README.md's worked
                                # example: 1,000,000 sprouts, 24h gateway
                                # JWT TTL, 4 Envoy replicas, 2x headroom
                                # -> 11 refreshes/s per Envoy, with 5
                                # minutes of that as burst. Resize with
                                # values.rate-limit.yaml
                                # (envoy.refreshRateLimit) and
                                # _refresh-rate-limit.tpl, per README.md's
                                # "Sizing the /v1/refresh bucket".
                                max_tokens: 3300
                                tokens_per_fill: 11
                                fill_interval: 1s
                              filter_enabled:
                                runtime_key: refresh_rate_limit_enabled
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: refresh_rate_limit_enforced
                                default_value: { numerator: 100, denominator: HUNDRED }

                        # Route 2: authenticated recipe download. Passed
                        # through unmodified to farmer's own GET /files/
                        # endpoint — see the recipe_service cluster below.
                        # The trailing slash keeps e.g. "/filesystem"
                        # from matching.
                        - match: { prefix: "/files/" }
                          route:
                            cluster: recipe_service
                            timeout: 60s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: sprout_jwt

                        # Route 2b: signed sprout update manifest. Exact
                        # path match (the query string isn't part of it),
                        # so only this one endpoint reaches farmer; any
                        # other /v1/sprout/... path still falls through to
                        # route 3. The response is a small JSON document
                        # farmer serves from cache or one PXC read, hence
                        # the short timeout.
                        - match: { path: "/v1/sprout/update-manifest" }
                          route:
                            cluster: recipe_service
                            timeout: 10s
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: sprout_jwt

                        # Route 3 (default): the sprout's wss:// NATS
                        # connection.
                        - match: { prefix: "/" }
                          route:
                            cluster: nats_websocket
                            timeout: 0s # long-lived websocket connection
                            upgrade_configs:
                              - upgrade_type: websocket
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              requirement_name: sprout_jwt
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        sprout_jwt:
                          # Must match internal/gatewayjwt's
                          # GatewayIssuer constant ("imas-gateway") — a
                          # fixed, platform-wide value, never a tenant
                          # identifier (see that package's doc comment).
                          issuer: imas-gateway
                          # Served by internal/api/handlers/jwks.go via
                          # internal/gatewayjwt.JWKSHandler — the gateway
                          # Transit key's public half(ves), RFC 7517/8037
                          # shaped (kty: OKP, crv: Ed25519).
                          remote_jwks:
                            http_uri:
                              uri: "https://farmer.internal:5405/v1/.well-known/jwks.json"
                              cluster: farmer_api
                              timeout: 5s
                            cache_duration: 300s
                          forward: true
                          # The gateway JWT's `sub` claim is the sprout's
                          # NKey public key — same identity the native
                          # NATS User JWT names (see
                          # internal/gatewayjwt/mint.go's GatewayClaims)
                          # — forwarded as a header so the upstream
                          # (nats-server, or the recipe service) can see
                          # it without re-parsing the token.
                          claim_to_headers:
                            - header_name: x-imas-sprout-nkey
                              claim_name: sub
                      # What the routes' PerRouteConfig requirement_name
                      # refers to. It names an entry in this map, not a
                      # provider: without it Envoy answers every gated
                      # request 403 "Wrong requirement_name", valid token
                      # or not (caught by the real-Envoy tests,
                      # internal/pki and internal/api envoy_e2e_test.go).
                      requirement_map:
                        sprout_jwt:
                          provider_name: sprout_jwt
                      # Only consulted for a route WITHOUT a PerRouteConfig
                      # (every route above has one). Kept so a route added
                      # later without one still requires a JWT by default.
                      rules:
                        - match: { prefix: "/files/" }
                          requires: { provider_name: sprout_jwt }
                        - match: { path: "/v1/sprout/update-manifest" }
                          requires: { provider_name: sprout_jwt }
                        - match: { prefix: "/" }
                          requires: { provider_name: sprout_jwt }
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      # Disabled globally; only the /v1/enroll and
                      # /v1/refresh routes above (typed_per_filter_config)
                      # turn this on, each with its own bucket.
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value: { numerator: 0, denominator: HUNDRED }
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value: { numerator: 0, denominator: HUNDRED }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # farmer's existing HTTPS API (internal/api, cmd/farmer/main.go's
    # StartAPIServer) — backs both /v1/enroll and the JWKS fetch above.
    - name: farmer_api
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: farmer_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: farmer.internal, port_value: 5405 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext

    # nats-server's websocket listener (internal/pki/nats.go's
    # NatsConfig.Websocket, config.FarmerWSPort — 5407 by default).
    - name: nats_websocket
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: nats_websocket
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: farmer.internal, port_value: 5407 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext

    # Points at farmer's sprout-facing recipe download (GET /files/<key> —
    # internal/api/handlers/recipes.go's GetFile, registered in
    # internal/api/routers.go) and its sprout update manifest
    # (GET /v1/sprout/update-manifest), the "small, self-contained service"
    # docs/design/imas-fork-roadmap.md workstream I describes, built
    # directly into farmer's existing HTTPS API rather than as a separate
    # deployable.
    - name: recipe_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: recipe_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: farmer.internal, port_value: 5405 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
