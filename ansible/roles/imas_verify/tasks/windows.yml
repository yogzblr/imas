---
# The Windows counterpart of library/imas_sprout_bus_status.py: see its
# documentation for what counts as enrolled and connected.
#
# The first WinRM calls after the MSI install on a fresh VM can stall for
# minutes (PowerShell module load, assembly compile, a Defender scan of the new
# files) and outlast the WinRM read timeout: UAT Run 2 failed both Windows
# sprouts that way although each was connected. Ansible reports it as UNREACHABLE,
# and `until` never retries it, ignore_unreachable or not: the connection
# error leaves the task's attempt loop. So windows_round.yml warms WinRM up,
# polls with `until` while the host answers, and includes itself again after
# an unreachable attempt, until imas_verify_timeout has passed.
- name: Start the clock for the sprout to connect
  ansible.builtin.set_fact:
    _imas_verify_deadline: "{{ now().timestamp() + imas_verify_timeout | int }}"

- name: Wait for the sprout to enroll and connect to the bus
  ansible.builtin.include_tasks: windows_round.yml

# A host WinRM gave up on is reported as that, not as a sprout that did not
# connect: its state is unknown.
- name: Keep the result for the report
  ansible.builtin.set_fact:
    _imas_verify_status: >-
      {{ {'unreachable': true, 'msg': _imas_verify_winrm_error}
         if _imas_verify_winrm_error | length > 0 else _imas_verify_ps.result | default({}) }}

# Under the service manager the sprout logs to a file, not stderr
# (config.SproutServiceLogDir).
- name: Read the sprout's recent log
  ansible.windows.win_powershell:
    parameters:
      Log: "{{ _imas_verify_pki_dir | win_dirname | win_dirname }}\\logs\\sprout.log"
      Lines: "{{ imas_verify_log_lines | int }}"
    script: |
      [CmdletBinding()]
      param([string]$Log, [int]$Lines)
      $Ansible.Changed = $false
      $Ansible.Result = if (Test-Path -LiteralPath $Log) { @(Get-Content -LiteralPath $Log -Tail $Lines) } else { @("(no log at $Log)") }
  register: _imas_verify_winlog
  failed_when: false
  ignore_unreachable: true
  when: not _imas_verify_status.connected | default(false)

- name: Keep the log for the report
  ansible.builtin.set_fact:
    _imas_verify_log: >-
      {{ ['(could not read the sprout log: ' ~ _imas_verify_winlog.msg | default('') ~ ')']
         if _imas_verify_winlog is unreachable else _imas_verify_winlog.result | default([]) }}
