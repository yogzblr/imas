---
# Every variable is documented in meta/argument_specs.yml, which Ansible
# also validates them against before the role runs.

# --- Enrollment: where the sprout enrolls, and with what ---------------------

# The "{key_id}.{secret}" one-time enrollment key from
# POST /tenants/{tenant_id}/enrollment-keys. A secret: supply it from
# ansible-vault or your runner's secret store, never a committed file.
# Only written to a host that isn't enrolled yet; the sprout deletes it from
# its config file itself once it has enrolled.
imas_join_token: ""

# Host the sprout enrolls with (config key "farmerinterface"): it calls
# https://<imas_farmer_host>:<imas_farmer_api_port>/v1/enroll.
imas_farmer_host: ""
imas_farmer_api_port: 5405

# Bus addresses to pin (config key "busurls"), e.g.
# ["wss://bus.example.com:443"] or ["tls://farmer.example.com:5406"].
# Empty: the sprout connects to the nats_urls farmer returns at enrollment,
# and the role removes any busurls pin it set before.
imas_farmer_bus_urls: []

# PEM of the CA that issued the farmer's (or, behind the DMZ, Envoy's edge)
# TLS certificate. When set, it is written to the sprout's root CA path and
# trust-on-first-use is turned off ("sproutrootcatofu: false"), as a sprout
# behind the DMZ requires (docs/design/imas-envoy-enrollment-design.md).
# The sprout never replaces a root CA file it already has, and neither does
# this role: to rotate it, delete the file on the host first.
imas_sprout_root_ca: ""

# Outbound proxy for the bus connection only (config key "busproxyurl"): an
# "http://host:port" (HTTP CONNECT) or "socks5://host:port" URL, optionally
# with the proxy's own "user:password@". TLS to the bus stays end to end
# through it. Empty (the default): dial directly. The sprout's HTTP
# requests (enroll, refresh, recipes) already follow HTTP_PROXY/HTTPS_PROXY/
# NO_PROXY from the environment and don't need this variable.
imas_sprout_bus_proxy_url: ""

# How long the sprout keeps the X25519 private key a farmer-triggered box
# key rotation replaced (config key "sproutboxkeyprevgrace"), so a payload
# farmer sealed to it just before the switch still opens. Also the shortest
# interval between two rotations: farmer refuses a trigger while the
# previous key is still within its grace window. "" (the default): don't
# manage this key at all — leave whatever is already in the sprout's config
# file alone. A Go duration string, e.g. "30m" or "1h", writes that value.
# Values below the sprout's enforced floor (twice its clock-skew tolerance)
# are raised to it, with a warning in the sprout's own log.
#
# Unlike imas_farmer_bus_urls/imas_sprout_bus_proxy_url, setting this back
# to "" does NOT remove a value this role wrote earlier: the sprout itself
# registers a default for this key and rewrites it into the config file
# with a concrete value (e.g. "15m0s") the moment it next saves the file
# for any other reason (enrolling, clearing its join token), so treating
# an empty file value as something to enforce would fight the sprout's own
# writes on every run. To truly reset it, edit the sprout's config file by
# hand.
imas_sprout_boxkey_prev_grace: ""

# --- Package ------------------------------------------------------------------

# Buildkite organization that owns the imasdeb/imasrpm/imasnget registries
# (https://packages.buildkite.com/yogzblr/imasdeb, .../imasrpm,
# .../imasnget; Helm charts are in .../imashelm).
imas_buildkite_org: yogzblr

# "" installs whatever the repo's newest version is, once. Set a version to
# pin it: on Linux, the package version exactly as the repository lists it,
# which for the release packages is "<release>+git" (e.g. "1.2.3+git":
# .goreleaser.yaml's nfpm version_metadata). On Windows, the release
# ("1.2.3"); "" there means the newest non-prerelease version on the NuGet
# feed, checked on every run.
imas_sprout_version: ""

# present: install if missing (upgrades come from your normal patching of
# the repo). latest: also upgrade to the repo's newest on every run.
# Ignored on Windows, where imas_sprout_version decides.
imas_sprout_package_state: present

# Token for a private Buildkite registry (Read Packages). Leave empty for a
# public one. Linux only: the Windows feed must be public (winget sends no
# credentials, and publish-packages.yml checks the feed serves it anonymously).
imas_sprout_repo_token: ""

imas_sprout_registry_base_url: "https://packages.buildkite.com/{{ imas_buildkite_org }}"
imas_sprout_deb_registry: imasdeb
imas_sprout_rpm_registry: imasrpm
imas_sprout_nuget_registry: imasnget

# Repository URLs, in Buildkite Package Registries' layout. Override them to
# install from a mirror.
imas_sprout_apt_repo_url: "{{ imas_sprout_registry_base_url }}/{{ imas_sprout_deb_registry }}/any/"
imas_sprout_apt_repo_suite: any
imas_sprout_apt_repo_component: main
imas_sprout_apt_gpg_key_url: "{{ imas_sprout_registry_base_url }}/{{ imas_sprout_deb_registry }}/gpgkey"
imas_sprout_rpm_repo_url: "{{ imas_sprout_registry_base_url }}/{{ imas_sprout_rpm_registry }}/rpm_any/rpm_any/$basearch"
imas_sprout_rpm_gpg_key_url: "{{ imas_sprout_registry_base_url }}/{{ imas_sprout_rpm_registry }}/gpgkey"
imas_sprout_nuget_index_url: "{{ imas_sprout_registry_base_url }}/{{ imas_sprout_nuget_registry }}/nuget/index.json"

# Windows: the NuGet package carrying the MSI (build-winget-nupkg.sh's
# installer package).
imas_sprout_windows_nuget_id: imas.sprout.windows.msi
# Windows: a direct MSI URL instead of the NuGet feed, e.g. the GitHub
# release asset or an internal mirror. Downloaded once per URL.
imas_sprout_windows_msi_url: ""
# Windows: SHA-256 of the file downloaded (the .nupkg, or the MSI when
# imas_sprout_windows_msi_url is set). Only meaningful with a pinned version.
imas_sprout_windows_checksum: ""

# --- Self-update ----------------------------------------------------------------

# The repository a self_update installs from (config key
# "sproutupdaterepourl"). The sprout reads that repository's own index, the
# way its package manager does, finds the entry whose SHA-256 is the one in
# the signed update manifest, downloads it over HTTPS (OS trust store,
# HTTPS_PROXY/NO_PROXY), checks it against the signed SHA-256 and installs
# it with dpkg, rpm, zypper or msiexec. By default the same repository this
# role installs from:
#   - Debian family: the apt repository URL (read as an apt repository);
#   - RHEL family and SUSE: the rpm baseurl, $basearch filled in;
#   - Windows: the NuGet feed's index.json, or, with
#     imas_sprout_windows_msi_url, the directory holding that MSI (read as a
#     flat directory of package files).
# "": the key is removed and the sprout refuses every self_update.
#
# Facts are read with default(''): the role validates its arguments (and
# so renders these) before it has gathered facts, e.g. when included from
# a play with gather_facts: false. By the time a value is used, they are
# there.
imas_sprout_update_repo_url: >-
  {{ (imas_sprout_windows_msi_url | regex_replace('[^/]*$', '')
        if imas_sprout_windows_msi_url | length > 0 else imas_sprout_nuget_index_url)
     if ansible_os_family | default('') == 'Windows'
     else imas_sprout_apt_repo_url if ansible_pkg_mgr | default('') == 'apt'
     else imas_sprout_rpm_repo_url | replace('$basearch', ansible_architecture | default('x86_64')) }}

# How the sprout reads imas_sprout_update_repo_url (config key
# "sproutupdaterepoformat"): apt, rpm, nuget or flat (a directory serving each
# package file under its own name). "" means the sprout's own package
# format: apt for a .deb, rpm for an .rpm, nuget for the MSI.
imas_sprout_update_repo_format: "{{ 'flat' if ansible_os_family | default('') == 'Windows' and imas_sprout_windows_msi_url | length > 0 else '' }}"

# The apt suite and component (config key "sproutupdaterepodist"), as in the
# role's sources.list line. Only written on apt hosts.
imas_sprout_update_repo_dist: "{{ imas_sprout_apt_repo_suite }} {{ imas_sprout_apt_repo_component }}"

# Read token the sprout sends (HTTP basic auth, user "buildkite") to the
# repository's own host only (config key "sproutupdaterepotoken"). A secret,
# written only to the sprout's mode-0600 config file. Defaults to
# imas_sprout_repo_token on Linux; "" on Windows, like the repo token.
imas_sprout_update_repo_token: "{{ '' if ansible_os_family | default('') == 'Windows' else imas_sprout_repo_token }}"

# --- Behaviour ------------------------------------------------------------------

imas_sprout_service_name: imas-sprout

# Run imas_verify after enrolling: wait until the sprout is connected to the
# bus, and fail the play if it isn't within imas_verify_timeout.
imas_sprout_verify: true
