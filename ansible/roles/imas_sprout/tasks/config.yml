---
# Merges the settings this role manages into the sprout's config file,
# keeping everything else in it: the sprout writes to the same file itself
# (its defaults on every start, the farmer-assigned sproutid, and an emptied
# jointoken once enrolled), and rewriting it wholesale would lose those.
#
# Expects _imas_sprout_config (the parsed file), _imas_sprout_config_file and
# _imas_sprout_enrolled.

- name: Check the join token
  ansible.builtin.assert:
    that:
      - imas_join_token is defined
      - imas_join_token is match('^[^.\s]+\.\S+$')
    fail_msg: >-
      {{ inventory_hostname }} isn't enrolled yet, and imas_join_token is not
      set or isn't a {key_id}.{secret} enrollment key. Create one with
      POST /tenants/{tenant_id}/enrollment-keys and supply it through
      ansible-vault (see ansible/README.md).
    quiet: true
  when: not _imas_sprout_enrolled | bool

- name: Work out the managed settings
  ansible.builtin.set_fact:
    _imas_sprout_managed: >-
      {{
        {'farmerinterface': imas_farmer_host, 'farmerapiport': imas_farmer_api_port | string,
         'disableshell': imas_sprout_disable_shell | bool}
        | combine({'busurls': imas_farmer_bus_urls} if imas_farmer_bus_urls | length > 0 else {})
        | combine({'sproutrootcatofu': false} if imas_sprout_root_ca | length > 0 else {})
        | combine({'busproxyurl': imas_sprout_bus_proxy_url} if imas_sprout_bus_proxy_url | length > 0 else {})
        | combine({'sproutboxkeyprevgrace': imas_sprout_boxkey_prev_grace} if imas_sprout_boxkey_prev_grace | length > 0 else {})
        | combine({'busreconnectbase': imas_sprout_bus_reconnect_base} if imas_sprout_bus_reconnect_base | length > 0 else {})
        | combine({'busreconnectcap': imas_sprout_bus_reconnect_cap} if imas_sprout_bus_reconnect_cap | length > 0 else {})
        | combine({'sproutupdaterepourl': imas_sprout_update_repo_url | trim} if imas_sprout_update_repo_url | trim | length > 0 else {})
        | combine({'sproutupdaterepotoken': imas_sprout_update_repo_token} if imas_sprout_update_repo_token | length > 0 else {})
        | combine({'sproutupdaterepoformat': imas_sprout_update_repo_format} if imas_sprout_update_repo_format | length > 0 else {})
        | combine({'sproutupdaterepodist': imas_sprout_update_repo_dist}
                  if ansible_pkg_mgr | default('') == 'apt' and imas_sprout_update_repo_dist | trim | length > 0 else {})
        | combine({'sproutupdaterepopackageid': imas_sprout_windows_nuget_id}
                  if ansible_os_family | default('') == 'Windows' and imas_sprout_windows_nuget_id | length > 0 else {})
        | combine({'jointoken': imas_join_token} if not _imas_sprout_enrolled | bool else {})
      }}
    # An empty imas_farmer_bus_urls removes a busurls pin set earlier; same
    # for imas_sprout_bus_proxy_url, which falls back to dialling directly,
    # and for the self-update repository URL and token (an empty URL makes
    # the sprout refuse self_update).
    #
    # imas_sprout_boxkey_prev_grace is deliberately NOT in this list. Unlike
    # busurls/busproxyurl, the sprout itself registers a default for
    # "sproutboxkeyprevgrace" and rewrites it into the config file with a
    # concrete value (e.g. "15m0s") the moment it next saves the file for
    # any other reason (enrolling, clearing its join token) — the file
    # having that key is normal, not drift, so trying to force it absent
    # when unset just fights the sprout's own writes on every run. Only
    # write it when the operator gives an explicit value; leave it alone
    # otherwise. The same goes for imas_sprout_bus_reconnect_base and
    # imas_sprout_bus_reconnect_cap ("busreconnectbase", "busreconnectcap"),
    # whose defaults the sprout writes back as "2s" and "5m0s".
    #
    # imas_sprout_disable_shell ("disableshell") is the opposite case: the
    # sprout has no default for it, so it is always written (true or
    # false) and the sprout only ever writes back the value it read. A
    # boolean compares equal as a string either way ("False" == "False").
    _imas_sprout_unmanaged: >-
      {{
        (['busurls'] if imas_farmer_bus_urls | length == 0 else [])
        + (['busproxyurl'] if imas_sprout_bus_proxy_url | length == 0 else [])
        + (['sproutupdaterepourl'] if imas_sprout_update_repo_url | trim | length == 0 else [])
        + (['sproutupdaterepotoken'] if imas_sprout_update_repo_token | length == 0 else [])
        + (['sproutupdaterepoformat'] if imas_sprout_update_repo_format | length == 0 else [])
      }}
  no_log: true

# Compared as strings, since the sprout rewrites the file with its own YAML
# encoder (a port may come back as 5405 or "5405").
- name: Compare them with the config file
  ansible.builtin.set_fact:
    _imas_sprout_config_drift: >-
      {%- set ns = namespace(drift=false) -%}
      {%- for key, value in _imas_sprout_managed.items() -%}
      {%-   if key not in _imas_sprout_config or (_imas_sprout_config[key] | string) != (value | string) -%}
      {%-     set ns.drift = true -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for key in _imas_sprout_unmanaged -%}
      {%-   if _imas_sprout_config[key] | default(none) not in [none, '', []] -%}
      {%-     set ns.drift = true -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.drift }}
    _imas_sprout_config_new: >-
      {{
        _imas_sprout_config | combine(_imas_sprout_managed)
        | dict2items | rejectattr('key', 'in', _imas_sprout_unmanaged) | items2dict
      }}
  no_log: true

- name: Write the enrollment settings to the sprout's config file
  ansible.builtin.copy:
    content: "{{ _imas_sprout_config_new | to_nice_yaml(indent=2) }}"
    dest: "{{ _imas_sprout_config_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - _imas_sprout_config_drift | bool
    - ansible_os_family != 'Windows'
  notify: Restart imas-sprout
  no_log: true

- name: Write the enrollment settings to the sprout's config file (Windows)
  ansible.windows.win_copy:
    content: "{{ _imas_sprout_config_new | to_nice_yaml(indent=2) }}"
    dest: "{{ _imas_sprout_config_file }}"
  when:
    - _imas_sprout_config_drift | bool
    - ansible_os_family == 'Windows'
  notify: Restart imas-sprout
  no_log: true
