---
# The imasrpm registry, the way Buildkite Package Registries documents an
# RPM source: signed repository metadata (repo_gpgcheck), unsigned packages.
- name: Create the rpm key directory
  ansible.builtin.file:
    path: /etc/pki/rpm-gpg
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the imas rpm repository's signing key
  ansible.builtin.get_url:
    url: "{{ imas_sprout_rpm_gpg_key_url }}"
    dest: "{{ _imas_sprout_rpm_key }}"
    owner: root
    group: root
    mode: "0644"
    url_username: "{{ 'buildkite' if imas_sprout_repo_token | length > 0 else omit }}"
    url_password: "{{ imas_sprout_repo_token if imas_sprout_repo_token | length > 0 else omit }}"
    force_basic_auth: "{{ imas_sprout_repo_token | length > 0 }}"
  no_log: "{{ imas_sprout_repo_token | length > 0 }}"

# The repo file holds the token when there is one, so it's root-only then.
- name: Add the imas yum repository
  ansible.builtin.yum_repository:
    name: "imas-{{ imas_sprout_rpm_registry }}"
    description: imas packages ({{ imas_sprout_rpm_registry }})
    baseurl: "{{ imas_sprout_rpm_repo_url }}"
    gpgkey: "file://{{ _imas_sprout_rpm_key }}"
    repo_gpgcheck: true
    gpgcheck: false
    enabled: true
    username: "{{ 'buildkite' if imas_sprout_repo_token | length > 0 else omit }}"
    password: "{{ imas_sprout_repo_token if imas_sprout_repo_token | length > 0 else omit }}"
    mode: "{{ '0600' if imas_sprout_repo_token | length > 0 else '0644' }}"
  no_log: "{{ imas_sprout_repo_token | length > 0 }}"
