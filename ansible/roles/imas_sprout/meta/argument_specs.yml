---
argument_specs:
  main:
    short_description: Install imas-sprout from the imas package repositories and enroll it.
    description:
      - Adds the imas apt/yum/zypper repository and installs imas-sprout through the
        package manager (Linux), or installs the imas-sprout MSI (Windows).
      - Writes the enrollment settings into the sprout's own config file, starts the
        service, and (imas_sprout_verify) waits until the sprout is connected to the bus.
      - A host that is already enrolled is never given the join token again.
    options:
      imas_join_token:
        type: str
        description:
          - One-time enrollment key, C({key_id}.{secret}), from
            POST /tenants/{tenant_id}/enrollment-keys. Required for a host that isn't enrolled.
          - Supply it with ansible-vault or a secret store; never commit it.
      imas_farmer_host:
        type: str
        required: true
        description: Host the sprout enrolls with (config key C(farmerinterface)).
      imas_farmer_api_port:
        type: int
        description: Port of the enrollment API (config key C(farmerapiport)).
      imas_farmer_bus_urls:
        type: list
        elements: str
        description:
          - Bus addresses to pin (config key C(busurls)), each C(wss://), C(tls://) or C(nats://).
          - Empty uses the addresses farmer returns at enrollment.
      imas_sprout_root_ca:
        type: str
        description:
          - PEM CA certificate(s) to pre-provision as the sprout's root CA. Also sets
            C(sproutrootcatofu=false). Required for a sprout behind the DMZ Envoy.
      imas_sprout_bus_proxy_url:
        type: str
        description:
          - Outbound proxy for the bus connection only (config key C(busproxyurl)),
            C(http://host:port) (HTTP CONNECT) or C(socks5://host:port), optionally
            with C(user:password@). Empty dials directly. The sprout's HTTP requests
            already follow C(HTTP_PROXY)/C(HTTPS_PROXY)/C(NO_PROXY) and don't need this.
      imas_sprout_boxkey_prev_grace:
        type: str
        description:
          - How long the sprout keeps the private key a farmer-triggered box key
            rotation replaced (config key C(sproutboxkeyprevgrace)), and so the
            shortest interval between rotations. A Go duration string, e.g. C(30m).
          - Empty leaves this key alone rather than clearing it, since the sprout
            writes its own default value into the config file on other saves
            (enrolling, clearing its join token). This role only ever adds an
            explicit override and never tries to remove one.
      imas_sprout_bus_reconnect_base:
        type: str
        description:
          - Ceiling of the random wait before the first attempt to reach the bus
            after losing it (config key C(busreconnectbase)). It doubles with
            every failed attempt up to imas_sprout_bus_reconnect_cap and returns
            to this value once connected. A Go duration string, e.g. C(1s).
          - Empty leaves the key alone (the sprout's default is C(2s)). Like
            imas_sprout_boxkey_prev_grace, the role only ever adds an override and
            never removes one, since the sprout writes its own default into the
            config file.
      imas_sprout_bus_reconnect_cap:
        type: str
        description:
          - Largest wait before an attempt to reach the bus (config key
            C(busreconnectcap)). A Go duration string, e.g. C(10m).
          - Empty leaves the key alone (the sprout's default is C(5m)). Only ever
            added, never removed, like imas_sprout_bus_reconnect_base.
      imas_sprout_disable_shell:
        type: bool
        description:
          - Refuse every interactive shell session (C(imas ssh)) on this host,
            whatever farmer allows (config key C(disableshell)). Checked by the
            sprout before anything else, so it doesn't depend on farmer.
          - Default C(false). Always written as C(true) or C(false); the sprout
            has no default of its own for the key, so it never rewrites it.
      imas_buildkite_org:
        type: str
        description:
          - Buildkite organization owning the imas package registries (default
            C(yogzblr)). Override it, or every repository URL, to install from your own.
      imas_sprout_version:
        type: str
        description:
          - Version to pin. Empty for the newest.
          - Linux, the package version as the repository lists it, e.g. C(1.2.3+git).
            Windows, the release, e.g. C(1.2.3).
      imas_sprout_package_state:
        type: str
        choices: [present, latest]
        description: Linux package state. C(latest) upgrades on every run.
      imas_sprout_update_repo_url:
        type: str
        description:
          - Repository a self_update installs from (config key C(sproutupdaterepourl)),
            C(https://) only. The sprout reads its index and fetches the entry with the
            signed SHA-256.
          - Defaults to the repository this role installs from (apt URL, rpm baseurl,
            NuGet index.json, or the directory of imas_sprout_windows_msi_url); empty
            removes the key and the sprout refuses every self_update.
      imas_sprout_update_repo_format:
        type: str
        choices: ["", apt, rpm, nuget, flat]
        description:
          - How the sprout reads imas_sprout_update_repo_url (config key
            C(sproutupdaterepoformat)). Empty means the sprout's own package format.
      imas_sprout_update_repo_dist:
        type: str
        description:
          - apt suite and component (config key C(sproutupdaterepodist)). Defaults to
            imas_sprout_apt_repo_suite and imas_sprout_apt_repo_component.
      imas_sprout_update_repo_token:
        type: str
        description:
          - Read token for imas_sprout_update_repo_url (config key C(sproutupdaterepotoken)),
            sent as basic auth with user C(buildkite). Defaults to imas_sprout_repo_token on
            Linux and empty on Windows.
      imas_sprout_repo_token:
        type: str
        description: Buildkite registry token, for private Linux registries.
      imas_sprout_registry_base_url:
        type: str
        description: Base URL of the package registries.
      imas_sprout_deb_registry:
        type: str
        description: Debian registry name.
      imas_sprout_rpm_registry:
        type: str
        description: RPM registry name (RHEL family and SUSE).
      imas_sprout_nuget_registry:
        type: str
        description: NuGet registry name (Windows).
      imas_sprout_apt_repo_url:
        type: str
        description: apt repository URL.
      imas_sprout_apt_repo_suite:
        type: str
        description: apt repository suite.
      imas_sprout_apt_repo_component:
        type: str
        description: apt repository component.
      imas_sprout_apt_gpg_key_url:
        type: str
        description: URL of the key the apt repository's metadata is signed with.
      imas_sprout_rpm_repo_url:
        type: str
        description: yum/zypper repository base URL (may contain C($basearch)).
      imas_sprout_rpm_gpg_key_url:
        type: str
        description: URL of the key the rpm repository's metadata is signed with.
      imas_sprout_nuget_index_url:
        type: str
        description: NuGet v3 service index of the Windows feed.
      imas_sprout_windows_nuget_id:
        type: str
        description: NuGet package id carrying the MSI.
      imas_sprout_windows_msi_url:
        type: str
        description: Direct MSI URL, used instead of the NuGet feed.
      imas_sprout_windows_checksum:
        type: str
        description: SHA-256 of the downloaded Windows installer file.
      imas_sprout_service_name:
        type: str
        description: Service name (systemd unit / Windows service).
      imas_sprout_verify:
        type: bool
        description: Wait for the sprout to connect to the bus (role imas_verify).
