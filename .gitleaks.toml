# Extends gitleaks' default rules (the Gitleaks workflow picks this file up
# from the checkout). The allowlist covers only the dummy enrollment keys the
# Ansible Molecule scenario and the stub farmer's tests use: their secret
# halves are base64 for "stubfarmer-join-token" and "secret", and two
# internal/payloadbox purpose labels whose constant names contain "Key"
# (generic-api-key reads them as credentials; they're fixed protocol
# strings, not secrets). Add a real fixture here by its exact value, never
# by path.
[extend]
useDefault = true

[allowlist]
description = "Dummy enrollment keys used by ansible/molecule, and payloadbox purpose labels (not credentials)"
regexTarget = "match"
regexes = [
  '''ek_molecule\.c3R1YmZhcm1lci1qb2luLXRva2Vu''',
  '''ek91cd2a\.c2VjcmV0''',
  '''PurposeBoxKeySubmit\s*=\s*"s2f\.boxkey\.pub"''',
  '''PurposeTenantKeyContinuity\s*=\s*"f2s\.tenantkey\.continuity"''',
  # Dummy log-sink marker in SEC.3b's cmd.run test as first committed
  # (5f3480f); replaced since, but that commit stays in history.
  '''secret\s*=\s*"s3cret-cmd-91fe"''',
  # Object path in FIX.3's access-probe test (internal/objectstore
  # probe_test.go) as first committed (2569cbe); replaced since by a
  # positional literal, but that commit stays in history.
  '''Key:\s*"sprouts/probe/missing"''',
  # The dummy root secret key of internal/versitysetup's tests (H3): a
  # fixture for a fake S3 gateway, never a credential anywhere.
  '''rootSecret\s*=\s*"root-secret-key-0123456789"''',
  # The dummy operator token of uat/hub/core/test/finish_test.sh (R1) as
  # first committed (490868b); generated per run since, but that commit
  # stays in history. A stub's value, never a credential anywhere.
  '''FS_TOKEN=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  # Dummy secrets of S2's audit redaction tests (internal/audit
  # redact_test.go, internal/natsapi audit_redact_test.go): each exists to
  # prove the audit log masks it. The JWTs' payloads are {"sub":"UABC",...}
  # and {"sub":"UFIXTURE"} with the signature "signature-bytes-here" and
  # "fixture-signature" in base64; the PEM blocks hold no key.
  '''password:\s*"hunter2-pw-fixture"''',
  '''apiKey:\s*"apikey-fixture-0042"''',
  '''eyJhbGciOiJlZDI1NTE5LW5rZXkifQ\.eyJzdWIiOiJVRklYVFVSRSJ9\.Zml4dHVyZS1zaWduYXR1cmU''',
  '''eyJhbGciOiJlZDI1NTE5LW5rZXkiLCJ0eXAiOiJKV1QifQ\.eyJzdWIiOiJVQUJDIiwibmFtZSI6ImFsaWNlIn0\.c2lnbmF0dXJlLWJ5dGVzLWhlcmU''',
  '''curl -H 'Authorization: Bearer abc\.def-ghi'''',
  '''-----BEGIN RSA PRIVATE KEY-----\\nMIIEow\\n-----END RSA PRIVATE KEY-----''',
  # The signature domain of the legacy NKey registration's proof of
  # possession (T6, internal/pki/nkeynonce.go): a fixed protocol label
  # like enrollSigDomain, not a credential.
  '''nkeySubmissionDomain\s*=\s*"imas-putnkey-v1"''',
  # The dummy tenant key fingerprint internal/saasapi's tests mint join
  # tokens with (U2, sealedfarmer_test.go): a SHA-256-shaped placeholder
  # standing in for farmer's answer, a hash of no key, not a credential.
  '''testTenantKeyFingerprint\s*=\s*"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"''',
]
