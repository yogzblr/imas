# Extends gitleaks' default rules (the Gitleaks workflow picks this file up
# from the checkout). The allowlist covers only the dummy enrollment keys the
# Ansible Molecule scenario and the stub farmer's tests use: their secret
# halves are base64 for "stubfarmer-join-token" and "secret", and two
# internal/payloadbox purpose labels whose constant names contain "Key"
# (generic-api-key reads them as credentials; they're fixed protocol
# strings, not secrets). Add a real fixture here by its exact value, never
# by path.
[extend]
useDefault = true

[allowlist]
description = "Dummy enrollment keys used by ansible/molecule, and payloadbox purpose labels (not credentials)"
regexTarget = "match"
regexes = [
  '''ek_molecule\.c3R1YmZhcm1lci1qb2luLXRva2Vu''',
  '''ek91cd2a\.c2VjcmV0''',
  '''PurposeBoxKeySubmit\s*=\s*"s2f\.boxkey\.pub"''',
  '''PurposeTenantKeyContinuity\s*=\s*"f2s\.tenantkey\.continuity"''',
  # Dummy log-sink marker in SEC.3b's cmd.run test as first committed
  # (5f3480f); replaced since, but that commit stays in history.
  '''secret\s*=\s*"s3cret-cmd-91fe"''',
  # Object path in FIX.3's access-probe test (internal/objectstore
  # probe_test.go) as first committed (2569cbe); replaced since by a
  # positional literal, but that commit stays in history.
  '''Key:\s*"sprouts/probe/missing"''',
]
